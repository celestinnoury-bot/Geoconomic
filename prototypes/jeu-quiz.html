<meta charset="utf-8">
<title>Géoconomic Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Plateau de jeu télévisé, version poche : une colonne, des gros boutons « en relief », un bandeau de score en haut.
   Un seul monde visuel, sombre, assumé (comme l'appli Géoconomic). */
:root {
  --bg: #0a0d14;
  --panel: #131826;
  --panel-2: #1b2133;
  --line: rgba(196, 210, 255, .12);
  --text: #eef1f8;
  --muted: #8d96ab;
  --mint: #3ddc97;
  --mint-deep: #1f9e68;
  --gold: #f5c86b;
  --red: #ff5f6d;
  --red-deep: #b8323f;
  --blue: #5aa9ff;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--body); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* En-tête : marque + compteurs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.brand b { color: var(--mint); }
.counters { display: flex; gap: 14px; font-weight: 700; }
.counter { display: flex; align-items: center; gap: 5px; }
.counter svg { width: 20px; height: 20px; }

main { padding-block: 20px 110px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(2, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--mint); }

/* Boutons « en relief » */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 800; font-size: 16px; letter-spacing: .02em; cursor: pointer; background: var(--mint); color: #062317; box-shadow: 0 4px 0 var(--mint-deep); transition: transform .08s, box-shadow .08s; text-transform: uppercase; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mint-deep); }
.btn.ghost { background: var(--panel-2); color: var(--text); box-shadow: 0 4px 0 #0b0f19; }
.btn.gold { background: var(--gold); color: #2b1d00; box-shadow: 0 4px 0 #b88d33; }
.btn.blue { background: var(--blue); color: #021327; box-shadow: 0 4px 0 #2d6fbf; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.stack { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.muted { color: var(--muted); }

/* Bandeau du défi du jour */
.daily { position: relative; overflow: hidden; background: linear-gradient(135deg, #1a2a22 0%, #131826 60%); border-color: rgba(61, 220, 151, .35); }
.daily h2 { font-size: 26px; margin: 6px 0 6px; }
.daily .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.daily::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 18px solid rgba(61, 220, 151, .08); }

/* Parcours */
.unit { margin-top: 28px; }
.unit-head { border-radius: 18px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.unit-head h3 { font-size: 20px; }
.unit-head p { margin: 2px 0 0; font-size: 14px; opacity: .85; }
.u-eco .unit-head { background: #3a2412; color: #ffd7b0; }
.u-geo .unit-head { background: #1d1f45; color: #cfd2ff; }
.u-hist .unit-head { background: #3a1a2b; color: #ffcde3; }
.u-carte .unit-head { background: #11303a; color: #b8f0ff; }
.path { display: grid; justify-items: center; gap: 18px; padding: 24px 0 8px; }
.node { width: 72px; height: 66px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; background: var(--panel-2); color: var(--muted); box-shadow: 0 6px 0 #0b0f19; position: relative; }
.node svg { width: 30px; height: 30px; }
.node.done { background: var(--gold); color: #2b1d00; box-shadow: 0 6px 0 #b88d33; }
.node.current { background: var(--mint); color: #062317; box-shadow: 0 6px 0 var(--mint-deep); }
.node.current::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid rgba(61, 220, 151, .45); animation: pulse 1.6s ease-in-out infinite; }
.node.locked { cursor: not-allowed; }
.node:active:not(.locked) { transform: translateY(4px); box-shadow: 0 2px 0 #0b0f19; }
.bubble { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mint); background: var(--panel); border: 2px solid var(--mint); padding: 5px 10px; border-radius: 10px; margin-bottom: -8px; }
@keyframes pulse { 50% { transform: scale(1.08); opacity: .4; } }

/* Défis */
.mode { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; }
.mode-ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; }
.mode-ico svg { width: 30px; height: 30px; }
.mode h3 { font-size: 20px; }
.mode p { margin: 4px 0 12px; color: var(--muted); font-size: 15px; }
.mode .btns { display: flex; flex-wrap: wrap; gap: 10px; }
.join { display: flex; gap: 8px; margin-top: 12px; }
.join input { flex: 1; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--text); font: 700 18px var(--display); letter-spacing: .2em; text-transform: uppercase; }
.duel-list { display: grid; gap: 8px; margin-top: 14px; }
.duel-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel-2); border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: left; }
.duel-item b { font-family: var(--display); letter-spacing: .12em; }

/* Classement */
.rank { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); }
.rank li.me { outline: 2px solid var(--mint); }
.rank .pos { font-family: var(--display); font-weight: 800; color: var(--muted); }
.rank li:nth-child(1) .pos { color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-family: var(--display); font-size: 26px; }
.stat span { font-size: 13px; color: var(--muted); }

/* ---------- Écran de jeu ---------- */
#play { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.play-top { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
.x { background: none; border: 0; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.x svg { width: 22px; height: 22px; }
.bar { flex: 1; height: 14px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mint); border-radius: 99px; transition: width .4s; }
.hearts { display: flex; align-items: center; gap: 4px; font-weight: 800; color: var(--red); }
.hearts svg { width: 22px; height: 22px; }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; margin-bottom: 8px; }
.side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.side.right { justify-content: flex-end; text-align: right; }
.avatar { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
.avatar.you { background: var(--mint); color: #062317; }
.avatar.opp { background: var(--blue); color: #021327; }
.side .who { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .pts { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
.vs { font-family: var(--display); font-weight: 800; color: var(--muted); }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0 10px; }
.chip { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.chip.eco { color: #ffb37a; } .chip.geo { color: #a9adff; } .chip.hist { color: #ff9cc8; } .chip.carte { color: #7fe3ff; }
.timer { width: 46px; height: 46px; position: relative; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 5; }
.timer .bg { stroke: var(--panel-2); }
.timer .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.timer.low .fg { stroke: var(--red); }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
.question { font-size: clamp(24px, 6vw, 30px); line-height: 1.2; margin: 6px 0 22px; }
.answers { display: grid; gap: 12px; }
.ans { text-align: left; width: 100%; border: 2px solid var(--line); background: var(--panel); border-radius: 16px; padding: 16px 18px; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 0 #0b0f19; transition: transform .08s, box-shadow .08s, border-color .15s; }
.ans:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 #0b0f19; }
.ans.sel { border-color: var(--blue); background: #15233a; }
.ans.good { border-color: var(--mint); background: #12321f; color: #c6ffe3; }
.ans.bad { border-color: var(--red); background: #3a141b; color: #ffd1d6; }
.ans[disabled] { cursor: default; }
.grid2 { grid-template-columns: 1fr 1fr; }
.grid2 .ans { text-align: center; }
.order-card { text-align: center; min-height: 120px; display: grid; place-items: center; }

/* Duo ou carré */
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.choice button { border: 0; border-radius: 20px; padding: 22px 12px; cursor: pointer; display: grid; gap: 6px; justify-items: center; }
.choice .duo { background: #1d2c4a; box-shadow: 0 5px 0 #0f1a2e; }
.choice .carre { background: #3a2a10; box-shadow: 0 5px 0 #20170a; }
.choice b { font-family: var(--display); font-size: 26px; }
.choice span { font-size: 14px; color: var(--muted); }
.dots { display: grid; grid-template-columns: repeat(2, 12px); gap: 5px; }
.dots i { width: 12px; height: 12px; border-radius: 3px; background: currentColor; }

/* Année */
.year { text-align: center; }
.year-big { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 20vw, 96px); line-height: 1; letter-spacing: -.02em; color: var(--gold); }
.year input[type=range] { width: 100%; margin: 18px 0 10px; accent-color: var(--gold); height: 32px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.steps button { border: 0; background: var(--panel-2); border-radius: 12px; padding: 12px 0; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #0b0f19; }
.range-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* Intrus */
.intrus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.intrus .ans { font-size: 16px; text-align: center; padding: 14px 10px; }

/* Feuille de correction */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-top: 18px; animation: up .25s ease-out; }
.sheet.ok { background: #10291c; border-top: 2px solid var(--mint); }
.sheet.ko { background: #2c1117; border-top: 2px solid var(--red); }
.sheet.neutral { background: var(--panel); border-top: 2px solid var(--gold); }
.sheet h3 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--mint); } .sheet.ko h3 { color: var(--red); } .sheet.neutral h3 { color: var(--gold); }
.sheet p { margin: 6px 0 0; font-size: 15px; }
.sheet .opp-line { margin-top: 8px; font-size: 14px; color: var(--muted); }
.sheet .btn { margin-top: 14px; }
.spacer { height: 230px; }
@keyframes up { from { transform: translateY(100%); } }

/* Écrans d'annonce et de fin */
.splash { min-height: 70vh; display: grid; align-content: center; justify-items: center; text-align: center; gap: 14px; padding-block: 30px; }
.splash .big { font-size: clamp(36px, 10vw, 52px); line-height: 1.05; }
.splash .rules { color: var(--muted); max-width: 40ch; }
.splash .btn { min-width: 220px; }
.splash .ico { width: 84px; height: 84px; border-radius: 26px; display: grid; place-items: center; }
.splash .ico svg { width: 46px; height: 46px; }
.sd { color: var(--red); }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 420px; }
.result-grid .stat b { font-size: 21px; white-space: nowrap; }
.code { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: .2em; color: var(--gold); }
.note { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .node.current::before, .sheet { animation: none; } }
/* Meilleur joueur, podium, direct */
.champion { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin-bottom: 16px; padding: 14px 18px; border-radius: 20px; background: linear-gradient(120deg, #3a2a10, #1b2133 70%); border: 1px solid rgba(245, 200, 107, .4); }
.champion .crown { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--gold); color: #2b1d00; }
.champion .crown svg { width: 26px; height: 26px; }
.ch-main { min-width: 0; display: grid; }
.ch-main b { font-family: var(--display); font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-main small { color: var(--muted); font-size: 13px; }
.ch-pts { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--gold); }
.ch-pts small { font-size: 13px; margin-left: 3px; color: var(--muted); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 8px; margin-top: 16px; }
.pod { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.pod b { font-size: 14px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod .num { font-size: 13px; color: var(--muted); }
.pod .step { width: 100%; border-radius: 12px 12px 0 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 26px; color: #2b1d00; }
.pod.p1 .step { height: 90px; background: var(--gold); }
.pod.p2 .step { height: 64px; background: #c9cfdc; }
.pod.p3 .step { height: 48px; background: #d79a62; }
.live-card { border-color: rgba(61, 220, 151, .35); }
.live-badge { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; margin-left: 6px; font: 800 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--red); background: rgba(255, 95, 109, .12); padding: 4px 8px; border-radius: 99px; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; animation: blink 1.2s ease-in-out infinite; vertical-align: middle; }
.live-badge .live-dot { margin-right: 0; }
.searching { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; font-weight: 700; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--panel-2); border-top-color: var(--mint); animation: spin .8s linear infinite; }
.chip.combo { color: var(--gold); }
.chip.combo.hot { background: var(--gold); color: #2b1d00; }
@keyframes blink { 50% { opacity: .3; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .live-dot, .spinner { animation: none; } }
/* Réponse écrite et niveaux */
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 4px 0 6px; }
.levels i { height: 6px; border-radius: 99px; background: var(--panel-2); }
.levels i.passed { background: var(--mint); }
.levels i.now { background: var(--red); }
.levels.big { margin: 0 0 14px; }
.levels.big span { font-size: 11px; font-weight: 700; text-align: center; padding: 5px 0; border-radius: 8px; background: linear-gradient(90deg, rgba(255,95,109,.08), rgba(255,95,109,.25)); color: #ffc2c8; }
.levels.big span:nth-child(1) { background: rgba(255,95,109,.06); } .levels.big span:nth-child(2) { background: rgba(255,95,109,.11); } .levels.big span:nth-child(3) { background: rgba(255,95,109,.16); } .levels.big span:nth-child(4) { background: rgba(255,95,109,.22); } .levels.big span:nth-child(5) { background: rgba(255,95,109,.3); }
.type-box { display: grid; gap: 12px; }
.type-box input { width: 100%; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; color: var(--text); font: 600 20px var(--body); }
.type-box input.year-in { font: 800 44px var(--display); text-align: center; letter-spacing: .12em; color: var(--gold); padding: 12px; }
.type-box input:focus { border-color: var(--blue); outline: none; }
.type-box input.good { border-color: var(--mint); background: #12321f; }
.type-box input.bad { border-color: var(--red); background: #3a141b; }
.cooldown { display: inline-flex; align-items: center; padding: 12px 16px; border-radius: 14px; background: var(--panel-2); color: var(--muted); font-weight: 700; font-size: 14px; }
.ms-card { border-color: rgba(255, 95, 109, .35); }
.ms-grid { display: grid; grid-template-columns: repeat(5, 30px) 1fr; gap: 6px; align-items: center; margin: 12px 0; }
.ms-grid span { height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.ms-grid span.ok { background: #12321f; color: var(--mint); }
.ms-grid span.ko { background: #3a141b; color: var(--red); }
.ms-grid b { font-size: 14px; margin-left: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.daily .reward { color: var(--gold); font-weight: 800; }
/* Grades */
.grades { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.grades li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; }
.grades b { display: block; }
.grades span { color: var(--muted); font-size: 14px; }
.g-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-2); color: var(--mint); }
.g-ico svg { width: 22px; height: 22px; }
.rank-ico { font-family: var(--display); font-weight: 800; font-size: 20px; }
.pod .gchip { white-space: normal; text-align: center; line-height: 1.25; border-radius: 8px; padding: 4px 6px; font-size: 10px; }
.master-ico { background: var(--gold); color: #2b1d00; }
.elite-ico { background: #3a2a10; color: var(--gold); }
.gchip { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--gold); background: rgba(245, 200, 107, .12); padding: 2px 7px; border-radius: 99px; margin-left: 4px; white-space: nowrap; }
.gchip.plain { color: var(--muted); background: var(--panel); }
.pod .gchip { margin: 0; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel-2); margin-top: 8px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.logo { display: grid; place-items: center; width: 32px; height: 32px; flex: none; }
.mode > div { min-width: 0; }
.brand { min-width: 0; white-space: nowrap; }

body.master .logo-crown { display: block; }
body.elite .brand b { color: var(--gold); }
/* Bordure de l'appli : dorée pour le top 5, animée pour le 1er */
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
body.elite::before { content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none; border: 3px solid var(--gold); box-shadow: inset 0 0 22px rgba(245, 200, 107, .35); }
body.master::before { border: 0; padding: 4px; background: conic-gradient(from var(--spin), #f5c86b, #fff1c2, #b88d33, #f5c86b, #ffe08a, #f5c86b); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); animation: spinb 4s linear infinite; }
@keyframes spinb { to { --spin: 360deg; } }
@media (prefers-reduced-motion: reduce) { body.master::before { animation: none; } }
/* Duel « avant ou après » */
.duel-hero { padding: 6px 2px 4px; }
.duel-hero h1 { font-size: clamp(38px, 11vw, 56px); line-height: 1; margin: 6px 0 10px; }
.duel-hero .muted { margin: 0 0 14px; max-width: 46ch; }
.example { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.fact-mini { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px; font-weight: 700; font-size: 14px; text-align: center; box-shadow: 0 4px 0 #0b0f19; }
.or { font-family: var(--display); font-weight: 800; color: var(--muted); text-transform: uppercase; font-size: 13px; letter-spacing: .1em; text-align: center; }
.duel-hero .note { margin-top: 10px; }
button.fact-mini { color: var(--text); font-family: var(--body); cursor: pointer; }
.fact-mini.good { border-color: var(--mint); background: #12321f; }
.fact-mini.bad { border-color: var(--red); background: #3a141b; }
.versus { display: grid; gap: 10px; }
.versus .or { padding: 2px 0; }
.ans.fact { display: grid; gap: 8px; padding: 18px; min-height: 120px; align-content: center; }
.fact-cat { justify-self: start; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--panel-2); }

.fact-year { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; }
.fact-year:empty { display: none; }
.sd-chip { color: var(--red); }
.type-box input.near { border-color: var(--gold); background: #2e2410; }

.scoreboard.solo .pts { font-size: 28px; }

  function markSeen(id) { if (!id || seen.has(id)) return; seen.add(id); S.seen.push(id); if (S.seen.length > 3000) seen.delete(S.seen.shift()); }
  function touchStreak() { const d = today(); if (S.lastDay === d) return; S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = d; }
  const streakNow = () => (S.lastDay === today() || S.lastDay === yesterday() ? S.streak : 0);
  function addPoints(n) { S.points += n; touchStreak(); save(); renderCounters(); syncPlayer(); }
  function renderCounters() { $("#c-xp").textContent = fmt(S.points); $("#c-streak").textContent = streakNow(); }

  // ================= Questions =================
  // « p12_40 » : lequel est arrivé en premier entre deux faits ; « y12 » : écrire l'année d'un fait.
  const PAIRS = [];
  for (let a = 0; a < FACTS.length; a++) for (let b = a + 1; b < FACTS.length; b++) {
    const g = Math.abs(FACTS[a][0] - FACTS[b][0]);
    if (g >= 1 && g <= MAX_GAP) PAIRS.push(`p${a}_${b}`);
  }
  const gapOf = (id) => { const [a, b] = id.slice(1).split("_").map(Number); return Math.abs(FACTS[a][0] - FACTS[b][0]); };
  function build(id, seed = "") {
    const r = rng(id + "|" + seed);
    if (/^p\d+_\d+$/.test(id)) {
      const [a, b] = id.slice(1).split("_").map(Number);
      if (!FACTS[a] || !FACTS[b]) return null;
      const [x, y] = r() < 0.5 ? [a, b] : [b, a];
      return { kind: "order", id, a: FACTS[x], b: FACTS[y] };
    }
    if (/^y\d+$/.test(id) && FACTS[+id.slice(1)]) { const f = FACTS[+id.slice(1)]; return { kind: "year", id, f, y: f[0] }; }
    return null;
  }
  // Paires jamais vues d'abord, sans réutiliser un fait dans la partie ; les écarts courts (les plus traîtres) en priorité.
  function drawPairs(n, r = Math.random, { useSeen = true } = {}) {
    const used = new Set(), out = [];
    const pool = shuffle(PAIRS, r);
    const tiers = [pool.filter((id) => gapOf(id) <= 12), pool.filter((id) => gapOf(id) > 12)];
    for (const pass of [true, false]) for (const tier of tiers) for (const id of tier) {
      if (out.length >= n) return out;
      if (pass && useSeen && seen.has(id)) continue;
      const [a, b] = id.slice(1).split("_");
      if (used.has(a) || used.has(b) || out.includes(id)) continue;
      out.push(id); used.add(a); used.add(b);
    }
    return out;
  }
  function drawYears(n, r, excludeIds) {
    const used = new Set(excludeIds.flatMap((id) => id.slice(1).split("_")));
    return shuffle(FACTS.map((f, i) => i), r).filter((i) => !used.has(String(i))).slice(0, n).map((i) => "y" + i);
  }
  const buildAll = (ids, seed) => ids.map((id) => build(id, seed)).filter(Boolean);
  const validIds = (a, n) => Array.isArray(a) && a.length === n && a.every((x) => typeof x === "string" && /^p\d{1,3}_\d{1,3}$/.test(x) && build(x));
  // Défi du jour, année à écrire : 3 points pile, 2 à 2 ans près, 1 à 5 ans près.
  const yearPts = (gap) => (gap === 0 ? 3 : gap <= 2 ? 2 : gap <= 5 ? 1 : 0);

  // ================= Moteur de partie =================
  let G = null, timerId = null;
  const play = $("#play");

  function startGame(cfg) {
    G = Object.assign({ i: 0, me: 0, opp: 0, correct: 0, res: [] }, cfg);
    play.hidden = false;
    document.body.style.overflow = "hidden";
    next();
  }
  function quit() { clearInterval(timerId); G = null; play.hidden = true; play.innerHTML = ""; document.body.style.overflow = ""; render(); }
  function next() {
    clearInterval(timerId);
    if (!G) return;
    if (G.i >= G.qs.length) return finish();
    const q = G.qs[G.i];
    if (q.kind === "splash") return renderSplash(q);
    renderQ(q);
  }
  function header() {
    const total = G.qs.filter((q) => q.kind !== "splash").length;
    const done = G.qs.slice(0, G.i).filter((q) => q.kind !== "splash").length;
    const prog = `<div class="bar" aria-hidden="true"><i style="width:${Math.round((done / Math.max(1, total)) * 100)}%"></i></div><span class="chip num">${Math.min(done + 1, total)}/${total}</span>`;
    const board = G.opponent ? `
      <div class="scoreboard">
        <div class="side"><span class="avatar you">Toi</span><div><div class="who">Toi</div><div class="pts num" id="sb-me">${G.me}</div></div></div>
        <span class="vs">VS</span>
        <div class="side right"><div><div class="who">${esc(G.opponent.name)}</div><div class="pts num" id="sb-opp">${G.ghost ? G.opp : "?"}</div></div><span class="avatar opp">${esc(G.opponent.short)}</span></div>
      </div>` : G.mode === "daily" ? `<div class="scoreboard solo"><span class="label">Défi du jour</span><span class="pts num" id="sb-me">${G.me}<small> / ${G.max} pts</small></span></div>` : "";
    return `<div class="wrap"><div class="play-top"><button class="x" id="quit" aria-label="Quitter">${ICON.x}</button>${prog}</div>${board}`;
  }
  function timerHTML(sec) { return `<div class="timer" id="timer"><svg viewBox="0 0 50 50"><circle class="bg" cx="25" cy="25" r="21"/><circle class="fg" cx="25" cy="25" r="21" stroke-dasharray="132" stroke-dashoffset="0"/></svg><span class="num">${sec}</span></div>`; }
  function startTimer(sec, onEnd) {
    const t0 = performance.now();
    timerId = setInterval(() => {
      const left = Math.max(0, sec - (performance.now() - t0) / 1000);
      const el = $("#timer"); if (!el) return;
      el.querySelector(".fg").setAttribute("stroke-dashoffset", String(132 * (1 - left / sec)));
      el.querySelector("span").textContent = Math.ceil(left);
      el.classList.toggle("low", left < 4);
      if (left <= 0) { clearInterval(timerId); onEnd(); }
    }, 100);
  }
  function renderSplash(q) {
    play.innerHTML = `${header()}
      <div class="splash">
        <div class="ico" style="background:${q.bg};color:${q.fg}">${q.icon}</div>
        <p class="label">${esc(q.kicker)}</p>
        <h1 class="big">${esc(q.title)}</h1>
        <p class="rules">${q.rules}</p>
        <button class="btn" id="go">${esc(q.cta || "C'est parti")}</button>
      </div></div>`;
    $("#quit").onclick = quit;
    $("#go").onclick = () => { G.i++; next(); };
  }
  function renderQ(q) {
    let body;
    if (q.kind === "order") {
      body = `<div class="qhead"><span class="chip">Avant ou après ?${G.mode === "daily" ? " · 3 pts" : ""}</span>${timerHTML(TIMER)}</div>
        <h2 class="question">Lequel est arrivé en premier ?</h2>
        <div class="versus">
          ${[q.a, q.b].map((f, k) => `<button class="ans fact" data-k="${k}"><span class="fact-cat ${f[1]}">${CAT[f[1]]}</span><span class="fact-text">${esc(f[2])}</span><span class="fact-year num" aria-hidden="true"></span></button>${k === 0 ? '<span class="or">ou</span>' : ""}`).join("")}
        </div>`;
    } else {
      body = `<div class="qhead"><span class="chip sd-chip">Au plus près · jusqu'à 3 pts</span>${timerHTML(YEAR_TIMER)}</div>
        <h2 class="question">En quelle année : ${esc(lower1(q.f[2]))} ?</h2>
        <form class="type-box" id="type-form" autocomplete="off">
          <input id="ty" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Année" class="year-in num" aria-label="Année">
          <button class="btn wide" id="valider" type="submit">Valider</button>
          <p class="note">Pile : 3 points · à 2 ans près : 2 points · à 5 ans près : 1 point.</p>
        </form>`;
    }
    play.innerHTML = `${header()}${body}<div class="spacer"></div></div>`;
    $("#quit").onclick = quit;
    if (q.kind === "order") {
      play.querySelectorAll(".ans").forEach((b) => (b.onclick = () => answer(q, +b.dataset.k, b)));
      startTimer(TIMER, () => answer(q, null));
    } else {
      const inp = $("#ty");
      inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, "").slice(0, 4); };
      $("#type-form").onsubmit = (e) => { e.preventDefault(); if (!inp.value) { inp.focus(); return; } answer(q, parseInt(inp.value, 10)); };
      setTimeout(() => inp.focus(), 60);
      startTimer(YEAR_TIMER, () => answer(q, null));
    }
  }

  function answer(q, val, btn) {
    if (q.done) return;
    q.done = true;
    clearInterval(timerId);
    play.querySelectorAll(".ans, #valider, #ty").forEach((b) => (b.disabled = true));
    const k = G.res.length;
    let ok = false, gain = 0, info, note;
    if (q.kind === "order") {
      const first = q.a[0] < q.b[0] ? 0 : 1;
      ok = val === first;
      play.querySelectorAll(".ans").forEach((b) => {
        const j = +b.dataset.k;
        b.querySelector(".fact-year").textContent = [q.a, q.b][j][0];
        if (j === first) b.classList.add("good"); else if (b === btn) b.classList.add("bad");
      });
      const gap = Math.abs(q.a[0] - q.b[0]);
      info = `${gap} an${gap > 1 ? "s" : ""} d'écart.`;
      note = q.a[3] || q.b[3] || "";
      gain = ok ? (G.mode === "daily" ? 3 : 1) : 0;
    } else {
      const gap = Number.isFinite(val) ? Math.abs(val - q.y) : Infinity;
      gain = Number.isFinite(gap) ? yearPts(gap) : 0;
      ok = gain > 0;
      const inp = $("#ty"); if (inp) inp.classList.add(gap === 0 ? "good" : gain > 0 ? "near" : "bad");
      info = !Number.isFinite(val) ? `Temps écoulé. C'était en ${q.y}.` : gap === 0 ? `Pile ${q.y} !` : `C'était en ${q.y} : tu as écrit ${val}, à ${gap} an${gap > 1 ? "s" : ""}.`;
      note = q.f[3] || "";
    }
    G.res.push(q.kind === "order" ? ok : gain);
    if (ok) G.correct++;
    G.me += gain;
    markSeen(q.id); save();
    // Adversaire déjà passé : on dévoile sa réponse à cette question.
    let oppLine = "";
    if (G.ghost) {
      const o = !!G.ghost[k];
      if (o) G.opp++;
      oppLine = `${G.opponent.name} ${o ? "avait trouvé" : "s'était trompé"}.`;
    }
    const cls = q.kind === "year" ? (gain === 3 ? "ok" : gain > 0 ? "neutral" : "ko") : ok ? "ok" : "ko";
    const title = q.kind === "year" ? (gain === 3 ? "Pile ! +3 pts" : gain > 0 ? `Pas loin : +${gain} pt${gain > 1 ? "s" : ""}` : val == null ? "Temps écoulé" : "Trop loin")
      : ok ? (G.mode === "daily" ? "Bien vu ! +3 pts" : "Bien vu !") : val == null ? "Temps écoulé" : "Raté";
    const sheet = document.createElement("div");
    sheet.className = `sheet ${cls}`;
    sheet.innerHTML = `<div class="wrap"><h3>${cls === "ok" ? ICON.check : ""}${esc(title)}</h3>
      <p><strong>${esc(info)}</strong></p>${note ? `<p>${esc(note)}</p>` : ""}
      ${oppLine ? `<p class="opp-line">${esc(oppLine)}</p>` : ""}
      <button class="btn wide ${cls === "ko" ? "ghost" : ""}" id="cont">Continuer</button></div>`;
    play.appendChild(sheet);
    const a = $("#sb-me"); if (a) a.innerHTML = G.mode === "daily" ? `${G.me}<small> / ${G.max} pts</small>` : G.me;
    const b = $("#sb-opp"); if (b && G.ghost) b.textContent = G.opp;
    const cont = $("#cont");
    cont.focus();
    cont.onclick = () => { G.i++; next(); };
  }
  function finish() {
    clearInterval(timerId);
    const r = G.onEnd(G);
    play.innerHTML = `<div class="wrap"><div class="splash ${r.cls || ""}">
      <div class="ico" style="background:${r.bg};color:${r.fg}">${r.icon}</div>
      <p class="label">${esc(r.kicker)}</p>
      <h1 class="big">${esc(r.title)}</h1>
      ${r.text ? `<p class="rules">${esc(r.text)}</p>` : ""}
      ${r.stats ? `<div class="result-grid">${r.stats.map(([v, l]) => `<div class="stat"><b class="num">${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : ""}
      ${r.extra || ""}
      <div class="row" style="flex-wrap:wrap;justify-content:center">${r.cta ? `<button class="btn" id="done">${esc(r.cta)}</button>` : ""}<button class="btn ghost" id="home">Accueil</button></div>
    </div></div>`;
    const d = $("#done"); if (d) d.onclick = () => { const after = r.after; quit(); if (after) after(); };
    $("#home").onclick = quit;
    if (r.mount) r.mount();
  }

  // ================= Mode 1 : le 1 contre 1 en différé =================
  // Chacun joue les mêmes 7 duels quand il veut. Celui qui en situe le plus gagne : victoire 17 points, égalité 7, défaite 0.
  // On peut défier un ami par code, ou prendre le match d'un joueur au hasard qui attend un adversaire.
  const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
  const outcome = (a, b) => (a > b ? "win" : a < b ? "lose" : "draw");
  const RESULT_LOOK = {
    win: { icon: ICON.star, bg: "var(--gold)", fg: "#2b1d00" },
    draw: { icon: ICON.swords, bg: "var(--blue)", fg: "#021327" },
    lose: { icon: ICON.sad, bg: "var(--red)", fg: "#2a0006", cls: "lost" },
  };

  async function createMatch({ open, rematchOf }) {
    if (!db || !me) return;
    const code = newCode();
    const ids = drawPairs(MATCH_Q);
    try { await db.collection("matchs").doc(code).set({ code, ids, host: me, open: !!open, at: Date.now(), rematchOf: rematchOf || null }); } catch (e) { return; }
    playMatch(code, ids, null);
  }
  // Au hasard : le match le plus récent d'un autre joueur qui attend encore un adversaire ; sinon on en ouvre un.
  async function randomMatch(msg) {
    if (!db || !me) return;
    msg.textContent = "Recherche d'un match en attente…";
    try {
      const snap = await db.collection("matchs").where("open", "==", true).get();
      const list = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter((m) => m.host !== me && validIds(m.ids, MATCH_Q) && !S.matches.includes(m.code)).sort((a, b) => b.at - a.at);
      const m = list[0];
      if (!m) { msg.textContent = "Personne n'attend : tu ouvres un match, le prochain joueur le prendra."; return createMatch({ open: true }); }
      await db.collection("matchs").doc(m.code).update({ open: false }).catch(() => {});
      msg.textContent = "";
      return joinMatch(m.code, msg);
    } catch (e) { msg.textContent = "Impossible de chercher un match pour le moment."; }
  }
  async function joinMatch(code, msg) {
    try {
      const mine = await db.collection("matchs").doc(`${code}-${me}`).get();
      if (mine.exists) { msg.textContent = "Tu as déjà joué ce match : voici le résultat."; showMatch(code); return; }
      const snap = await db.collection("matchs").doc(code).get();
      if (!snap.exists) { msg.textContent = "Ce code ne correspond à aucun match."; return; }
      const d = snap.data();
      if (!validIds(d.ids, MATCH_Q)) { msg.textContent = "Ce match est illisible."; return; }
      if (d.host === me) { showMatch(code); return; }
      const hostRes = await db.collection("matchs").doc(`${code}-${d.host}`).get();
      const hr = hostRes.exists ? hostRes.data() : null;
      await resolveNames([d.host]);
      playMatch(code, d.ids, hr && Array.isArray(hr.res) ? { res: hr.res.slice(0, MATCH_Q).map(Boolean), uid: d.host } : null);
    } catch (e) { msg.textContent = "Impossible de rejoindre ce match pour le moment."; }
  }
  function playMatch(code, ids, ghost) {
    const oname = ghost ? names[ghost.uid] || "Ton adversaire" : "Ton adversaire";
    startGame({
      mode: "match", qs: [{ kind: "splash", kicker: `Match ${code}`, title: "Avant ou après ?", icon: ICON.swords, bg: "var(--blue)", fg: "#021327", cta: "Je suis prêt",
        rules: `${MATCH_Q} duels de dates qu'on ne sait jamais situer, 12 secondes chacun. Ton adversaire joue les mêmes, quand il veut. Le plus de bonnes réponses gagne : victoire 17 points, égalité 7.${ghost ? ` ${esc(oname)} a déjà joué : tu verras ses réponses au fur et à mesure.` : ""}` }, ...buildAll(ids, code)],
      opponent: { name: oname, short: oname.charAt(0).toUpperCase() }, ghost: ghost ? ghost.res : null,
      onEnd: (g) => {
        const res = g.res.map(Boolean);
        db.collection("matchs").doc(`${code}-${me}`).set({ code, res, correct: g.correct, at: Date.now() }).catch(() => {});
        if (!S.matches.includes(code)) S.matches.unshift(code);
        S.matches = S.matches.slice(0, 12); save();
        if (ghost) {
          const out = outcome(g.correct, g.opp);
          scoreMatch(code, out);
          return Object.assign({ kicker: `Match ${code} · ${g.correct} contre ${g.opp}`, title: t(out), text: t(out + "Sub"),
            stats: [[`${g.correct}/${MATCH_Q}`, "bien situés"], [`+${PTS[out]}`, "points"], [`${S.wins}-${S.draws}-${S.losses}`, "V-N-D"]] }, RESULT_LOOK[out]);
        }
        return { kicker: `Match ${code}`, title: `${g.correct}/${MATCH_Q} bien situés`, icon: ICON.clock, bg: "var(--blue)", fg: "#021327",
          text: "Ton adversaire n'a pas encore joué. Le résultat et tes points arrivent dès qu'il a fini.",
          extra: `<div class="card" style="width:100%;max-width:420px;text-align:left" id="m-res"><p class="muted">…</p></div>`,
          mount: () => watchMatch(code, $("#m-res")) };
      },
    });
  }
  // Les points d'un match ne sont comptés qu'une fois, quand les deux joueurs ont joué.
  function scoreMatch(code, out) {
    if (S.scored[code]) return;
    S.scored[code] = out;
    if (out === "win") S.wins++; else if (out === "draw") S.draws++; else S.losses++;
    addPoints(PTS[out]);
  }
  let matchUnsub = null;
  function watchMatch(code, el) {
    if (matchUnsub) { matchUnsub(); matchUnsub = null; }
    if (!db || !el) return;
    matchUnsub = db.collection("matchs").where("code", "==", code).onSnapshot(async (snap) => {
      const host = snap.docs.find((d) => d.id === code);
      const rows = snap.docs.filter((d) => d.id !== code).map((d) => Object.assign({ uid: d.id.slice(code.length + 1) }, d.data()));
      await resolveNames(rows.map((r) => r.uid));
      if (!document.body.contains(el)) { matchUnsub && matchUnsub(); matchUnsub = null; return; }
      const mine = rows.find((r) => r.uid === me), other = rows.find((r) => r.uid !== me);
      if (!mine) { el.innerHTML = `<p class="muted">Tu n'as pas encore joué ce match.</p>`; return; }
      if (!other) {
        const isOpen = host && host.data().open;
        el.innerHTML = `<p class="label">${esc(t("wait"))}</p>${isOpen ? `<p>Ton match est ouvert : le prochain joueur qui cherche un adversaire au hasard le prendra.</p>` : ""}
          <p>${isOpen ? "Tu peux aussi" : "Envoie"} ce code à un ami : il l'entre sur l'accueil pour jouer les mêmes duels.</p><p class="code">${code}</p><button class="btn ghost" id="copy">Copier le code</button>`;
        const c = el.querySelector("#copy");
        c.onclick = () => { try { navigator.clipboard.writeText(code).then(() => (c.textContent = "Code copié"), () => (c.textContent = code)); } catch (e) { c.textContent = code; } };
        return;
      }
      const out = outcome(mine.correct, other.correct);
      scoreMatch(code, out);
      const oname = names[other.uid] || "Ton adversaire";
      const wait = Math.max(mine.at || 0, other.at || 0) + COOLDOWN - Date.now();
      el.innerHTML = `<p class="label">${out === "win" ? "Victoire · +17 points" : out === "draw" ? "Égalité · +7 points" : "Défaite · 0 point"}</p>
        <h3 style="font-size:24px;margin:6px 0">${esc(t(out))}</h3>
        <p class="muted">Toi ${mine.correct}, ${esc(oname)} ${other.correct}.</p>
        <div class="ms-grid">${(mine.res || []).map((x, k) => `<span class="${x ? "ok" : "ko"}">${k + 1}</span>`).join("")}<b>Toi</b>${(other.res || []).map((x, k) => `<span class="${x ? "ok" : "ko"}">${k + 1}</span>`).join("")}<b>${esc(oname)}</b></div>
        ${wait > 0 ? `<p class="note">Match retour possible dans ${waitText(wait)}.</p>` : `<button class="btn" id="rematch">Lancer le match retour</button>`}`;
      const rm = el.querySelector("#rematch"); if (rm) rm.onclick = () => createMatch({ open: false, rematchOf: code });
    }, () => { el.innerHTML = `<p class="muted">Résultat indisponible pour le moment.</p>`; });
  }
  // Au chargement : on compte les points des matchs terminés pendant qu'on était absent.
  async function settlePending() {
    if (!db || !me) return;
    for (const code of S.matches.filter((c) => !S.scored[c]).slice(0, 12)) {
      try {
        const snap = await db.collection("matchs").where("code", "==", code).get();
        const rows = snap.docs.filter((d) => d.id !== code).map((d) => Object.assign({ uid: d.id.slice(code.length + 1) }, d.data()));
        const mine = rows.find((r) => r.uid === me), other = rows.find((r) => r.uid !== me);
        if (mine && other) scoreMatch(code, outcome(mine.correct, other.correct));
      } catch (e) {}
    }
    if (!G) render();
  }

  // ================= Mode 2 : le défi du jour =================
  // 5 questions, les mêmes pour tous : 3 « avant ou après » (3 points chacune) et 2 années à écrire (3 points pile, 2 à 2 ans, 1 à 5 ans).
  function dailyQs(day = today()) {
    const r = rng(`defi-${day}`);
    const order = drawPairs(DAILY_ORDER, r, { useSeen: false });
    const years = drawYears(DAILY_YEARS, r, order);
    return buildAll([order[0], years[0], order[1], order[2], years[1]], day);
  }
  const DAILY_MAX = (DAILY_ORDER + DAILY_YEARS) * 3;
  function startDaily() {
    if (S.daily && S.daily.date === today()) return;
    startGame({
      mode: "daily", max: DAILY_MAX,
      qs: [{ kind: "splash", kicker: "Défi du jour", title: "5 questions", icon: ICON.sun, bg: "var(--mint)", fg: "#062317", cta: "C'est parti",
        rules: "Les mêmes pour tous les joueurs aujourd'hui. Trois « avant ou après » à 3 points, et deux années à écrire : 3 points pile, 2 à deux ans près, 1 à cinq ans près." }, ...dailyQs()],
      onEnd: (g) => {
        S.daily = { date: today(), score: g.me, res: g.res };
        addPoints(g.me);
        publishDaily();
        return { kicker: "Défi du jour", title: `+${g.me} points`, icon: ICON.sun, bg: "var(--mint)", fg: "#062317",
          stats: [[`${g.me}/${DAILY_MAX}`, "points"], [String(streakNow()), "jours de suite"], [rankDailyText(), "aujourd'hui"]],
          text: "Reviens demain pour un nouveau défi.", cta: "Voir le classement", after: () => setTab("classement") };
      },
    });
  }

  // ================= Partagé (db) =================
  let db = null, user = null, me = null, names = {}, players = [], dailyRows = [];
  async function initShared() {
    try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
    try { user = await window.claude?.use?.("user"); } catch (e) { user = null; }
    try { me = user ? await user.id() : null; } catch (e) { me = null; }
    if (db && me) {
      try {
        const snap = await db.collection("joueurs").doc(me).get();
        const d = snap.exists ? snap.data() : null;
        if (d && Number(d.points) > S.points) { S.points = Number(d.points); save(); }
      } catch (e) {}
      if (S.points > 0) syncPlayer();
    }
    if (db) {
      db.collection("joueurs").orderBy("points", "desc").limit(50).onSnapshot((snap) => {
        players = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter((p) => Number(p.points) > 0);
        resolveNames(players.slice(0, 30).map((p) => p.id)).then(refreshShared);
      }, () => {});
      db.collection("defi").where("date", "==", today()).onSnapshot((snap) => {
        dailyRows = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => b.score - a.score || a.at - b.at);
        resolveNames(dailyRows.map((r) => r.id)).then(refreshShared);
      }, () => {});
    }
    render();
    settlePending();
  }
  async function resolveNames(ids) {
    const todo = ids.filter((id) => id && !(id in names));
    if (!user || !todo.length) return;
    try { const ps = await user.profiles(todo); Object.entries(ps || {}).forEach(([id, p]) => { names[id] = (p && p.name) || ""; }); } catch (e) {}
  }
  const nameOf = (id) => (id === me ? "Toi" : names[id] || "Joueur");
  function refreshShared() {
    const c = $("#champion"); if (c) c.outerHTML = championHTML();
    applyStatus();
    if (tab === "classement" && !G) render();
  }
  function syncPlayer() {
    if (!db || !me) return;
    db.collection("joueurs").doc(me).set({ points: S.points, wins: S.wins, draws: S.draws, losses: S.losses, streak: streakNow(), at: Date.now() }).catch(() => {});
  }
  function publishDaily() {
    if (!db || !me || !S.daily) return;
    db.collection("defi").doc(me).set({ date: S.daily.date, score: S.daily.score, at: Date.now() }).catch(() => {});
  }
  function rankDailyText() { const k = dailyRows.findIndex((r) => r.id === me); return k >= 0 ? `${k + 1}ᵉ` : "–"; }

  // ================= Grades =================
  // Les titres du top 5 du classement des points.
  const TITLES = [
    "Empereur des ténèbres de la mort éternelle",
    "Sultan de puissance extrême, attention danger",
    "Monarque nocif du savoir lumineux",
    "Suzerain millénaire féroce et galvanisé",
    "Potentat extrême, lucide présomption",
  ];
  const SHORT = ["Empereur", "Sultan", "Monarque", "Suzerain", "Potentat"];
  const GRADES = [[500, "Savant"], [200, "Érudit"], [50, "Initié"], [0, "Curieux"]];
  const rankOf = (id) => players.findIndex((p) => p.id === id);
  function gradeOf(rank, pts) {
    if (rank >= 0 && rank < 5) return TITLES[rank];
    return (GRADES.find(([m]) => pts >= m) || GRADES[GRADES.length - 1])[1];
  }
  let preview = "";
  function applyStatus() {
    const r = preview === "master" ? 0 : preview === "elite" ? 2 : preview === "normal" ? -1 : rankOf(me);
    document.body.classList.toggle("elite", r >= 0 && r < 5);
    document.body.classList.toggle("master", r === 0);
    const chip = $("#grade-chip");
    if (chip) { chip.textContent = r >= 0 && r < 5 ? SHORT[r] : ""; chip.hidden = !(r >= 0 && r < 5); }
  }

  // ================= Écrans =================
  let tab = "jouer";
  function setTab(x) { tab = x; render(); window.scrollTo(0, 0); }
  document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

  function championHTML() {
    if (!db) return `<div id="champion"></div>`;
    const top = players[0];
    return `<section class="champion" id="champion">
      <span class="crown">${ICON.crown}</span>
      <div class="ch-main"><span class="label">${esc(TITLES[0])}</span><b>${top ? esc(nameOf(top.id)) : "La place est libre"}</b>${top ? "" : `<small>Gagne des points et prends la tête.</small>`}</div>
      ${top ? `<span class="ch-pts num">${fmt(top.points)}<small>pts</small></span>` : ""}
    </section>`;
  }
  function msToMidnight() { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); return waitText(m - n); }
  function dailyCard() {
    const done = S.daily && S.daily.date === today();
    return `<section class="card daily">
      <p class="label" style="color:var(--mint)">Défi du jour · ${new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}</p>
      <h2>${done ? `Fait : ${S.daily.score}/${DAILY_MAX} points` : "5 questions, les mêmes pour tout le monde"}</h2>
      <div class="meta"><span class="reward">${done ? `Classé ${rankDailyText()}` : `Jusqu'à +${DAILY_MAX} pts`}</span><span>Nouveau défi dans ${msToMidnight()}</span></div>
      ${done ? `<button class="btn ghost" data-go="classement">Voir le classement</button>` : `<button class="btn" id="daily-go">Jouer le défi</button>`}
    </section>`;
  }
  function matchCard() {
    const shared = !!(db && me);
    const list = S.matches.map((c) => {
      const s = S.scored[c];
      return `<button class="duel-item" data-match="${c}"><b>${c}</b><span class="mstate ${s || "wait"}">${s === "win" ? "Gagné · +17" : s === "draw" ? "Égalité · +7" : s === "lose" ? "Perdu" : "En attente"}</span></button>`;
    }).join("");
    return `<section class="card mode duel-card">
      <div class="mode-ico" style="background:#16243d;color:var(--blue)">${ICON.swords}</div>
      <div><h3>1 contre 1</h3>
      <p>${MATCH_Q} duels « avant ou après » sur des dates de niche. Chacun joue quand il veut, le résultat tombe quand les deux ont fini.</p>
      <div class="pts-row"><span><b>17</b> victoire</span><span><b>7</b> égalité</span><span><b>0</b> défaite</span></div>
      ${shared ? `<div class="btns"><button class="btn blue" id="random-go">${ICON.dice}Adversaire au hasard</button><button class="btn gold" id="friend-go">Défier un ami</button></div>
        <div class="join"><input id="code-in" maxlength="5" placeholder="CODE" autocomplete="off" aria-label="Code de match reçu"><button class="btn ghost" id="join-go">Rejoindre</button></div>
        <p class="note" id="join-msg"></p>
        ${list ? `<p class="label" style="margin-top:16px">Mes matchs</p><div class="duel-list">${list}</div><div id="match-view" style="margin-top:12px"></div>` : ""}`
        : `<p class="note">Le 1 contre 1 a besoin du mode partagé : ouvre cette page sur claude.ai, connecté.</p>`}</div>
    </section>`;
  }
  function viewJouer() {
    return `<div class="stack">
      <section class="duel-hero">
        <p class="label" style="color:var(--mint)">Le jeu</p>
        <h1>Avant ou après ?</h1>
        <p class="muted">Des dates auxquelles on n'a pas idée. Essaie : lequel est arrivé en premier ?</p>
        <div class="example"><button class="fact-mini" data-ex="0">La valise à roulettes</button><span class="or">ou</span><button class="fact-mini" data-ex="1">Les premiers pas sur la Lune</button></div>
        <p class="note" id="ex-res" aria-live="polite"></p>
      </section>
      ${dailyCard()}${matchCard()}</div>`;
  }
  function viewClassement() {
    let general;
    if (!db) general = `<p class="muted">Le classement partagé s'affiche quand la page est ouverte sur claude.ai, connecté.</p>`;
    else if (!players.length) general = `<p class="muted">Personne n'a encore de points. Gagne un match ou fais le défi du jour : tu apparaîtras ici pour tous les joueurs.</p>`;
    else {
      const podium = players.slice(0, 3);
      const order = [1, 0, 2].filter((k) => podium[k]);
      general = `<div class="podium">${order.map((k) => `<div class="pod p${k + 1}"><span class="avatar ${podium[k].id === me ? "you" : "opp"}">${esc(nameOf(podium[k].id).charAt(0).toUpperCase())}</span><b>${esc(nameOf(podium[k].id))}</b><em class="gchip">${esc(TITLES[k])}</em><span class="num">${fmt(podium[k].points)} pts</span><div class="step">${k + 1}</div></div>`).join("")}</div>
        ${players.length > 3 ? `<ol class="rank" start="4">${players.slice(3, 30).map((p, k) => `<li class="${p.id === me ? "me" : ""}"><span class="pos num">${k + 4}</span><span>${esc(nameOf(p.id))} <em class="gchip ${k + 3 < 5 ? "" : "plain"}">${esc(gradeOf(k + 3, p.points))}</em></span><span class="num" style="font-weight:800">${fmt(p.points)}</span></li>`).join("")}</ol>` : ""}`;
    }
    const daily = !db ? "" : !dailyRows.length ? `<p class="muted">Personne n'a encore joué le défi d'aujourd'hui.</p>`
      : `<ol class="rank">${dailyRows.slice(0, 20).map((r, k) => `<li class="${r.id === me ? "me" : ""}"><span class="pos num">${k + 1}</span><span>${esc(nameOf(r.id))}</span><span class="num" style="font-weight:800">${r.score}/${DAILY_MAX}</span></li>`).join("")}</ol>`;
    return `<div class="stack">
      <section class="card"><p class="label">Tous les joueurs</p><h2 style="font-size:26px;margin-top:4px">Classement général</h2>${general}</section>
      ${db ? `<section class="card"><p class="label">Défi du ${new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}</p><h2 style="font-size:26px;margin-top:4px">Classement du jour</h2>${daily}</section>` : ""}
      <section class="card"><p class="label">Récompenses</p><h2 style="font-size:26px;margin-top:4px">Les grades</h2>
        <ul class="grades">
          ${TITLES.map((x, k) => `<li><span class="g-ico ${k === 0 ? "master-ico" : "elite-ico"} rank-ico">${k + 1}</span><div><b>${esc(x)}</b><span>${k === 0 ? "1ᵉʳ du classement : couronne sur le logo, bordure dorée animée, ton titre en tête pour tous." : `${k + 1}ᵉ du classement : logo doré et bordure dorée autour de l'appli.`}</span></div></li>`).join("")}
          <li><span class="g-ico">${ICON.bolt}</span><div><b>Selon tes points</b><span>Curieux, Initié (50), Érudit (200), Savant (500).</span></div></li>
        </ul>
        <p class="label" style="margin-top:14px">Aperçu</p>
        <div class="seg">${[["normal", "Normal"], ["elite", "Top 5"], ["master", "1ᵉʳ"]].map(([k, l]) => `<button data-preview="${k}" aria-pressed="${(preview || "normal") === k}">${l}</button>`).join("")}</div>
      </section>
      <section class="card"><p class="label">Tes chiffres · ${esc(gradeOf(rankOf(me), S.points))}</p>
        <div class="stats" style="margin-top:12px">
          <div class="stat"><b class="num">${fmt(S.points)}</b><span>points</span></div>
          <div class="stat"><b class="num">${S.wins}-${S.draws}-${S.losses}</b><span>victoires, nuls, défaites</span></div>
          <div class="stat"><b class="num">${streakNow()}</b><span>jours de suite</span></div>
          <div class="stat"><b class="num">${fmt(seen.size)}</b><span>questions vues</span></div>
          <div class="stat"><b class="num">${FACTS.length}</b><span>faits datés</span></div>
          <div class="stat"><b class="num">${fmt(PAIRS.length)}</b><span>duels possibles</span></div>
        </div>
        <p class="note" style="margin-top:12px">Points : 1 contre 1, victoire 17, égalité 7, défaite 0. Défi du jour : 3 par bonne réponse, et pour les années à écrire 3 pile, 2 à deux ans près, 1 à cinq ans près.</p></section>
    </div>`;
  }

  function render() {
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    const v = $("#view");
    v.innerHTML = championHTML() + (tab === "jouer" ? viewJouer() : viewClassement());
    renderCounters();
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    on("#daily-go", startDaily);
    on("#friend-go", () => createMatch({ open: false }));
    on("#random-go", () => randomMatch($("#join-msg")));
    on("#join-go", () => {
      const code = $("#code-in").value.trim().toUpperCase();
      const msg = $("#join-msg");
      if (!/^[A-Z0-9]{5}$/.test(code)) { msg.textContent = "Le code fait 5 caractères, par exemple K7RMX."; return; }
      joinMatch(code, msg);
    });
    v.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => setTab(b.dataset.go)));
    v.querySelectorAll("[data-match]").forEach((b) => (b.onclick = () => showMatch(b.dataset.match)));
    v.querySelectorAll("[data-preview]").forEach((b) => (b.onclick = () => { preview = b.dataset.preview; render(); }));
    v.querySelectorAll("[data-ex]").forEach((b) => (b.onclick = () => {
      v.querySelectorAll("[data-ex]").forEach((x) => { x.disabled = true; x.classList.add(x.dataset.ex === "1" ? "good" : x === b ? "bad" : "dim"); });
      $("#ex-res").textContent = (b.dataset.ex === "1" ? "Bien vu ! " : "Eh non ! ") + "La Lune en 1969, la valise à roulettes en 1972 : on a marché sur la Lune avant de mettre des roues aux valises.";
    }));
    applyStatus();
  }
  function showMatch(code) { const box = $("#match-view") || $("#join-msg"); if (!box) return; box.innerHTML = `<div class="card" style="background:var(--panel-2)"><p class="muted">Chargement…</p></div>`; watchMatch(code, box.firstElementChild); }

  document.addEventListener("keydown", (e) => {
    if (!G || play.hidden) return;
    const c = $("#cont");
    if (c && !c.disabled && e.key === "Enter") { e.preventDefault(); c.click(); }
  });

  render();
  initShared();
})();
</script>
