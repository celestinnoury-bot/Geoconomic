      if (!other) { el.innerHTML = `<p><b>Duel ${esc(code)}</b> · ${mine.pct} % en ${mmss(mine.secs)}</p><p class="muted">En attente de ton adversaire. Envoie-lui le code <b class="code">${esc(code)}</b> : il a jusqu'à minuit.</p>`; return; }
      const oid = other.id.slice(code.length + 1);
      await resolveNames([oid]);
      const out = mine.pct !== other.pct ? (mine.pct > other.pct ? "win" : "lose") : mine.secs !== other.secs ? (mine.secs < other.secs ? "win" : "lose") : "draw";
      if (!S.qdScored[code]) { S.qdScored[code] = out; if (QD_PTS[out]) addPoints(QD_PTS[out]); else save(); }
      const head = out === "win" ? `Gagné · +${QD_PTS.win}` : out === "draw" ? `Égalité · +${QD_PTS.draw}` : t("lose");
      el.innerHTML = `<p class="qd-out ${out}"><b>${esc(head)}</b></p>
        <div class="qd-vs"><span>Toi<b class="num">${mine.pct} %</b><small>${mmss(mine.secs)}</small></span><span>${esc(nameOf(oid))}<b class="num">${other.pct} %</b><small>${mmss(other.secs)}</small></span></div>
        ${mine.pct === other.pct ? `<p class="note">Même score : ${out === "draw" ? "même temps aussi." : "le plus rapide l'emporte."}</p>` : ""}`;
    });
    qdUnsubs.set(code, un);
  }

  // ---------- Taux de réussite (façon JetPunk) ----------
  // Chaque joueur garde un document par quiz, `qstats/<quiz>-<uid>` = {quiz, res: {élément: 1 ou 0}, at} (sa dernière partie).
  // Le taux d'un élément = part des joueurs qui l'ont trouvé, parmi ceux à qui il a été posé.
  const QSTATS = new Map();
  function qsLoad(qid) {
    if (!db || !me) return Promise.resolve(null);
    if (QSTATS.has(qid)) return QSTATS.get(qid);
    const pr = db.collection("qstats").where("quiz", "==", qid).limit(500).get().then((snap) => {
      const rate = new Map(); let n = 0;
      snap.docs.forEach((d) => {
        if (d.id === `${qid}-${me}`) return;
        const r = d.data().res; if (!r || typeof r !== "object") return;
        n++;
        for (const [k, v] of Object.entries(r)) { const x = rate.get(k) || { hit: 0, tot: 0 }; x.tot++; if (v) x.hit++; rate.set(k, x); }
      });
      return { n, rate };
    }).catch(() => null);
    QSTATS.set(qid, pr);
    return pr;
  }
  function qsSave(qid, res) {
    if (!db || !me) return;
    db.collection("qstats").doc(`${qid}-${me}`).set({ quiz: qid, res, at: Date.now() }).catch(() => {});
  }
  const pctOf = (x) => (x && x.tot ? Math.round((100 * x.hit) / x.tot) : null);
  // Sous chaque case : « 64 % » ; ceux que peu trouvent sont signalés quand on les a eus.
  async function qsPaint(qid, res, slotOf, summaryEl, label = (k) => k) {
    const st = await qsLoad(qid);
    if (!st || !st.n) { if (summaryEl) summaryEl.innerHTML = `<p class="note">Taux de réussite : tu es le premier joueur sur ce quiz.</p>`; return; }
    let rarest = null, missedEasy = null;
    for (const [k, v] of Object.entries(res)) {
      const x = st.rate.get(k), p = pctOf(x), el = slotOf(k);
      if (p == null || !el) continue;
      const tag = document.createElement("small");
      tag.className = "qz-rate" + (v && p < 25 ? " rare" : !v && p >= 60 ? " easy" : "");
      tag.textContent = `${p} %`;
      tag.title = `${x.hit} joueur${x.hit > 1 ? "s" : ""} sur ${x.tot} l'ont trouvé`;
      el.appendChild(tag);
      if (v && (!rarest || p < rarest.p)) rarest = { k, p };
      if (!v && (!missedEasy || p > missedEasy.p)) missedEasy = { k, p };
    }
    if (summaryEl) summaryEl.innerHTML = `<p class="note qz-rate-sum">Le % sous chaque case : la part des ${st.n} autre${st.n > 1 ? "s" : ""} joueur${st.n > 1 ? "s" : ""} qui l'ont trouvé.${rarest && rarest.p < 50 ? ` Bien vu pour <b>${esc(label(rarest.k))}</b> : ${rarest.p ? `seuls ${rarest.p} % le trouvent` : "personne d'autre ne l'avait trouvé"}.` : ""}${missedEasy && missedEasy.p >= 50 ? ` Raté : <b>${esc(label(missedEasy.k))}</b>, que ${missedEasy.p} % trouvent.` : ""}</p>`;
  }

  // ---------- Globe (d3, projection orthographique) ----------
  function makeGlobe(host, { onPick, onSelect, confirm = false } = {}) {
    if (!window.d3 || !QD) { host.remove(); return null; }
    const W = Math.max(260, host.clientWidth || 340), H = Math.min(W, 360);
    const base = H / 2 - 6;
    const proj = d3.geoOrthographic().scale(base).translate([W / 2, H / 2]).clipAngle(90).rotate([-15, -25]);
    const path = d3.geoPath(proj);
    const svg = d3.select(host).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("class", "qz-globe-svg").attr("role", "img").attr("aria-label", "Globe : fais-le tourner, touche un pays");
    svg.append("path").datum({ type: "Sphere" }).attr("class", "g-sea");
    svg.append("path").datum(d3.geoGraticule10()).attr("class", "g-grat");
    const feats = QD.geo.map(([id, c]) => ({ type: "Feature", id, geometry: { type: "MultiPolygon", coordinates: c } }));
    const byId = new Map(feats.map((f) => [f.id, f]));
    const land = svg.append("g").selectAll("path").data(feats).join("path").attr("class", "g-land");
    const draw = () => { svg.selectAll(".g-sea,.g-grat,.g-zone").attr("d", path); land.attr("d", path); };
    draw();
    // Un seul geste pour tout : glisser fait tourner, pincer (ou la molette, ou + / −) zoome, jusqu'à 10 fois.
    let last = d3.zoomIdentity;
    const zoom = d3.zoom().scaleExtent([1, 30]).clickDistance(6).on("zoom", (e) => {
      const t = e.transform;
      if (t.k !== last.k) proj.scale(base * t.k);
      else {
        const r = proj.rotate(), k = 70 / proj.scale();
        proj.rotate([r[0] + (t.x - last.x) * k, Math.max(-85, Math.min(85, r[1] - (t.y - last.y) * k))]);
      }
      last = t; draw();
      host.classList.toggle("zoomed", t.k > 1.05);
    });
    svg.call(zoom).on("dblclick.zoom", null);
    const tools = document.createElement("div");
    tools.className = "g-zoom";
    tools.innerHTML = `<button type="button" data-z="in" aria-label="Zoomer">+</button><button type="button" data-z="out" aria-label="Dézoomer">−</button><button type="button" data-z="reset" aria-label="Revoir tout le globe">⤢</button>`;
    host.appendChild(tools);
    tools.onclick = (e) => {
      const z = e.target.closest("[data-z]"); if (!z) return;
      const sel = svg.transition().duration(300);
      if (z.dataset.z === "reset") sel.call(zoom.scaleTo, 1); else sel.call(zoom.scaleBy, z.dataset.z === "in" ? 1.8 : 1 / 1.8);
    };
    // Mort subite : un toucher sélectionne (le pays s'entoure et la loupe zoome dessus), un second toucher sur le même valide.
    let sel = null;
    const select = (id) => {
      sel = id;
      land.classed("sel", (f) => f.id === id);
      if (!id) return;
      const f = byId.get(id), [x, y] = d3.geoCentroid(f), from = proj.rotate(), to = [-x, Math.max(-70, Math.min(70, -y))];
      d3.select(host).transition().duration(500).tween("r", () => { const i = d3.interpolate(from, to); return (t) => { proj.rotate(i(t)); draw(); }; });
      const size = Math.sqrt(d3.geoArea(f) / Math.PI) * 180 / Math.PI, want = Math.min(30, Math.max(2.5, 18 / Math.max(1, size)));
      if (last.k < want) svg.transition().delay(150).duration(450).call(zoom.scaleTo, want);
    };
    land.on("click", (e, f) => {
      if (!onPick) return;
      if (!confirm) return onPick(f.id);
      if (sel === f.id) { select(null); onSelect && onSelect(null); return onPick(f.id); }
      select(f.id); onSelect && onSelect(f.id);
    });
    return {
      select(id) { select(id); },
      selected: () => sel,
      focus(id) {
        const f = byId.get(id); if (!f) return;
        const [x, y] = d3.geoCentroid(f), from = proj.rotate();
        const to = [-x, Math.max(-60, Math.min(60, -y))];
        d3.select(host).transition().duration(750).tween("r", () => { const i = d3.interpolate(from, to); return (t) => { proj.rotate(i(t)); draw(); }; });
      },
      mark(id, cls) { land.filter((f) => f.id === id).attr("class", "g-land " + cls); },
      flash(id, cls) { const p = land.filter((f) => f.id === id); p.classed(cls, true); setTimeout(() => p.classed(cls, false), 700); },
      has: (id) => byId.has(id),
      // Zone d'indice : un cercle qui contient le pays sans être centré dessus.
      zone(id) {
        svg.selectAll(".g-zone").remove();
        const f = id && byId.get(id); if (!f) return;
        const c = d3.geoCentroid(f), size = Math.sqrt(d3.geoArea(f) / Math.PI) * 180 / Math.PI;
        const r = Math.max(9, size * 2.2), a = Math.random() * 2 * Math.PI, off = r * 0.45;
        const center = [c[0] + off * Math.cos(a) / Math.max(0.3, Math.cos(c[1] * Math.PI / 180)), Math.max(-80, Math.min(80, c[1] + off * Math.sin(a)))];
        svg.append("path").datum(d3.geoCircle().center(center).radius(r)()).attr("class", "g-zone").attr("d", path);
        draw();
        const from = proj.rotate(), to = [-center[0], Math.max(-60, Math.min(60, -center[1]))];
        d3.select(host).transition().duration(750).tween("r", () => { const i = d3.interpolate(from, to); return (t) => { proj.rotate(i(t)); draw(); }; });
      },
      nearest(id) {
        const f = byId.get(id); if (!f) return null;
        const c = d3.geoCentroid(f);
        let best = null, bd = Infinity;
        for (const g of feats) { if (g.id === id || !QD.names[g.id]) continue; const d = d3.geoDistance(c, d3.geoCentroid(g)); if (d < bd) { bd = d; best = g.id; } }
        return best ? qName(best) : null;
      },
    };
  }

  // ---------- Écrans ----------
  let QZ = null, qzTimer = null;
  // Contexte de la partie : duel du jour (contre quelqu'un ou seul), sans chrono, temps écoulé (pauses retirées).
  let QZCTX = { duel: null, daily: false, noclock: false };
  let QZT = { t0: 0, paused: 0, pausedAt: 0 };
  const qzElapsed = () => ((QZT.pausedAt || performance.now()) - QZT.t0 - QZT.paused) / 1000;
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>';
  const clockHTML = (q) => `${QZCTX.duel || QZCTX.noclock ? "" : `<button class="qz-pbtn" id="qz-pause" aria-label="Mettre en pause">${PAUSE_SVG}</button>`}<span class="chip num" id="qz-clock">${QZCTX.noclock ? "Sans chrono" : mmss(q.time)}</span>`;
  function qzClock(q, end) {
    const pb = $("#qz-pause");
    if (pb) pb.onclick = () => qzPause(true);
    if (QZCTX.noclock) return;
    qzTimer = setInterval(() => {
      if (QZT.pausedAt) return;
      const left = Math.ceil(q.time - qzElapsed());
      const c = $("#qz-clock"); if (c) { c.textContent = mmss(Math.max(0, left)); c.classList.toggle("low", left <= 15); }
      if (left > 0) return;
      clearInterval(qzTimer);
      // En duel, le temps est le même pour tous : fin de partie. Seul, on peut continuer sans chrono.
      if (QZCTX.duel) return end();
      const tools = play.querySelector(".qz-tools");
      if (!tools) return end();
      const box = document.createElement("div");
      box.className = "qz-timeup";
      box.innerHTML = `<p><b>Temps écoulé !</b> Tu n'es pas en duel : continue sans chrono si tu veux.</p><div class="btns"><button class="btn small" id="qz-more">Continuer sans chrono</button><button class="btn ghost small" id="qz-stop">Voir mon score</button></div>`;
      tools.before(box);
      $("#qz-more").onclick = () => { QZCTX.noclock = true; box.remove(); const c = $("#qz-clock"); if (c) { c.textContent = "Sans chrono"; c.classList.remove("low"); } const pb = $("#qz-pause"); if (pb) pb.remove(); const i = $("#qz-in"); if (i) i.focus(); };
      $("#qz-stop").onclick = () => { box.remove(); end(); };
    }, 250);
  }
  function qzPause(on) {
    const box = play.querySelector(".qz");
    if (!box) return;
    if (on && !QZT.pausedAt) {
      QZT.pausedAt = performance.now();
      box.classList.add("paused");
      const o = document.createElement("div");
      o.className = "qz-pausebox";
      o.innerHTML = `<p class="label">Pause</p><h2>Le chrono est arrêté</h2><p class="muted">Les réponses sont cachées en attendant.</p><button class="btn" id="qz-resume">Reprendre</button>`;
      play.appendChild(o);
      $("#qz-resume").onclick = () => qzPause(false);
    } else if (!on && QZT.pausedAt) {
      QZT.paused += performance.now() - QZT.pausedAt; QZT.pausedAt = 0;
      box.classList.remove("paused");
      const o = play.querySelector(".qz-pausebox"); if (o) o.remove();
      const i = $("#qz-in"); if (i) i.focus();
    }
  }
  const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s) % 60).padStart(2, "0")}`;
  function qzOpen(html) { play.hidden = false; document.body.style.overflow = "hidden"; play.innerHTML = `<div class="wrap qz">${html}</div>`; const x = $("#qz-quit"); if (x) x.onclick = qzQuit; }
  function qzQuit() { clearInterval(qzTimer); QZ = null; play.hidden = true; play.innerHTML = ""; document.body.style.overflow = ""; render(); }
  const qzTop = (q, right = "") => `<div class="play-top"><button class="x" id="qz-quit" aria-label="Quitter">${ICON.x}</button><div class="qz-title"><small>${esc(q.tag)}</small><b>${esc(q.title)}</b></div>${right}</div>`;
  const srcHTML = (src) => src && src.length ? `<p class="qz-src">Source${src.length > 1 ? "s" : ""} : ${src.map((s) => `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.short)}</a>`).join(", ")}</p>` : "";

  function startQuiz(id, ctx = {}) {
    const q = QUIZZES.find((x) => x.id === id);
    if (!q) return;
    QZCTX = { duel: ctx.duel || null, daily: !!ctx.daily, noclock: false };
    const t = QTYPE[q.type];
    const kicker = QZCTX.duel ? `<p class="label qz-duel-tag">${ICON.swords} Duel du jour ${esc(QZCTX.duel.code)}${QZCTX.duel.vs ? ` contre ${esc(QZCTX.duel.vs)}` : ""}</p>` : QZCTX.daily ? `<p class="label qz-duel-tag">${ICON.sun} Quiz du jour, en solo</p>` : "";
    const clockOpt = (q.type === "list" || q.type === "clues") && !QZCTX.duel ? `<div class="seg qz-modes" id="qz-clockopt"><button data-clock="on" aria-pressed="true">${ICON.clock} Chrono</button><button data-clock="off" aria-pressed="false">Sans chrono</button></div><p class="note">Sans chrono : prends tout ton temps, les points restent les mêmes.</p>` : "";
    const modes = q.type === "list" && window.d3 && QD ? `<p class="note qz-2en1">${QICO.pen} Écris les noms <b>ou</b> ${QICO.globe} touche les pays sur le globe : les deux comptent, dans la même partie.</p>` : "";
    qzOpen(`${qzTop(q)}
      <div class="splash qz-splash">
        <div class="ico" style="background:${t.bg};color:${t.fg}">${QICO[t.ico]}</div>
        <p class="label">${esc(t.label)} · ${quizSize(q)} ${q.type === "qcm" || q.type === "dates" ? "questions" : q.type === "rank" ? "pays" : "à trouver"}</p>
        ${kicker}<h1 class="big">${esc(q.title)}</h1>
        <p class="rules">${esc(q.intro)}${q.time ? ` Tu as ${mmss(q.time)}.` : ""}${QZCTX.duel ? " Même quiz pour vous deux : le meilleur score gagne, à égalité le plus rapide. Pas de pause en duel." : ""}</p>
        ${q.type !== "rank" ? `<p class="qz-sd">💥 Mort subite : ${q.type === "list" ? "un pays qui n'en fait pas partie (touché sur le globe, ou écrit puis validé avec Entrée)" : q.type === "clues" ? "une mauvaise réponse validée avec Entrée" : "une erreur"}, et c'est fini. ${q.type === "list" || q.type === "actu" ? "Sur le globe : un toucher sélectionne et zoome, un second valide." : ""}</p>` : ""}
        ${modes}${clockOpt}
        <button class="btn" id="qz-go">C'est parti</button>
      </div>`);
    let mode = "write";
    play.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { mode = b.dataset.mode; play.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }));
    play.querySelectorAll("[data-clock]").forEach((b) => (b.onclick = () => { QZCTX.noclock = b.dataset.clock === "off"; play.querySelectorAll("[data-clock]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }));
    $("#qz-go").onclick = () => (QZT = { t0: performance.now(), paused: 0, pausedAt: 0 }) && (q.type === "list" ? runList(q) : q.type === "clues" ? runClues(q) : q.type === "dates" ? runDates(q) : q.type === "actu" ? runActu(q) : q.type === "rank" ? runRank(q) : runQcm(q));
  }

  function quizDone(q, pct, hints = 0, extra = "") {
    clearInterval(qzTimer);
    const secs = Math.round(qzElapsed());
    const st = S.quiz[q.id] || { best: 0, day: null, plays: 0 };
    const first = st.day !== today();
    let gain = first ? Math.max(0, Math.round((QUIZ_PT * pct) / 100) - 2 * hints) : 0;
    const daily = QZCTX.duel || QZCTX.daily;
    if (daily) {
      const dpct = Math.max(0, pct - (QZCTX.duel ? 3 * hints : 0));
      S.qd = { day: today(), code: QZCTX.duel ? QZCTX.duel.code : null, pct: dpct, secs };
      if (QZCTX.duel) qdSend(QZCTX.duel.code, dpct, secs);
    }
    const record = pct > st.best;
    S.quiz[q.id] = { best: Math.max(st.best, pct), day: today(), plays: (st.plays || 0) + 1 };
    if (gain) addPoints(gain); else save();
    const msg = pct === 100 ? "Sans faute !" : pct >= 75 ? "Très fort." : pct >= 50 ? "Pas mal du tout." : pct > 0 ? "Tu progresseras au prochain essai." : "Aïe. On retente ?";
    return `<div class="qz-end">
      <div class="qz-score num">${pct}<small> %</small></div>
      <p class="qz-msg">${msg}${record && st.plays ? " Nouveau record !" : ""}</p>
      <p class="muted">${gain ? `+${gain} points au classement${hints ? ` (${hints} indice${hints > 1 ? "s" : ""} utilisé${hints > 1 ? "s" : ""})` : ""}.` : first ? "Pas de points cette fois." : "Points déjà gagnés aujourd'hui sur ce quiz : rejoue pour le record."}</p>
      <p class="note">En ${mmss(secs)}${QZCTX.noclock ? ", sans chrono" : ""}.</p>
      ${extra}
      ${QZCTX.duel ? `<div class="card qd-res" id="qd-res" data-code="${esc(QZCTX.duel.code)}"><p class="muted">Résultat du duel…</p></div>` : ""}
      <div class="btns">${daily ? "" : `<button class="btn" id="qz-again">Rejouer</button>`}<button class="btn ${daily ? "" : "ghost"}" id="qz-back">${daily ? "Retour" : "Autres quiz"}</button></div>
      ${srcHTML(q.src)}
    </div>`;
  }
  function bindEnd(q) {
    const a = $("#qz-again"); if (a) a.onclick = () => startQuiz(q.id);
    $("#qz-back").onclick = qzQuit;
    const r = $("#qd-res"); if (r) qdWatch(r.dataset.code, r);
  }

  // Liste : écrire les noms (ils se placent tout seuls) ou cliquer les pays sur le globe.
  function runList(q) {
    // Deux en un : on peut écrire OU toucher le pays sur le globe, dans la même partie. Même difficulté pour tous.
    const items = q.items.map((x) => (Array.isArray(x) ? { id: x[0], hint: x[1] } : typeof x === "object" ? x : { id: x }));
    const pool = items;
    const tiny = items.filter((it) => !hasGeo(it.id));
    QZ = { found: new Set(), hints: 0, misses: 0, over: false, target: null, clue: { letters: 0, zone: false, near: false, cap: false } };
    const total = pool.length;
    qsLoad(q.id);
    qzOpen(`${qzTop(q, clockHTML(q))}
      <div class="qz-count"><b class="num" id="qz-n">0</b> / ${total} <span class="muted">trouvés</span></div>
      <div class="qz-globe" id="qz-globe"></div>
      <form id="qz-form" class="qz-input" autocomplete="off"><input id="qz-in" placeholder="Écris un pays, ou touche-le sur le globe…" aria-label="Écris un pays" autocapitalize="off" spellcheck="false"></form>
      ${tiny.length && window.d3 && QD ? `<p class="note qz-tip">Trop petits pour le globe, à écrire : ${tiny.length} pays.</p>` : ""}
      <div class="qz-confirm" id="qz-confirm" hidden><span>Pays sélectionné sur le globe.</span><button class="btn small" id="qz-ok">Valider</button><button class="btn ghost small" id="qz-cancel">Annuler</button></div>
      <div class="qz-mystery" id="qz-mystery" hidden></div>
      <div class="btns qz-tools">
        <button class="btn ghost small" data-hint="zone">📍 Où chercher</button>
        <button class="btn ghost small" data-hint="letter">🔤 Une lettre</button>
        <button class="btn ghost small" data-hint="near">🧭 Un voisin</button>
        ${items.some((it) => it.hint) ? `<button class="btn ghost small" data-hint="cap">🏛️ La capitale</button>` : ""}
        <button class="btn ghost small" id="qz-give">J'abandonne</button>
      </div>
      <p class="note" id="qz-hint-txt" aria-live="polite">Chaque indice coûte ${QZCTX.duel ? "3 % du score en duel" : "2 points"}.</p>
      ${q.grouped ? [...new Set(pool.map((it) => it.group))].map((g) => { const n = pool.filter((it) => it.group === g).length; return `<p class="qz-group"><b>${esc(g)}</b> <span class="num" data-gn="${esc(g)}">0</span>/${n}</p><ol class="qz-slots" data-group="${esc(g)}">${Array.from({ length: n }, (_, k) => `<li><span class="num">${k + 1}</span><b></b></li>`).join("")}</ol>`; }).join("")
        : `<ol class="qz-slots">${pool.map((it, k) => `<li><span class="num">${k + 1}</span><b></b></li>`).join("")}</ol>`}`);
    const globe = makeGlobe($("#qz-globe"), { onPick: pick, confirm: true, onSelect: (id) => { $("#qz-confirm").hidden = !id; } });
    if (!globe) play.querySelectorAll('[data-hint="zone"], [data-hint="near"]').forEach((b) => b.remove());
    $("#qz-ok").onclick = () => { const id = globe && globe.selected(); if (!id) return; globe.select(null); $("#qz-confirm").hidden = true; pick(id); };
    $("#qz-cancel").onclick = () => { globe && globe.select(null); $("#qz-confirm").hidden = true; };
    // Les cases se remplissent dans l'ordre de découverte (par continent pour la liste du monde), comme sur JetPunk.
    const groupOf = new Map(pool.map((it) => [it.id, it.group]));
    function fill(id, cls) {
      const box = q.grouped ? play.querySelector(`.qz-slots[data-group="${groupOf.get(id)}"]`) : play.querySelector(".qz-slots");
      const li = box.querySelector("li:not(.ok):not(.miss)");
      li.classList.add(cls); li.querySelector("b").textContent = qName(id); li.dataset.id = id;
      if (q.grouped && cls === "ok") { const c = play.querySelector(`[data-gn="${groupOf.get(id)}"]`); c.textContent = +c.textContent + 1; }
    }
    function found(id) {
      if (QZ.found.has(id) || QZ.over) return;
      QZ.found.add(id);
      fill(id, "ok");
      $("#qz-n").textContent = QZ.found.size;
      if (globe) { globe.mark(id, "found"); globe.focus(id); }
      if (QZ.target === id) { QZ.target = null; if (globe) globe.zone(null); $("#qz-mystery").hidden = true; }
      if (QZ.found.size === total) end();
    }
    function pick(id) {
      if (QZ.over) return;
      if (pool.some((it) => it.id === id)) found(id);
      else if (QZ.found.has(id)) return;
      else die(id);
    }
    // Mort subite : un pays qui n'en fait pas partie, et c'est fini.
    function die(id) {
      if (QZ.over) return;
      QZ.boom = id;
      if (globe) { globe.mark(id, "wrong"); globe.focus(id); }
      end();
    }
    function end() {
      if (QZ.over) return;
      QZ.over = true;
      clearInterval(qzTimer);
      if (globe) globe.zone(null);
      $("#qz-mystery").hidden = true;
      $("#qz-confirm").hidden = true; if (globe) globe.select(null);
      const missing = pool.filter((it) => !QZ.found.has(it.id));
      missing.forEach((it) => { fill(it.id, "miss"); globe && globe.mark(it.id, "miss"); });
      play.querySelectorAll("#qz-in, [data-hint], #qz-give").forEach((b) => (b.disabled = true));
      const pct = Math.round((QZ.found.size / total) * 100);
      const box = document.createElement("div");
      box.innerHTML = quizDone(q, pct, QZ.hints, `${QZ.boom ? `<p class="qz-boom">💥 Mort subite : ${esc(qName(QZ.boom))} n'en fait pas partie.</p>` : ""}${missing.length ? `<p class="note">En rouge : ceux qui manquaient.</p>` : ""}<div id="qz-rates"></div>`);
      play.querySelector(".qz-tools").replaceWith(box.firstElementChild);
      bindEnd(q);
      const res = Object.fromEntries(pool.map((it) => [it.id, QZ.found.has(it.id) ? 1 : 0]));
      qsPaint(q.id, res, (k) => play.querySelector(`.qz-slots li[data-id="${k}"]`), $("#qz-rates"), qName).then(() => qsSave(q.id, res));
    }
    const inp = $("#qz-in");
    // « Niger » est validé tout de suite… sauf si « Nigeria » reste à trouver : on attend alors une petite pause ou Entrée.
    let wait = null;
    const tryHit = (force) => {
      clearTimeout(wait);
      const v = norm(inp.value);
      if (v.length < 2) return false;
      const left = pool.filter((it) => !QZ.found.has(it.id));
      const hit = left.find((it) => accepted(it.id).has(v));
      if (!hit) return false;
      const longer = left.some((it) => it !== hit && [...accepted(it.id)].some((n) => n.length > v.length && n.startsWith(v)));
      if (longer && !force) { wait = setTimeout(() => tryHit(true), 900); return true; }
      found(hit.id); inp.value = ""; return true;
    };
    inp.oninput = () => tryHit(false);
    $("#qz-form").onsubmit = (e) => {
      e.preventDefault();
      if (tryHit(true) || !inp.value.trim()) return;
      // Un vrai pays qui n'est pas dans la liste, validé avec Entrée : mort subite. Une faute de frappe : on secoue juste.
      const other = countryByName(norm(inp.value));
      if (other && !QZ.found.has(other)) { inp.value = ""; return die(other); }
      inp.classList.add("shake"); setTimeout(() => inp.classList.remove("shake"), 400);
    };
    setTimeout(() => inp.focus(), 80);

    // Indices sur un « pays mystère » : on garde le même tant qu'il n'est pas trouvé, et les indices s'additionnent.
    const mask = (name, n) => { let k = 0; return [...name].map((c) => (/[a-zà-ÿ]/i.test(c) ? (k++ < n ? c.toUpperCase() : "_") : c)).join(" "); };
    function paintMystery() {
      const it = pool.find((x) => x.id === QZ.target), name = qName(it.id), c = QZ.clue, lines = [];
      lines.push(`<span class="qz-mask num">${esc(mask(name, c.letters))}</span><small>${[...name].filter((ch) => /[a-zà-ÿ]/i.test(ch)).length} lettres</small>`);
      if (c.zone) lines.push(`<span>📍 Il est dans la zone entourée sur le globe.</span>`);
      if (c.near) lines.push(`<span>🧭 Il est tout près de : <b>${esc(c.near)}</b>.</span>`);
      if (c.cap) lines.push(`<span>🏛️ Sa capitale : <b>${esc(it.hint)}</b>.</span>`);
      const m = $("#qz-mystery"); m.hidden = false; m.innerHTML = `<p class="label">Pays mystère</p>${lines.map((l) => `<p>${l}</p>`).join("")}`;
    }
    play.querySelectorAll("[data-hint]").forEach((b) => (b.onclick = () => {
      if (QZ.over) return;
      const kind = b.dataset.hint;
      let left = pool.filter((it) => !QZ.found.has(it.id));
      if (kind === "zone" || kind === "near") left = left.filter((it) => hasGeo(it.id));
      if (kind === "cap") left = left.filter((it) => it.hint);
      if (!left.length) return;
      if (!QZ.target || !left.some((it) => it.id === QZ.target)) { QZ.target = left[Math.floor(Math.random() * left.length)].id; QZ.clue = { letters: 0, zone: false, near: false, cap: false }; if (globe) globe.zone(null); }
      const c = QZ.clue, it = pool.find((x) => x.id === QZ.target);
      if (kind === "letter") { if (c.letters >= qName(it.id).length - 1) return; c.letters++; }
      else if (kind === "zone") { if (c.zone) return; c.zone = true; globe.zone(it.id); }
      else if (kind === "near") { if (c.near) return; c.near = globe.nearest(it.id) || "?"; }
      else if (kind === "cap") { if (c.cap) return; c.cap = true; }
      QZ.hints++;
      $("#qz-hint-txt").textContent = `Indices utilisés : ${QZ.hints} (${QZCTX.duel ? `−${3 * QZ.hints} % en duel` : `−${2 * QZ.hints} points`}).`;
      paintMystery();
    }));
    $("#qz-give").onclick = end;
    qzClock(q, end);
  }

  // Définitions : chaque réponse écrite se range en face de sa définition (« toutes les réponses commencent par P »).
  function runClues(q) {
    const items = q.items.map(([clue, ans, ...alt], k) => ({ k, clue, ans, ok: new Set([norm(ans), ...alt.map(norm)]) }));
    QZ = { found: new Set(), hints: 0, over: false };
    qzOpen(`${qzTop(q, clockHTML(q))}
      <div class="qz-count"><b class="num" id="qz-n">0</b> / ${items.length} <span class="muted">trouvées</span></div>
      <form id="qz-form" class="qz-input" autocomplete="off"><input id="qz-in" placeholder="Écris une réponse…" aria-label="Écris une réponse" autocapitalize="off" spellcheck="false"></form>
      <div class="btns qz-tools"><button class="btn ghost small" id="qz-hint">Un indice</button><button class="btn ghost small" id="qz-give">J'abandonne</button></div>
      <p class="note" id="qz-hint-txt" aria-live="polite"></p>
      <ol class="qz-clues">${items.map((it) => `<li data-k="${it.k}"><span>${esc(it.clue)}</span><b></b></li>`).join("")}</ol>`);
    const li = (k) => play.querySelector(`.qz-clues li[data-k="${k}"]`);
    qsLoad(q.id);
    function end() {
      if (QZ.over) return;
      QZ.over = true; clearInterval(qzTimer);
      items.filter((it) => !QZ.found.has(it.k)).forEach((it) => { const l = li(it.k); l.classList.add("miss"); l.querySelector("b").textContent = it.ans; });
      play.querySelectorAll("#qz-in, #qz-hint, #qz-give").forEach((b) => (b.disabled = true));
      const box = document.createElement("div");
      box.innerHTML = quizDone(q, Math.round((QZ.found.size / items.length) * 100), QZ.hints, `${QZ.boom ? `<p class="qz-boom">💥 Mort subite : « ${esc(QZ.boom)} » n'était pas une réponse.</p>` : ""}<div id="qz-rates"></div>`);
      play.querySelector(".qz-tools").replaceWith(box.firstElementChild);
      bindEnd(q);
      const res = Object.fromEntries(items.map((it) => [String(it.k), QZ.found.has(it.k) ? 1 : 0]));
      qsPaint(q.id, res, (k) => li(k), $("#qz-rates"), (k) => items[+k].ans).then(() => qsSave(q.id, res));
    }
    const inp = $("#qz-in");
    let wait = null;
    const tryHit = (force) => {
      clearTimeout(wait);
      const v = norm(inp.value);
      const left = items.filter((it) => !QZ.found.has(it.k));
      const hit = left.find((it) => it.ok.has(v));
      if (!hit) return false;
      if (!force && left.some((it) => it !== hit && [...it.ok].some((n) => n.length > v.length && n.startsWith(v)))) { wait = setTimeout(() => tryHit(true), 900); return true; }
      QZ.found.add(hit.k); inp.value = "";
      const l = li(hit.k); l.classList.add("ok"); l.querySelector("b").textContent = hit.ans;
      $("#qz-n").textContent = QZ.found.size;
      if (QZ.found.size === items.length) end();
      return true;
    };
    inp.oninput = () => tryHit(false);
    $("#qz-form").onsubmit = (e) => {
      e.preventDefault();
      if (tryHit(true) || norm(inp.value).length < 3) return;
      QZ.boom = inp.value.trim(); inp.value = ""; end();
    };
    $("#qz-hint").onclick = () => {
      const left = items.filter((it) => !QZ.found.has(it.k));
      if (!left.length) return;
      if (!QZ.target || QZ.found.has(QZ.target.k)) QZ.target = Object.assign(left[Math.floor(Math.random() * left.length)], { shown: 0 });
      const it = QZ.target;
      if (it.shown >= it.ans.length) return;
      it.shown++;
      QZ.hints++;
      let k = 0;
      const masked = [...it.ans].map((c) => (/[a-zà-ÿ]/i.test(c) ? (k++ < it.shown ? c.toUpperCase() : "_") : c)).join(" ");
      $("#qz-hint-txt").innerHTML = `« ${esc(it.clue)} » → <span class="qz-mask num">${esc(masked)}</span> · re-touche « Un indice » pour une lettre de plus.`;
    };
    $("#qz-give").onclick = end;
    setTimeout(() => inp.focus(), 80);
    qzClock(q, end);
  }

  // Dates du jour (duel du jour) : 5 « avant ou après » et 3 années à écrire, les mêmes pour tous ce jour-là.
  function runDates(q) {
    // Mort subite : douze « avant ou après », du plus large écart (accessible) au plus serré (pointu).
    const r = rng("qd-dates-" + today());
    const BANDS_GAP = [[25, 30], [18, 24], [12, 17], [7, 11], [4, 6], [1, 3]], used = new Set(), ids = [];
    for (const [lo, hi] of BANDS_GAP) {
      let n = 0;
      for (const id of shuffle(PAIRS, r)) {
        const g = gapOf(id), [a, b] = id.slice(1).split("_");
        if (g < lo || g > hi || used.has(a) || used.has(b)) continue;
        ids.push(id); used.add(a); used.add(b);
        if (++n === 2) break;
      }
    }
    const qs = buildAll(ids, "qd-" + today());
    QZ = { k: 0, score: 0 };
    function show() {
      const x = qs[QZ.k];
      const head = qzTop(q, `<span class="chip num">Série ${QZ.score} · ${QZ.k + 1}/${qs.length}</span>`);
      if (x.kind === "order") {
        qzOpen(`${head}<h2 class="question qz-q">Lequel est arrivé en premier ?</h2>
          <div class="versus">${[x.a, x.b].map((f, k) => `<button class="ans fact" data-k="${k}"><span class="fact-cat ${f[1]}">${CAT[f[1]]}</span><span class="fact-text">${esc(f[2])}</span><span class="fact-year num" aria-hidden="true"></span></button>${k === 0 ? '<span class="or">ou</span>' : ""}`).join("")}</div>
          <p class="note" id="qz-info" aria-live="polite"></p><div class="btns qz-tools"><button class="btn" id="qz-next" hidden></button></div>`);
        play.querySelectorAll(".ans").forEach((b) => (b.onclick = () => {
          const first = x.a[0] < x.b[0] ? 0 : 1, ok = +b.dataset.k === first;
          play.querySelectorAll(".ans").forEach((y) => { const j = +y.dataset.k; y.disabled = true; y.querySelector(".fact-year").innerHTML = flap([x.a, x.b][j][0]); if (j === first) y.classList.add("good"); else if (y === b) y.classList.add("bad"); });
          if (ok) QZ.score += 1; else QZ.dead = true;
          $("#qz-info").innerHTML = `<b class="${ok ? "ok" : "ko"}">${ok ? cheer() : "💥 Mort subite."}</b> ${Math.abs(x.a[0] - x.b[0])} an(s) d'écart.`;
          done();
        }));
      } else {
        qzOpen(`${head}<h2 class="question qz-q">En quelle année : ${esc(lower1(x.f[2]))} ?</h2>
          <form class="type-box" id="qz-yf" autocomplete="off"><input id="qz-y" inputmode="numeric" maxlength="4" placeholder="Année" class="year-in num" aria-label="Année"><button class="btn wide" type="submit">Valider</button></form>
          <p class="note" id="qz-info" aria-live="polite"></p><div class="btns qz-tools"><button class="btn" id="qz-next" hidden></button></div>`);
        const inp = $("#qz-y");
        inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, "").slice(0, 4); };
        setTimeout(() => inp.focus(), 60);
        $("#qz-yf").onsubmit = (e) => {
          e.preventDefault();
          if (!inp.value || inp.disabled) return;
          const gap = Math.abs(+inp.value - x.y), part = Math.max(0, 1 - 0.2 * gap);
          inp.disabled = true; play.querySelector("#qz-yf button").disabled = true;
          inp.classList.add(gap === 0 ? "good" : part > 0 ? "near" : "bad");
          QZ.score += part;
          $("#qz-info").innerHTML = gap === 0 ? `<b class="ok">Pile ${x.y} !</b>` : `<b class="${part > 0 ? "ok" : "ko"}">C'était en ${x.y}</b> : à ${gap} an${gap > 1 ? "s" : ""}${part > 0 ? `, ${Math.round(part * 100)} % du point` : ""}.`;
          done();
        };
      }
    }
    function done() {
      const nx = $("#qz-next"); nx.hidden = false;
      nx.textContent = QZ.k + 1 < qs.length && !QZ.dead ? "Suivante" : "Voir mon score";
      nx.focus();
      nx.onclick = () => {
        QZ.k++;
        if (QZ.k < qs.length && !QZ.dead) return show();
        qzOpen(`${qzTop(q)}<p class="qz-prompt"><small>${QZ.dead ? "Mort subite" : "Sans faute"}</small>Série : ${QZ.score} sur ${qs.length}.</p><div class="qz-tools"></div>`);
        const box = document.createElement("div");
        box.innerHTML = quizDone(q, Math.round((QZ.score / qs.length) * 100));
        play.querySelector(".qz-tools").replaceWith(box.firstElementChild);
        bindEnd(q);
      };
    }
    show();
  }

  // Les pays de l'actu : une actu, un clic sur le globe.
  function runActu(q) {
    const list = shuffleR(QD.news.filter((n) => hasGeo(n.iso)), QZCTX.duel || QZCTX.daily ? rng("qd-actu-" + today()) : Math.random).slice(0, q.count);
    QZ = { k: 0, ok: 0, hints: 0 };
    qzOpen(`${qzTop(q, `<span class="chip num" id="qz-step">1/${list.length}</span>`)}
      <p class="qz-prompt" id="qz-prompt"></p>
      <div class="qz-globe big" id="qz-globe"></div>
      <div class="qz-confirm" id="qz-confirm" hidden><span>Pays sélectionné.</span><button class="btn small" id="qz-ok">Valider</button><button class="btn ghost small" id="qz-cancel">Annuler</button></div>
      <p class="note" id="qz-hint-txt" aria-live="polite"></p>
      <div class="btns qz-tools"><button class="btn ghost small" id="qz-hint">Un indice</button><button class="btn" id="qz-next" hidden>Suivante</button></div>`);
    const globe = makeGlobe($("#qz-globe"), { onPick: pick, confirm: true, onSelect: (id) => { $("#qz-confirm").hidden = !id; } });
    if (globe) {
      $("#qz-ok").onclick = () => { const id = globe.selected(); if (!id) return; globe.select(null); $("#qz-confirm").hidden = true; pick(id); };
      $("#qz-cancel").onclick = () => { globe.select(null); $("#qz-confirm").hidden = true; };
    }
    if (!globe) { play.innerHTML = `<div class="wrap qz">${qzTop(q)}<p class="muted">Le globe n'a pas pu se charger.</p></div>`; $("#qz-quit").onclick = qzQuit; return; }
    let answered = false;
    function show() {
      const n = list[QZ.k];
      answered = false;
      $("#qz-step").textContent = `${QZ.k + 1}/${list.length}`;
      $("#qz-prompt").innerHTML = `<small>${new Date(n.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}</small>« ${esc(n.title)} »`;
      $("#qz-hint-txt").textContent = "Où ça se passe ? Touche le pays.";
      $("#qz-next").hidden = true; $("#qz-hint").disabled = false;
    }
    function pick(id) {
      if (answered) return;
      const n = list[QZ.k];
      answered = true;
      const good = id === n.iso;
      if (good) { QZ.ok++; globe.mark(id, "found"); } else { globe.mark(id, "wrong"); globe.mark(n.iso, "miss"); globe.focus(n.iso); }
      $("#qz-hint-txt").innerHTML = good ? `<b class="ok">${cheer()}</b> ${esc(qName(n.iso))}.` : `<b class="ko">Non</b> : c'était ${esc(qName(n.iso))}.`;
      $("#qz-hint").disabled = true;
      if (!good) QZ.dead = true;
      const nx = $("#qz-next"); nx.hidden = false; nx.textContent = QZ.k + 1 < list.length && good ? "Suivante" : "Voir mon score";
    }
    $("#qz-next").onclick = () => {
      globe.mark(list[QZ.k].iso, ""); QZ.k++;
      play.querySelectorAll(".g-land.wrong").forEach((p) => p.setAttribute("class", "g-land"));
      if (QZ.k < list.length && !QZ.dead) return show();
      const box = document.createElement("div");
      box.innerHTML = quizDone(q, Math.round((QZ.ok / list.length) * 100), QZ.hints, QZ.dead ? `<p class="qz-boom">💥 Mort subite : une erreur, et la série s'arrête.</p>` : "");
      play.querySelector(".qz-tools").replaceWith(box.firstElementChild);
      $("#qz-prompt").innerHTML = `<small>Terminé</small>${QZ.ok} pays bien placés sur ${list.length}.`;
      bindEnd(q);
    };
    $("#qz-hint").onclick = () => { QZ.hints++; const n = list[QZ.k]; globe.focus(n.iso); $("#qz-hint-txt").textContent = "Indice : le globe s'est tourné vers la bonne région."; };
    show();
  }

  // Classement à reconstituer : toucher les pays dans l'ordre, du plus haut au plus bas.
  const RANK_POOL = ["840", "156", "356", "392", "276", "250", "826", "380", "724", "076", "484", "124", "036", "410", "360", "792", "682", "710", "032", "643", "566", "818", "586", "704", "764", "608", "458", "152", "170", "604", "616", "752", "756", "578", "348", "642", "404", "288", "231", "434", "398"]; // sans Venezuela, Iran ni Soudan : chiffres extrêmes, à prendre avec prudence
  function rankRows(q) {
    if (q.rows) return { rows: q.rows.map(([id, v]) => ({ id, v })), unit: q.unit, src: q.src, note: q.note };
    const ind = QD.ind[q.ind], r = rng(q.id + today());
    const cands = shuffleR(RANK_POOL.filter((id) => ind.values[id] && typeof ind.values[id][0] === "number"), r);
    const rows = [];
    for (const id of cands) {
      const v = ind.values[id][0];
      if (rows.every((x) => Math.abs(x.v - v) >= 0.4)) rows.push({ id, v, d: ind.values[id][1] });
      if (rows.length === 5) break;
    }
    return { rows, unit: ind.unit, src: [ind.src], note: `Chiffres de l'onglet Chiffres de Geonomix (mis à jour le ${new Date(QD.updated).toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}). Ils changent chaque jour.` };
  }
  function runRank(q) {
    const R = rankRows(q);
    const correct = R.rows.slice().sort((a, b) => b.v - a.v).map((x) => x.id);
    const shown = shuffleR(R.rows, rng(q.id + "s" + today()));
    const picked = [];
    const fmtV = (v) => `${String(v).replace(".", ",")}${R.unit === "%" ? " %" : ""}`;
    qzOpen(`${qzTop(q)}
      <p class="qz-prompt"><small>Du plus haut au plus bas</small>${esc(q.intro)}</p>
      <div class="qz-rank" id="qz-rank">${shown.map((x) => `<button class="qz-rk" data-id="${x.id}"><span class="qz-rk-n num"></span><b>${esc(qName(x.id))}</b><span class="qz-rk-v num"></span></button>`).join("")}</div>
      <div class="btns qz-tools"><button class="btn ghost small" id="qz-undo" disabled>Annuler</button></div>`);
    const btns = [...play.querySelectorAll(".qz-rk")];
    const paint = () => { btns.forEach((b) => { const k = picked.indexOf(b.dataset.id); b.querySelector(".qz-rk-n").textContent = k >= 0 ? k + 1 : ""; b.classList.toggle("on", k >= 0); }); $("#qz-undo").disabled = !picked.length; };
    btns.forEach((b) => (b.onclick = () => {
      if (picked.includes(b.dataset.id) || picked.length >= 5) return;
      picked.push(b.dataset.id); paint();
      if (picked.length === 5) finishRank();
    }));
    $("#qz-undo").onclick = () => { picked.pop(); paint(); };
    function finishRank() {
      let ok = 0;
      const rk = $("#qz-rank");
      rk.innerHTML = correct.map((id, k) => {
        const row = R.rows.find((x) => x.id === id), good = picked[k] === id;
        if (good) ok++;
        return `<div class="qz-rk done ${good ? "good" : "bad"}"><span class="qz-rk-n num">${k + 1}</span><b>${esc(qName(id))}${good ? "" : `<small>tu l'avais mis ${picked.indexOf(id) + 1}ᵉ</small>`}</b><span class="qz-rk-v num">${fmtV(row.v)}${row.d ? `<small>${esc(row.d)}</small>` : ""}</span></div>`;
      }).join("");
      const box = document.createElement("div");
      box.innerHTML = quizDone(Object.assign({}, q, { src: R.src }), Math.round((ok / 5) * 100), 0, `<p class="note">${R.unit !== "%" ? `En ${esc(R.unit)}. ` : ""}${esc(R.note || "")}</p>`);
      play.querySelector(".qz-tools").replaceWith(box.firstElementChild);
      bindEnd(q);
    }
  }

  // QCM : quatre réponses, la bonne est toujours écrite en premier dans la liste puis mélangée.
  function runQcm(q) {
    qsLoad(q.id);
    const qres = {};
    // Du plus accessible au plus pointu (niveau en 4ᵉ position, 2 par défaut), mélangé à l'intérieur d'un même niveau.
    const qs = shuffleR(q.qs).sort((a, b) => (a[3] || 2) - (b[3] || 2));
    QZ = { k: 0, ok: 0 };
    function show() {
      const [text, opts, info] = qs[QZ.k];
      const mixed = shuffleR(opts.map((o, i) => ({ o, good: i === 0 })));
      const lvl = qs[QZ.k][3] || 2;
      qzOpen(`${qzTop(q, `<span class="chip num">Série ${QZ.ok} · ${QZ.k + 1}/${qs.length}</span>`)}
        <p class="qz-level">${"●".repeat(lvl)}${"○".repeat(3 - lvl)} ${["", "Pour se lancer", "On monte d'un cran", "Pour les pointus"][lvl]}</p>
        <h2 class="question qz-q">${esc(text)}</h2>
        <div class="qz-opts">${mixed.map((m, i) => `<button class="qz-opt" data-i="${i}">${esc(m.o)}</button>`).join("")}</div>
        <p class="note" id="qz-info" aria-live="polite"></p>
        <div class="btns qz-tools"><button class="btn" id="qz-next" hidden>${QZ.k + 1 < qs.length ? "Suivante" : "Voir mon score"}</button></div>`);
      play.querySelectorAll(".qz-opt").forEach((b) => (b.onclick = () => {
        const m = mixed[+b.dataset.i];
        play.querySelectorAll(".qz-opt").forEach((x, i) => { x.disabled = true; if (mixed[i].good) x.classList.add("good"); else if (x === b) x.classList.add("bad"); else x.classList.add("dim"); });
        if (m.good) QZ.ok++; else QZ.dead = true;
        const key = "q" + (hash(text) % 9999991);
        qres[key] = m.good ? 1 : 0;
        $("#qz-info").innerHTML = `<b class="${m.good ? "ok" : "ko"}">${m.good ? cheer() : "💥 Mort subite."}</b> ${m.good ? "" : `C'était : ${esc(opts[0])}. `}${info ? esc(info) : ""}<span id="qz-qrate"></span>`;
        qsLoad(q.id).then((st) => { const x = st && st.rate.get(key), pc = pctOf(x), el = $("#qz-qrate"); if (el && pc != null) el.innerHTML = ` <span class="qz-rate inline${m.good && pc < 30 ? " rare" : ""}">${pc} % des joueurs ont bon</span>`; });
        if (QZ.dead || QZ.k + 1 >= qs.length) qsSave(q.id, qres);
        const nx = $("#qz-next"); nx.hidden = false; if (QZ.dead) nx.textContent = "Voir mon score";
      }));
      $("#qz-next").onclick = () => {
        QZ.k++;
        if (QZ.k < qs.length && !QZ.dead) return show();
        qzOpen(`${qzTop(q)}<p class="qz-prompt"><small>${QZ.dead ? "Mort subite" : "Sans faute"}</small>Série : ${QZ.ok} bonne${QZ.ok > 1 ? "s" : ""} réponse${QZ.ok > 1 ? "s" : ""} sur ${qs.length}.</p><div class="qz-tools"></div>`);
        const box = document.createElement("div");
        box.innerHTML = quizDone(q, Math.round((QZ.ok / qs.length) * 100));
        play.querySelector(".qz-tools").replaceWith(box.firstElementChild);
        bindEnd(q);
      };
    }
    show();
  }

  render();
  initShared();
})();
</script>
