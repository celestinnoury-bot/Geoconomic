  const shuffle = (arr, r = Math.random) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (arr, n, r) => shuffle(arr, r).slice(0, n);
  const pad = (n) => String(n).padStart(2, "0");
  const today = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return today(d); };
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const fmt = (n) => Number(n || 0).toLocaleString("fr-FR");
  // « de » + nom de pays avec son article : du Japon, des Pays-Bas, de la Pologne, de l'Irlande, d'Oman.
  function de(x) {
    if (x.startsWith("le ")) return "du " + x.slice(3);
    if (x.startsWith("les ")) return "des " + x.slice(4);
    if (x.startsWith("la ") || x.startsWith("l'")) return "de " + x;
    return /^[aeiouyéèêâîôûœ]/i.test(x) ? "d'" + x : "de " + x;
  }
  const shortCur = (m) => m.split(" ").slice(0, 2).join(" ");
  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4l-5.5 2.9 1-6.2L3 9.7l6.2-.9L12 3z"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',
    swords: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m4 20 7-7M20 20l-7-7M14.5 4.5 20 4l-.5 5.5L13 16l-5-5 6.5-6.5zM9.5 4.5 4 4l.5 5.5"/></svg>',
    skull: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a8 8 0 0 0-5 14.2V20h10v-2.8A8 8 0 0 0 12 3z"/><circle cx="9" cy="11" r="1.6" fill="currentColor"/><circle cx="15" cy="11" r="1.6" fill="currentColor"/><path d="M10 20v-2M14 20v-2"/></svg>',
    bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
    crown: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>',
    live: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="16" r="3"/><path d="M11 8h5a2 2 0 0 1 2 2v3M13 16H8a2 2 0 0 1-2-2v-3"/></svg>',
  };

  // ================= Sauvegarde locale (série, points, questions déjà vues) =================
  const KEY = "geoduel-v1";
  let S = { points: 0, streak: 0, lastDay: null, lessons: {}, daily: null, best: 0, ms: [], msBotNext: 0, wins: 0, played: 0, seen: [] };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  if (S.xp && !S.points) S.points = S.xp;
  if (!Array.isArray(S.seen)) S.seen = [];
  if (!Array.isArray(S.ms)) S.ms = [];
  const seen = new Set(S.seen);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  function markSeen(id) { if (!id || seen.has(id)) return; seen.add(id); S.seen.push(id); if (S.seen.length > 4000) seen.delete(S.seen.shift()); }
  function touchStreak() { const t = today(); if (S.lastDay === t) return; S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = t; }
  const streakNow = () => (S.lastDay === today() || S.lastDay === yesterday() ? S.streak : 0);
  function addPoints(n) { S.points += n; touchStreak(); save(); renderCounters(); syncPlayer(); }
  function renderCounters() { $("#c-xp").textContent = fmt(S.points); $("#c-streak").textContent = streakNow(); }

  // ================= Banque : chaque question a un identifiant =================
  // c = QCM écrit, k/K = capitale (dans un sens ou l'autre), m/M = monnaie, d = date, i = intrus, o = avant/après (paire de dates).
  const POOL = {
    qcm: [
      ...QCM.map((x, i) => ({ id: "c" + i, th: x[0] })),
      ...CAPITALES.flatMap((x, i) => [{ id: "k" + i, th: "carte" }, { id: "K" + i, th: "carte" }]),
      ...MONNAIES.flatMap((x, i) => (x[2].split(" ").length === 2 ? [{ id: "m" + i, th: "eco" }, { id: "M" + i, th: "eco" }] : [{ id: "m" + i, th: "eco" }])),
    ],
    date: DATES.map((x, i) => ({ id: "d" + i, th: x[0] })),
    intrus: INTRUS.map((x, i) => ({ id: "i" + i, th: x[0] })),
    // Mort subite : réponse écrite, une date (y) ou un mot (q), classée par niveau.
    ms: [...OPEN.map((x, i) => ({ id: "q" + i, th: x[1], lv: x[0] })), ...DATES.map((x, i) => ({ id: "y" + i, th: x[0], lv: DATE_LEVEL[i] || 3 }))],
  };
  const ORDER_PAIRS = (() => { let n = 0; for (let a = 0; a < DATES.length; a++) for (let b = a + 1; b < DATES.length; b++) if (Math.abs(DATES[a][2] - DATES[b][2]) >= 3) n++; return n; })();
  const BANK = POOL.qcm.length + POOL.date.length + POOL.intrus.length + OPEN.length;

  // Réponse écrite : on ignore majuscules, accents, articles et petites fautes de frappe.
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[''`’]/g, " ").replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\b(le|la|les|l|un|une|des|du|de|d)\b/g, " ").replace(/\s+/g, " ").trim();
  function lev(a, b) {
    const d = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) { let prev = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }
    return d[b.length];
  }
  function matchOpen(input, answers) {
    const v = norm(input); if (!v) return false;
    return answers.some((a) => { const n = norm(a); if (!n) return false; const tol = n.length >= 9 ? 2 : n.length >= 5 ? 1 : 0; return v === n || lev(v, n) <= tol || (n.length >= 4 && (" " + v + " ").includes(" " + n + " ")); });
  }

  function rangeFor(y) { return y >= 1900 ? [1900, 2026] : y >= 1750 ? [1750, 1950] : [1400, 1900]; }
  function mkDate(it) { const [th, e, y, ex] = it; const [min, max] = rangeFor(y); return { kind: "date", th, e, y, ex: ex || "", min, max }; }
  function mkIntrus(it, r) { const [th, q, items, odd, ex] = it; return { kind: "intrus", th, q, items: shuffle(items.map((t, i) => ({ t, odd: i === odd })), r), ex }; }
  function qcmObj(id, th, q, c, wrong, ex, r) { return { kind: "qcm", id, th, q, correct: c, wrong, ex: ex || "", opts: shuffle([c, ...wrong], r), duoWrong: wrong[Math.floor(r() * wrong.length)] }; }
  // Trois mauvaises réponses prises dans la même liste (même continent quand c'est possible), sans doublon avec la bonne.
  function others(list, i, val, r, zone) {
    const good = val(list[i]);
    const ok = (x, k) => k !== i && val(x) !== good;
    const near = list.filter((x, k) => ok(x, k) && (!zone || x[3] === list[i][3]));
    const base = near.length >= 3 ? near : list.filter(ok);
    const out = [];
    for (const x of shuffle(base, r)) { if (!out.includes(val(x))) out.push(val(x)); if (out.length === 3) break; }
    return out;
  }
  function build(id, seed = "") {
    const r = rng(id + "|" + seed);
    const t = id[0], n = id.slice(1);
    if (t === "c" && QCM[+n]) { const [th, q, c, w1, w2, w3, ex] = QCM[+n]; return qcmObj(id, th, q, c, [w1, w2, w3], ex, r); }
    if (t === "k" && CAPITALES[+n]) { const x = CAPITALES[+n]; return qcmObj(id, "carte", `Quelle est la capitale ${de(x[1])} ?`, x[2], others(CAPITALES, +n, (y) => y[2], r, true), "", r); }
    if (t === "K" && CAPITALES[+n]) { const x = CAPITALES[+n]; return qcmObj(id, "carte", `${x[2]} est la capitale de quel pays ?`, x[0], others(CAPITALES, +n, (y) => y[0], r, true), "", r); }
    if (t === "m" && MONNAIES[+n]) { const x = MONNAIES[+n]; return qcmObj(id, "eco", `Quelle est la monnaie ${de(x[1])} ?`, cap(shortCur(x[2])), others(MONNAIES, +n, (y) => cap(shortCur(y[2])), r), "", r); }
    if (t === "M" && MONNAIES[+n]) { const x = MONNAIES[+n]; return qcmObj(id, "eco", `${cap(x[2])} est la monnaie de quel pays ?`, x[0], others(MONNAIES, +n, (y) => y[0], r), "", r); }
    if (t === "d" && DATES[+n]) return Object.assign(mkDate(DATES[+n]), { id });
    if (t === "y" && DATES[+n]) return Object.assign(mkDate(DATES[+n]), { id, typed: true, lv: DATE_LEVEL[+n] || 3 });
    if (t === "q" && OPEN[+n]) { const [lv, th, q, answers, ex] = OPEN[+n]; return { kind: "open", id, th, q, answers, ex, lv }; }
    if (t === "i" && INTRUS[+n]) return Object.assign(mkIntrus(INTRUS[+n], r), { id });
    if (t === "o") {
      const [a, b] = n.split("_").map(Number);
      if (!DATES[a] || !DATES[b]) return null;
      const [x, y] = r() < 0.5 ? [a, b] : [b, a];
      return { kind: "order", id, th: DATES[x][0], a: mkDate(DATES[x]), b: mkDate(DATES[y]) };
    }
    return null;
  }
  // Tire n identifiants d'un type, en évitant d'abord les questions déjà vues (et celles à exclure).
  function drawIds(kind, n, r = Math.random, { th = null, lv = null, exclude = new Set(), useSeen = true } = {}) {
    if (kind === "order") {
      const out = [];
      for (let tries = 0; out.length < n && tries < 600; tries++) {
        const a = Math.floor(r() * DATES.length), b = Math.floor(r() * DATES.length);
        if (a === b || Math.abs(DATES[a][2] - DATES[b][2]) < 3) continue;
        const id = `o${Math.min(a, b)}_${Math.max(a, b)}`;
        if (out.includes(id) || exclude.has(id) || (useSeen && seen.has(id) && tries < 400)) continue;
        out.push(id);
      }
      return out;
    }
    const all = POOL[kind].filter((x) => (!th || x.th === th) && (lv == null || x.lv === lv)).map((x) => x.id).filter((id) => !exclude.has(id));
    let out = pick(useSeen ? all.filter((id) => !seen.has(id)) : all, n, r);
    if (out.length < n) out = out.concat(pick(all.filter((id) => !out.includes(id)), n - out.length, r));
    return out;
  }
  const buildAll = (ids, seed, extra) => ids.map((id) => build(id, seed)).filter(Boolean).map((q) => Object.assign(q, extra || {}));

  // ================= Moteur de partie =================
  let G = null, timerId = null;
  const play = $("#play");

  function startGame(cfg) {
    G = Object.assign({ i: 0, me: 0, opp: 0, hearts: null, correct: 0, answered: 0, combo: 0, sdGuesses: [], oppAns: {}, typed: cfg.mode !== "lesson" }, cfg);
    play.hidden = false;
    document.body.style.overflow = "hidden";
    next();
  }
  function quit() {
    clearInterval(timerId);
    if (G) { clearTimeout(G.waitT); clearTimeout(G.autoT); if (G.mode === "live") leaveLive(); }
    G = null; play.hidden = true; play.innerHTML = ""; document.body.style.overflow = ""; render();
  }

  function next() {
    clearInterval(timerId);
    if (!G) return;
    if (G.hearts === 0) return finish();
    if (G.endless && G.i >= G.qs.length) G.qs.push(G.endless());
    if (G.i >= G.qs.length) {
      if (G.onRegularEnd && !G.sdStarted) { const more = G.onRegularEnd(); if (more && more.length) { G.sdStarted = true; G.qs.push(...more); return next(); } }
      return finish();
    }
    const q = G.qs[G.i];
    if (q.kind === "splash") return renderSplash(q);
    renderQ(q);
  }

  const mult = () => (G.combo >= 5 ? 3 : G.combo >= 3 ? 2 : 1);
  function header() {
    const prog = G.endless ? "" : `<div class="bar" aria-hidden="true"><i style="width:${Math.round((G.i / G.qs.length) * 100)}%"></i></div>`;
    let right = "";
    if (G.hearts != null) right = `<span class="hearts" aria-label="${G.hearts} vies">${ICON.heart}<span class="num">${G.hearts}</span></span>`;
    else if (G.endless) right = `<span class="chip" style="color:var(--gold)">Série : ${G.correct}</span>`;
    else if (G.mode === "eclair") right = `<span class="chip combo ${G.combo >= 3 ? "hot" : ""}">Combo ×${mult()}</span>`;
    const board = G.opponent ? `
      <div class="scoreboard">
        <div class="side"><span class="avatar you">Toi</span><div><div class="who">Toi</div><div class="pts num" id="sb-me">${fmt(G.me)}</div></div></div>
        <span class="vs">${G.mode === "live" ? '<span class="live-dot"></span>' : ""}VS</span>
        <div class="side right"><div><div class="who" id="sb-name">${esc(G.opponent.name)}</div><div class="pts num" id="sb-opp">${G.opponent.hidden ? "?" : fmt(G.opp)}</div></div><span class="avatar opp">${esc(G.opponent.short)}</span></div>
      </div>` : "";
    return `<div class="wrap"><div class="play-top"><button class="x" id="quit" aria-label="Quitter la partie">${ICON.x}</button>${prog}${right}</div>${board}`;
  }
  function timerHTML(sec) { return sec ? `<div class="timer" id="timer"><svg viewBox="0 0 50 50"><circle class="bg" cx="25" cy="25" r="21"/><circle class="fg" cx="25" cy="25" r="21" stroke-dasharray="132" stroke-dashoffset="0"/></svg><span class="num">${sec}</span></div>` : ""; }
  function startTimer(sec, onEnd) {
    if (!sec) return;
    const t0 = performance.now();
    G.t0 = t0; G.sec = sec;
    timerId = setInterval(() => {
      const left = Math.max(0, sec - (performance.now() - t0) / 1000);
      const el = $("#timer"); if (!el) return;
      el.querySelector(".fg").setAttribute("stroke-dashoffset", String(132 * (1 - left / sec)));
      el.querySelector("span").textContent = Math.ceil(left);
      el.classList.toggle("low", left < 4);
      if (left <= 0) { clearInterval(timerId); onEnd(); }
    }, 100);
  }
  const timeLeft = () => (G.sec ? Math.max(0, G.sec - (performance.now() - G.t0) / 1000) : 0);
  function qhead(q, label) { return `<div class="qhead"><span class="chip ${q.th}">${label || THEME[q.th]}</span>${timerHTML(q.timer || G.timer)}</div>`; }

  function renderSplash(q) {
    play.innerHTML = `${header()}
      <div class="splash">
        <div class="ico" style="background:${q.bg || "var(--panel-2)"};color:${q.fg || "var(--text)"}">${q.icon || ICON.star}</div>
        <p class="label">${esc(q.kicker || "")}</p>
        <h1 class="big ${q.sd ? "sd" : ""}">${esc(q.title)}</h1>
        <p class="rules">${q.rules}</p>
        ${q.auto ? `<p class="note">On enchaîne dans quelques secondes…</p>` : `<button class="btn" id="go">${esc(q.cta || "C'est parti")}</button>`}
      </div></div>`;
    $("#quit").onclick = quit;
    const go = () => { if (G && G.qs[G.i] === q) { G.i++; next(); } };
    if (q.auto) setTimeout(go, q.auto); else $("#go").onclick = go;
  }

  function renderQ(q) {
    let body = "";
    if (q.kind === "qcm" && G.duoCarre && !q.mode) {
      body = `${qhead(q, "Duo ou carré ?")}
        <h2 class="question">${esc(q.q)}</h2>
        <p class="muted">Avant de voir les réponses, choisis : deux propositions pour 1 point, ou quatre pour 2 points.</p>
        <div class="choice">
          <button class="duo" data-mode="duo"><span class="dots" style="color:var(--blue)"><i></i><i></i></span><b>Duo</b><span>2 réponses · 1 pt</span></button>
          <button class="carre" data-mode="carre"><span class="dots" style="color:var(--gold)"><i></i><i></i><i></i><i></i></span><b>Carré</b><span>4 réponses · 2 pts</span></button>
        </div>`;
      play.innerHTML = `${header()}${body}<div class="spacer"></div></div>`;
      $("#quit").onclick = quit;
      play.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { q.mode = b.dataset.mode; renderQ(q); }));
      return;
    }
    if (q.kind === "qcm") {
      const opts = q.mode === "duo" ? shuffle([q.correct, q.duoWrong]) : q.opts;
      body = `${qhead(q, q.mode === "duo" ? "Duo · 1 pt" : q.mode === "carre" ? "Carré · 2 pts" : "")}<h2 class="question">${esc(q.q)}</h2>
        <div class="answers ${q.mode === "duo" ? "grid2" : ""}">${opts.map((o) => `<button class="ans" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    } else if (q.kind === "intrus") {
      body = `${qhead(q)}<h2 class="question">${esc(q.q)}</h2>
        <div class="intrus">${q.items.map((it, k) => `<button class="ans" data-k="${k}">${esc(it.t)}</button>`).join("")}</div>`;
    } else if (q.kind === "order") {
      body = `${qhead(q, "Avant ou après ?")}<h2 class="question">Lequel est arrivé en premier ?</h2>
        <div class="answers">${[q.a, q.b].map((d, k) => `<button class="ans order-card" data-k="${k}">${esc(d.e)}</button>`).join("")}</div>`;
    } else if (q.kind === "open" || (q.kind === "date" && (q.typed || G.typed))) {
      // Réponse à écrire, sans indice : ni propositions, ni bornes.
      const isDate = q.kind === "date";
      const label = q.lv ? `Niveau ${q.lv} · ${["ça va", "facile", "moyen", "costaud", "dur"][q.lv - 1]}` : q.sd ? "Mort subite" : isDate ? "Écris l'année" : "Écris ta réponse";
      body = `${qhead(q, label)}
        ${q.lv ? `<div class="levels" aria-hidden="true">${[1, 2, 3, 4, 5].map((k) => `<i class="${k < q.lv ? "passed" : k === q.lv ? "now" : ""}"></i>`).join("")}</div>` : ""}
        <h2 class="question">${isDate ? `En quelle année : ${esc(q.e.charAt(0).toLowerCase() + q.e.slice(1))} ?` : esc(q.q)}</h2>
        <form class="type-box" id="type-form" autocomplete="off">
          <input id="ty" ${isDate ? 'inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Année" class="year-in num"' : 'type="text" maxlength="60" placeholder="Ta réponse" autocapitalize="off" spellcheck="false"'} aria-label="${isDate ? "Année" : "Ta réponse"}">
          <button class="btn wide" id="valider" type="submit">Valider</button>
          <p class="note">${isDate ? "L'année exacte, en chiffres." : "Un mot ou un nom suffit. Accents et petites fautes de frappe acceptés."}</p>
        </form>`;
    } else if (q.kind === "date") {
      const mid = Math.round((q.min + q.max) / 2);
      body = `${qhead(q, q.sd ? "Mort subite" : q.tol != null ? `À ${q.tol} an${q.tol > 1 ? "s" : ""} près` : "En quelle année ?")}
        <h2 class="question">${esc(q.e)}</h2>
        <div class="year">
          <div class="year-big num" id="yv">${mid}</div>
          <label class="label" for="yr">Glisse jusqu'à ton année</label>
          <input type="range" id="yr" min="${q.min}" max="${q.max}" value="${mid}">
          <div class="range-ends num"><span>${q.min}</span><span>${q.max}</span></div>
          <div class="steps"><button data-d="-10">−10</button><button data-d="-1">−1</button><button data-d="1">+1</button><button data-d="10">+10</button></div>
          <button class="btn wide" id="valider">Valider</button>
        </div>`;
    }
    play.innerHTML = `${header()}${body}<div class="spacer"></div></div>`;
    $("#quit").onclick = quit;
    G.qStart = performance.now();
    const tf = $("#type-form");
    if (tf) {
      const inp = $("#ty");
      if (q.kind === "date") inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, "").slice(0, 4); };
      tf.onsubmit = (e) => { e.preventDefault(); const v = inp.value.trim(); if (!v) { inp.focus(); return; } answer(q, q.kind === "date" ? parseInt(v, 10) : v); };
      setTimeout(() => inp.focus(), 60);
    } else if (q.kind === "date") {
      const r = $("#yr"), v = $("#yv");
      const set = (y) => { r.value = Math.min(q.max, Math.max(q.min, y)); v.textContent = r.value; };
      r.oninput = () => set(+r.value);
      play.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => set(+r.value + +b.dataset.d)));
      $("#valider").onclick = () => answer(q, +r.value);
    } else {
      play.querySelectorAll(".ans").forEach((b) => (b.onclick = () => answer(q, b.dataset.v ?? +b.dataset.k, b)));
    }
    startTimer(q.timer || G.timer, () => answer(q, null));
  }

  // Ce que rapporte une bonne réponse, selon le mode.
  function gainFor(q, left) {
    if (G.mode === "daily" || G.mode === "live") return 100 + Math.round(left * 5);
    if (G.mode === "eclair") return 10 * mult();
    if (G.mode === "bot" || G.mode === "friend") return q.kind === "qcm" ? (q.mode === "duo" ? 1 : 2) : q.kind === "intrus" ? 2 : 1;
    return 1;
  }

  function answer(q, val, btn) {
    if (q.done) return;
    q.done = true;
    clearInterval(timerId);
    const left = timeLeft();
    let ok = false, info = "", detail = "";
    play.querySelectorAll(".ans, #valider, .steps button, #yr, #ty").forEach((b) => (b.disabled = true));
    const typed = !!$("#type-form");
    if (q.kind === "open") {
      ok = val != null && matchOpen(val, q.answers);
      const inp = $("#ty"); if (inp) inp.classList.add(ok ? "good" : "bad");
      info = val == null ? `Temps écoulé. Réponse : ${q.answers[0]}.` : ok ? (norm(val) === norm(q.answers[0]) ? "" : `Réponse attendue : ${q.answers[0]}.`) : `Réponse attendue : ${q.answers[0]}.`;
      detail = q.ex;
    } else if (q.kind === "date" && typed) {
      const gap = val == null || !Number.isFinite(val) ? Infinity : Math.abs(val - q.y);
      q.guess = Number.isFinite(val) ? val : null; q.gap = gap;
      ok = q.tol != null ? gap <= q.tol : gap === 0;
      const inp = $("#ty"); if (inp) inp.classList.add(ok ? "good" : "bad");
      info = val == null ? `Temps écoulé. C'était en ${q.y}.` : gap === 0 ? `Pile ${q.y} !` : `C'était en ${q.y} : tu as écrit ${val}, à ${gap} an${gap > 1 ? "s" : ""}.`;
      detail = q.ex;
    } else if (q.kind === "qcm") {
      ok = val === q.correct;
      play.querySelectorAll(".ans").forEach((b) => { if (b.dataset.v === q.correct) b.classList.add("good"); else if (b === btn) b.classList.add("bad"); });
      info = ok ? "" : `Bonne réponse : ${q.correct}.`;
      detail = q.ex;
    } else if (q.kind === "intrus") {
      ok = val != null && q.items[val].odd;
      play.querySelectorAll(".ans").forEach((b) => { const it = q.items[+b.dataset.k]; if (it.odd) b.classList.add("good"); else if (b === btn) b.classList.add("bad"); });
      info = ok ? "" : `L'intrus : ${q.items.find((x) => x.odd).t}.`;
      detail = q.ex;
    } else if (q.kind === "order") {
      const first = q.a.y < q.b.y ? 0 : 1;
      ok = val === first;
      play.querySelectorAll(".ans").forEach((b) => { const k = +b.dataset.k; b.innerHTML += `<br><span class="num" style="font-family:var(--display);font-size:22px">${[q.a, q.b][k].y}</span>`; if (k === first) b.classList.add("good"); else if (b === btn) b.classList.add("bad"); });
      info = `${q.a.e} : ${q.a.y}. ${q.b.e} : ${q.b.y}.`;
    } else if (q.kind === "date") {
      const gap = val == null ? Infinity : Math.abs(val - q.y);
      q.guess = val; q.gap = gap;
      ok = gap <= (q.tol ?? 2);
      $("#yv").textContent = q.y;
      info = val == null ? `Temps écoulé. C'était en ${q.y}.` : gap === 0 ? `Pile ${q.y} !` : `C'était en ${q.y} : tu as répondu ${val}, à ${gap} an${gap > 1 ? "s" : ""}.`;
      detail = q.ex;
    }
    markSeen(q.id);
    q.ok = ok;
    // Score
    let gain = 0;
    if (q.sd) G.sdGuesses.push(val == null ? null : val);
    else {
      G.answered++;
      if (ok) { G.correct++; G.combo++; gain = gainFor(q, left); G.me += gain; }
      else { G.combo = 0; if (G.hearts != null) G.hearts--; }
    }
    save();
    // Adversaire (ordi)
    let oppLine = "", verdict = null;
    if (G.bot && !q.sd) {
      const b = G.bot(q);
      if (b.ok) G.opp += b.pts;
      oppLine = `${G.opponent.name} : ${b.ok ? "bonne réponse" : "raté"}${b.mode ? ` (en ${b.mode})` : ""}${b.ok ? ` · +${b.pts}` : ""}`;
      if (G.mode === "ms") {
        if (ok !== b.ok) { G.msOver = ok ? "win" : "lose"; oppLine = ok ? "Le Maître s'est trompé : il tombe !" : "Le Maître a trouvé : tu tombes."; }
        else oppLine = ok ? "Le Maître a trouvé lui aussi : on continue." : "Le Maître s'est trompé lui aussi : vous restez en vie.";
      }
    }
    if (q.sd && G.bot) {
      const bg = Math.round(q.y + gauss() * 9), bgap = Math.abs(bg - q.y);
      oppLine = `${G.opponent.name} a répondu ${bg} (${bgap} an${bgap > 1 ? "s" : ""} d'écart).`;
      verdict = q.gap < bgap ? "win" : q.gap > bgap ? "lose" : null;
      G.sdResult = verdict;
    }
    const live = G.mode === "live";
    if (live) { G.emit({ i: G.i, ok, pts: gain, guess: q.kind === "date" ? val : null }); oppLine = "En attente de ton adversaire…"; }
    // Feuille de correction
    const cls = q.sd ? (verdict === "win" ? "ok" : verdict === "lose" ? "ko" : "neutral") : ok ? "ok" : "ko";
    const title = q.sd ? (verdict === "win" ? "Tu remportes la mort subite !" : verdict === "lose" ? "Perdu à la mort subite" : G.bot ? "Égalité parfaite : on continue" : "Réponse enregistrée")
      : ok ? (gain > 1 ? `Bravo ! +${fmt(gain)}${G.mode === "eclair" ? " pts" : ""}` : "Bravo !") : val == null ? "Temps écoulé" : "Raté";
    const sheet = document.createElement("div");
    sheet.className = `sheet ${cls}`;
    sheet.innerHTML = `<div class="wrap"><h3 id="sh-title">${ok || verdict === "win" ? ICON.check.replace("<svg", '<svg width="24" height="24"') : ""}${esc(title)}</h3>
      ${info ? `<p><strong>${esc(info)}</strong></p>` : ""}${detail ? `<p>${esc(detail)}</p>` : ""}
      ${oppLine ? `<p class="opp-line" id="opp-line">${esc(oppLine)}</p>` : ""}
      <button class="btn wide ${cls === "ko" ? "ghost" : ""}" id="cont">Continuer</button></div>`;
    play.appendChild(sheet);
    updateBoard();
    if (G.hearts != null) { const h = play.querySelector(".hearts .num"); if (h) h.textContent = G.hearts; }
    const combo = play.querySelector(".combo"); if (combo) { combo.textContent = `Combo ×${mult()}`; combo.classList.toggle("hot", G.combo >= 3); }
    const cont = $("#cont");
    cont.focus();
    cont.onclick = () => {
      clearTimeout(G.autoT);
      G.i++;
      if (G.msOver) return finish();
      if (q.sd && G.sdResult && (G.bot || live)) return finish();
      if (G.endless && !ok) return finish();
      next();
    };
    if (live) waitOpp(q, G.i);
  }
  function updateBoard() {
    if (!G || !G.opponent) return;
    const a = $("#sb-me"), b = $("#sb-opp");
    if (a) a.textContent = fmt(G.me);
    if (b && !G.opponent.hidden) b.textContent = fmt(G.opp);
  }

  // Duel en direct : on attend la réponse de l'adversaire avant d'enchaîner, pour rester ensemble.
  function waitOpp(q, i) {
    const cont = $("#cont");
    cont.disabled = true; cont.textContent = "En attente…";
    const ms = Math.max(1500, (q.timer || G.timer || 15) * 1000 - (performance.now() - G.qStart) + 3000);
    G.waiting = { q, i };
    G.waitT = setTimeout(() => resolveOpp(i), ms);
    if (G.oppAns[i]) resolveOpp(i);
  }
  function resolveOpp(i) {
    if (!G || !G.waiting || G.waiting.i !== i) return;
    const { q } = G.waiting;
    G.waiting = null; clearTimeout(G.waitT);
    const o = G.oppAns[i], name = G.opponent.name;
    let line;
    if (!q.sd) {
      if (o && o.ok) G.opp += Math.max(0, Math.min(175, Number(o.pts) || 0));
      line = !o ? `${name} n'a pas répondu à temps.` : o.ok ? `${name} : bonne réponse (+${fmt(Math.min(175, Number(o.pts) || 0))})` : `${name} : raté`;
      updateBoard();
    } else {
      const og = o && Number.isFinite(o.guess) ? Math.abs(o.guess - q.y) : Infinity;
      const verdict = q.gap < og ? "win" : q.gap > og ? "lose" : null;
      G.sdResult = verdict;
      line = o && Number.isFinite(o.guess) ? `${name} a répondu ${o.guess} (${og} an${og > 1 ? "s" : ""} d'écart).` : `${name} n'a pas répondu.`;
      const sheet = play.querySelector(".sheet"), t = $("#sh-title");
      if (sheet) sheet.className = `sheet ${verdict === "win" ? "ok" : verdict === "lose" ? "ko" : "neutral"}`;
      if (t) t.textContent = verdict === "win" ? "Tu remportes la mort subite !" : verdict === "lose" ? "Perdu à la mort subite" : "Égalité parfaite : on continue";
    }
    const ol = $("#opp-line"); if (ol) ol.textContent = line;
    const cont = $("#cont");
    if (cont) { cont.disabled = false; cont.textContent = "Continuer"; G.autoT = setTimeout(() => cont.isConnected && cont.click(), 2600); }
  }

  function finish() {
    clearInterval(timerId);
    if (!G) return;
    clearTimeout(G.waitT); clearTimeout(G.autoT);
    const wasLive = G.mode === "live";
    const r = G.onEnd ? G.onEnd(G) : null;
    if (wasLive) leaveLive();
    if (!r) return quit();
    play.innerHTML = `<div class="wrap"><div class="splash">
      <div class="ico" style="background:${r.bg || "var(--gold)"};color:${r.fg || "#2b1d00"}">${r.icon || ICON.star}</div>
      <p class="label">${esc(r.kicker || "Partie terminée")}</p>
      <h1 class="big">${esc(r.title)}</h1>
      ${r.text ? `<p class="rules">${r.text}</p>` : ""}
      ${r.stats ? `<div class="result-grid">${r.stats.map(([v, l]) => `<div class="stat"><b class="num">${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : ""}
      ${r.extra || ""}
      <div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn" id="done">${esc(r.cta || "Terminer")}</button>${r.cta ? `<button class="btn ghost" id="home">Accueil</button>` : ""}</div>
    </div></div>`;
    $("#done").onclick = () => { const after = r.after; quit(); if (after) after(); };
    const h = $("#home"); if (h) h.onclick = quit;
    if (r.mount) r.mount();
  }

  // ================= Modes =================
  // 1. Parcours façon Duolingo : 4 unités de 5 leçons, 3 vies par leçon, questions jamais vues en priorité.
  const UNITS = [["eco", "Économie", "Monnaies, banques, crises"], ["geo", "Géopolitique", "Alliances, détroits, puissances"], ["hist", "Histoire", "Dirigeants et tournants"], ["carte", "Géographie", "Capitales, fleuves, frontières"]];
  const LESSONS = 5;
  function lessonQs(th) {
    const ids = [...drawIds("qcm", 4, Math.random, { th }), ...drawIds("intrus", 1, Math.random, { th }), ...drawIds("date", 2, Math.random, { th })];
    if (ids.length < 7) ids.push(...drawIds("qcm", 7 - ids.length, Math.random, { th, exclude: new Set(ids) }));
    return shuffle(buildAll(ids));
  }
  function startLesson(th, n, label) {
    startGame({
      mode: "lesson", qs: lessonQs(th), hearts: 3,
      onEnd: (g) => {
        const passed = g.hearts > 0;
        const pts = g.correct * 10 + (passed ? 20 : 0);
        if (passed) S.lessons[`${th}-${n}`] = true;
        addPoints(pts);
        const stats = [[`${g.correct}/${g.answered}`, "bonnes réponses"], [`+${pts}`, "points"], [String(streakNow()), "jours de suite"]];
        return passed
          ? { kicker: label, title: "Leçon réussie !", stats }
          : { kicker: label, title: "Plus de vies…", text: "Lis bien les explications à chaque erreur, puis retente la leçon.", bg: "var(--red)", fg: "#2a0006", icon: ICON.heart, stats };
      },
    });
  }

  // 2. Quiz éclair : 10 questions jamais vues, 15 s chacune, combo ×2 dès 3 bonnes réponses de suite, ×3 dès 5.
  function startEclair() {
    const ids = [...drawIds("qcm", 5), ...drawIds("intrus", 1), ...drawIds("order", 2), ...drawIds("date", 2)];
    startGame({
      mode: "eclair", qs: shuffle(buildAll(ids)), timer: 15,
      onEnd: (g) => {
        addPoints(g.me);
        return { kicker: "Quiz éclair", title: `+${fmt(g.me)} points`, icon: ICON.bolt, text: "10 points par bonne réponse, ×2 dès 3 de suite, ×3 dès 5 de suite.", stats: [[`${g.correct}/10`, "bonnes réponses"], [fmt(S.points), "points au total"], [rankText(), "au classement"]], cta: "Rejouer", after: startEclair };
      },
    });
  }

  // 3. Défi du jour : 10 questions, les mêmes pour tout le monde, chrono de 20 s.
  function dailyQs(day = today()) {
    const r = rng(`defi-${day}`), o = { useSeen: false };
    const ids = [...drawIds("qcm", 4, r, o), ...drawIds("intrus", 2, r, o), ...drawIds("order", 2, r, o), ...drawIds("date", 2, r, o)];
    return shuffle(buildAll(ids, day), r);
  }
  function startDaily() {
    startGame({
      mode: "daily", qs: dailyQs(), timer: 20,
      onEnd: (g) => {
        S.daily = { date: today(), score: g.me, correct: g.correct };
        const pts = g.correct * 10 + 30;
        addPoints(pts);
        publishDaily();
        return { kicker: "Défi du jour", title: `${fmt(g.me)} points`, text: "Une réponse juste vaut 100 points, plus 5 points par seconde restante. Reviens demain pour un nouveau défi.", stats: [[`${g.correct}/10`, "bonnes réponses"], [`+${pts}`, "points gagnés"], [String(streakNow()), "jours de suite"]], cta: "Voir le classement", after: () => setTab("classement") };
      },
    });
  }

  // 4. Duel en trois manches (contre l'ordi ou un ami), puis mort subite sur les dates.
  function duelQs(seed, fresh) {
    const r = fresh ? Math.random : rng(`duel-${seed}`), o = { useSeen: !!fresh };
    const QS = [];
    QS.push({ kind: "splash", kicker: "Manche 1", title: "Duo ou carré", icon: '<b style="font:800 30px var(--display)">1</b>', bg: "var(--blue)", fg: "#021327", rules: "Quatre questions. Pour chacune, choisis avant de voir les réponses : <strong>duo</strong> (2 propositions, 1 point) ou <strong>carré</strong> (4 propositions, 2 points)." });
    QS.push(...buildAll(drawIds("qcm", 4, r, o), seed, { timer: 20 }));
    QS.push({ kind: "splash", kicker: "Manche 2", title: "L'intrus", icon: '<b style="font:800 30px var(--display)">2</b>', bg: "var(--gold)", fg: "#2b1d00", rules: "Six propositions, une seule ne colle pas avec les autres. Trouve-la : 2 points." });
    QS.push(...buildAll(drawIds("intrus", 2, r, o), seed, { timer: 25 }));
    QS.push({ kind: "splash", kicker: "Manche 3", title: "Avant ou après", icon: '<b style="font:800 30px var(--display)">3</b>', bg: "var(--mint)", fg: "#062317", rules: "Deux événements : lequel est arrivé en premier ? Trois questions, 8 secondes chacune, 1 point." });
    QS.push(...buildAll(drawIds("order", 3, r, o), seed, { timer: 8 }));
    const sd = buildAll(drawIds("date", 3, r, o), seed, { sd: true, timer: 25 });
    return { qs: QS, sd };
  }
  const sdSplash = (how) => ({ kind: "splash", sd: true, auto: how === "live" ? 3500 : 0, kicker: how === "friend" ? "Départage" : "Égalité !", title: "Mort subite", icon: ICON.skull, bg: "var(--red)", fg: "#2a0006", rules: how === "friend" ? "Trois dates à trouver. Elles ne comptent qu'en cas d'égalité avec ton adversaire : le plus proche de la bonne année l'emporte." : "Une date, deux réponses. Le plus proche de la bonne année gagne le duel. En cas d'égalité parfaite, on en tire une autre." });

  function startBotDuel() {
    const { qs } = duelQs(Math.random().toString(36).slice(2), true);
    const sd = buildAll(drawIds("date", 6), "", { sd: true, timer: 25 });
    startGame({
      mode: "bot", qs, duel: true, duoCarre: true,
      opponent: { name: "Le Maître", short: "M" },
      bot: (q) => {
        const behind = G.me - G.opp;
        const mode = q.kind === "qcm" ? (Math.random() < 0.5 ? "duo" : "carré") : null;
        let p = q.kind === "qcm" ? (mode === "duo" ? 0.82 : 0.62) : q.kind === "intrus" ? 0.6 : 0.68;
        p = Math.min(0.95, Math.max(0.2, p + behind * 0.07));
        return { ok: Math.random() < p, pts: q.kind === "qcm" ? (mode === "duo" ? 1 : 2) : q.kind === "intrus" ? 2 : 1, mode };
      },
      onRegularEnd: () => (G.me === G.opp ? [sdSplash("bot"), ...sd] : null),
      onEnd: (g) => {
        const win = g.sdResult ? g.sdResult === "win" : g.me > g.opp;
        const pts = g.correct * 10 + (win ? 40 : 10);
        S.played++; if (win) S.wins++;
        addPoints(pts);
        return {
          kicker: g.sdResult ? "Décidé à la mort subite" : "Fin du duel", title: win ? "Victoire !" : "Le Maître l'emporte",
          bg: win ? "var(--gold)" : "var(--blue)", fg: win ? "#2b1d00" : "#021327", icon: win ? ICON.star : ICON.swords,
          stats: [[`${g.me} – ${g.opp}`, "score"], [`+${pts}`, "points"], [`${S.wins}/${S.played}`, "duels gagnés"]],
          cta: "Rejouer", after: startBotDuel,
        };
      },
    });
  }

  // 5. Mort subite : 5 questions à écrire (une date ou un mot), de « ça va » à « dur », jamais les mêmes.
  // Dès que l'un tombe et pas l'autre, c'est fini. Si les deux tiennent, une date décisive : le plus proche gagne.
  // Un match toutes les 4 heures : le temps de préparer le match retour.
  const MS_COOLDOWN = 4 * 3600 * 1000;
  const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
  const LEVEL_NAMES = ["ça va", "facile", "moyen", "costaud", "dur"];
  function msIds() {
    const ids = [];
    for (let lv = 1; lv <= 5; lv++) ids.push(...drawIds("ms", 1, Math.random, { lv, exclude: new Set(ids) }));
    const years = POOL.ms.filter((x) => x.id[0] === "y" && !ids.includes(x.id) && !ids.includes("y" + x.id.slice(1)));
    const fresh = years.filter((x) => !seen.has(x.id));
    const decisive = (pick(fresh.length ? fresh : years, 1, Math.random)[0] || { id: "y0" }).id;
    return { ids, decisive };
  }
  const msSplash = (who) => ({ kind: "splash", kicker: `Mort subite · contre ${who}`, title: "Une seule vie", icon: ICON.skull, bg: "var(--red)", fg: "#2a0006", cta: "Je suis prêt",
    rules: "Cinq questions, de « ça va » à « dur ». Pas de propositions : tu écris la réponse, une date ou un mot. Dès que l'un de vous tombe et pas l'autre, c'est fini. Si vous tenez tous les deux, une date décisive départage : le plus proche gagne." });
  const decisiveSplash = () => ({ kind: "splash", sd: true, kicker: "Personne n'est tombé", title: "Date décisive", icon: ICON.skull, bg: "var(--gold)", fg: "#2b1d00", rules: "Écris l'année. Le plus proche de la bonne réponse remporte le match." });
  const msQs = (ids) => buildAll(ids, "", { timer: 30 });
  const msDecisive = (id) => Object.assign(build(id), { sd: true, typed: true, timer: 30, lv: null });
  const levelPts = (g) => g.qs.filter((q) => q.lv && q.ok && !q.sd).reduce((s, q) => s + 10 * q.lv, 0);
  const cooldownText = (ms) => { const m = Math.ceil(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${pad(m % 60)}` : `${m} min`; };

  function startMsBot() {
    if (Date.now() < (S.msBotNext || 0)) return;
    S.msBotNext = Date.now() + MS_COOLDOWN; save();
    const { ids, decisive } = msIds();
    const P = [0.92, 0.8, 0.64, 0.48, 0.32];
    startGame({
      mode: "ms", qs: [msSplash("le Maître"), ...msQs(ids)], duel: true,
      opponent: { name: "Le Maître", short: "M" },
      bot: (q) => ({ ok: Math.random() < P[(q.lv || 3) - 1], pts: 1 }),
      onRegularEnd: () => (!G.msOver ? [decisiveSplash(), msDecisive(decisive)] : null),
      onEnd: (g) => {
        const out = g.msOver || (g.sdResult || "draw");
        const pts = levelPts(g) + (out === "win" ? 60 : out === "draw" ? 25 : 10);
        S.played++; if (out === "win") S.wins++;
        addPoints(pts);
        const reached = g.qs.filter((q) => q.lv && q.done && !q.sd).length;
        return {
          kicker: g.msOver ? `Décidé à la question ${reached}` : "Décidé à la date décisive",
          title: out === "win" ? "Le Maître est tombé !" : out === "draw" ? "Égalité parfaite" : "Tu es tombé",
          icon: out === "win" ? ICON.star : ICON.skull, bg: out === "win" ? "var(--gold)" : "var(--red)", fg: out === "win" ? "#2b1d00" : "#2a0006",
          stats: [[`${reached}/5`, "questions jouées"], [`+${pts}`, "points"], [`${S.wins}/${S.played}`, "matchs gagnés"]],
          text: `Match retour contre le Maître dans 4 h.`,
          cta: "Retour aux défis", after: () => setTab("defis"),
        };
      },
    });
  }

  // Contre un ami : le créateur tire les questions et les range dans le match ; l'autre joue exactement les mêmes.
  async function createMsFriend(rematchOf) {
    if (!db || !me) return;
    const code = newCode();
    const { ids, decisive } = msIds();
    try { await db.collection("ms").doc(code).set({ code, ids, decisive, host: me, at: Date.now(), rematchOf: rematchOf || null }); } catch (e) { return; }
    playMsFriend(code, ids, decisive);
  }
  async function joinMsFriend(code, msg) {
    try {
      const mine = await db.collection("ms").doc(`${code}-${me}`).get();
      if (mine.exists) { msg.textContent = "Tu as déjà joué ce match : voici le résultat."; showMs(code); return; }
      const snap = await db.collection("ms").doc(code).get();
      if (!snap.exists) { msg.textContent = "Ce code ne correspond à aucun match."; return; }
      const d = snap.data();
      if (!validIds(d.ids) || d.ids.length !== 5 || typeof d.decisive !== "string" || !/^y[0-9]{1,3}$/.test(d.decisive)) { msg.textContent = "Ce match est illisible."; return; }
      playMsFriend(code, d.ids, d.decisive);
    } catch (e) { msg.textContent = "Impossible de rejoindre ce match pour le moment."; }
  }
  function playMsFriend(code, ids, decisive) {
    startGame({
      mode: "msf", qs: [msSplash("ton ami"), ...msQs(ids), decisiveSplash(), msDecisive(decisive)], duel: true,
      opponent: { name: "Ton ami", short: "?", hidden: true },
      onEnd: (g) => {
        const res = g.qs.filter((q) => q.lv && !q.sd).map((q) => !!q.ok);
        const dq = g.qs.find((q) => q.sd);
        const gap = dq && Number.isFinite(dq.gap) ? dq.gap : 9999;
        db.collection("ms").doc(`${code}-${me}`).set({ code, res, gap, at: Date.now() }).catch(() => {});
        if (!S.ms.includes(code)) S.ms.unshift(code);
        S.ms = S.ms.slice(0, 8);
        const pts = levelPts(g) + 20;
        addPoints(pts);
        return {
          kicker: `Mort subite · match ${code}`, title: `${res.filter(Boolean).length}/5 trouvées`, icon: ICON.skull, bg: "var(--red)", fg: "#2a0006",
          extra: `<div class="card" style="width:100%;max-width:420px;text-align:left" id="ms-res"><p class="muted">Recherche du résultat…</p></div>`,
          mount: () => watchMs(code, $("#ms-res")), text: `+${pts} points pour tes bonnes réponses. Le bonus de victoire arrive quand ton ami a joué.`,
          cta: "Retour aux défis", after: () => setTab("defis"),
        };
      },
    });
  }
  function msCompare(a, b) {
    for (let k = 0; k < 5; k++) { const x = !!(a.res || [])[k], y = !!(b.res || [])[k]; if (x !== y) return { out: x ? "win" : "lose", how: `Décidé à la question ${k + 1} (${LEVEL_NAMES[k]}).` }; }
    if (a.gap !== b.gap) return { out: a.gap < b.gap ? "win" : "lose", how: `Décidé à la date décisive : ${a.gap} an${a.gap > 1 ? "s" : ""} d'écart contre ${b.gap}.` };
    return { out: "draw", how: "Égalité parfaite, même à la date décisive." };
  }

  // ================= Partagé : points, classements, duels (db) =================
  let db = null, user = null, me = null, names = {}, players = [], dailyRows = [];
  async function initShared() {
    try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
    try { user = await window.claude?.use?.("user"); } catch (e) { user = null; }
    try { me = user ? await user.id() : null; } catch (e) { me = null; }
    if (db && me) {
      // Les points suivent le joueur d'un appareil à l'autre.
      try {
        const snap = await db.collection("joueurs").doc(me).get();
        const d = snap.exists ? snap.data() : null;
        if (d && Number(d.points) > S.points) { S.points = Number(d.points); S.wins = Math.max(S.wins, Number(d.wins) || 0); S.played = Math.max(S.played, Number(d.played) || 0); S.best = Math.max(S.best, Number(d.best) || 0); save(); }
      } catch (e) {}
      if (S.points > 0) syncPlayer();
    }
    if (db) {
      db.collection("joueurs").orderBy("points", "desc").limit(50).onSnapshot((snap) => {
        players = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter((p) => Number(p.points) > 0);
        resolveNames(players.slice(0, 30).map((p) => p.id)).then(refreshShared);
      }, () => {});
      db.collection("defi").where("date", "==", today()).onSnapshot((snap) => {
        dailyRows = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => b.score - a.score);
        resolveNames(dailyRows.map((r) => r.id)).then(refreshShared);
      }, () => {});
    }
    render();
    initRoom();
  }
  async function resolveNames(ids) {
    const todo = ids.filter((id) => id && !(id in names));
    if (!user || !todo.length) return;
    try { const ps = await user.profiles(todo); Object.entries(ps || {}).forEach(([id, p]) => { names[id] = (p && p.name) || ""; }); } catch (e) {}
  }
  const nameOf = (id) => (id === me ? "Toi" : names[id] || "Joueur");
  function refreshShared() {
    const c = $("#champion"); if (c) c.outerHTML = championHTML();
    applyStatus();
    if (tab === "classement" && !G) render();
  }
  function syncPlayer() {
    if (!db || !me) return;
    db.collection("joueurs").doc(me).set({ points: S.points, wins: S.wins, played: S.played, best: S.best, streak: streakNow(), at: Date.now() }).catch(() => {});
  }
  function rankText() { const k = players.findIndex((p) => p.id === me); return k >= 0 ? `${k + 1}ᵉ` : "–"; }
  function publishDaily() {
    if (!db || !me || !S.daily) return;
    db.collection("defi").doc(me).set({ date: S.daily.date, score: S.daily.score, correct: S.daily.correct, at: Date.now() }).catch(() => {});
  }
  // Résultat d'un match à distance, en direct dès que l'adversaire a joué, avec le match retour au bout de 4 h.
  let msUnsub = null;
  function watchMs(code, el) {
    if (msUnsub) { msUnsub(); msUnsub = null; }
    if (!db || !el) return;
    msUnsub = db.collection("ms").where("code", "==", code).onSnapshot(async (snap) => {
      const rows = snap.docs.filter((d) => d.id.includes("-")).map((d) => Object.assign({ uid: d.id.slice(code.length + 1) }, d.data()));
      await resolveNames(rows.map((r) => r.uid));
      if (!document.body.contains(el)) { msUnsub && msUnsub(); msUnsub = null; return; }
      const mine = rows.find((r) => r.uid === me), other = rows.find((r) => r.uid !== me);
      if (!mine) { el.innerHTML = `<p class="muted">Tu n'as pas encore joué ce match.</p>`; return; }
      if (!other) {
        el.innerHTML = `<p class="label">En attente de ton adversaire</p><p>Envoie-lui ce code : il l'entre dans « Défis » pour jouer les mêmes questions.</p><p class="code">${code}</p><button class="btn ghost" id="copy">Copier le code</button>`;
        const c = el.querySelector("#copy");
        c.onclick = () => { try { navigator.clipboard.writeText(code).then(() => (c.textContent = "Code copié"), () => (c.textContent = code)); } catch (e) { c.textContent = code; } };
        return;
      }
      const { out, how } = msCompare(mine, other);
      const key = `ms-bonus-${code}`;
      if (!S[key]) { S[key] = 1; addPoints(out === "win" ? 60 : out === "draw" ? 25 : 0); if (out === "win") S.wins++; S.played++; save(); }
      const oname = names[other.uid] || "Ton adversaire";
      const wait = Math.max(mine.at || 0, other.at || 0) + MS_COOLDOWN - Date.now();
      el.innerHTML = `<p class="label">${out === "win" ? "Victoire · +60 points" : out === "lose" ? "Défaite" : "Match nul · +25 points"}</p>
        <h3 style="font-size:24px;margin:6px 0">Toi contre ${esc(oname)}</h3>
        <p class="muted">${esc(how)}</p>
        <div class="ms-grid">${[0, 1, 2, 3, 4].map((k) => `<span class="${(mine.res || [])[k] ? "ok" : "ko"}">${k + 1}</span>`).join("")}<b>Toi</b>${[0, 1, 2, 3, 4].map((k) => `<span class="${(other.res || [])[k] ? "ok" : "ko"}">${k + 1}</span>`).join("")}<b>${esc(oname)}</b></div>
        ${wait > 0 ? `<p class="note">Match retour possible dans ${cooldownText(wait)}.</p>` : `<button class="btn" id="rematch">Lancer le match retour</button>`}`;
      const rm = el.querySelector("#rematch"); if (rm) rm.onclick = () => createMsFriend(code);
    }, () => { el.innerHTML = `<p class="muted">Résultat indisponible pour le moment.</p>`; });
  }

  // ================= Duel en direct (room) =================
  // Salle commune : chaque joueur affiche « en attente » ; les joueurs en attente sont appariés deux par deux,
  // puis rejoignent une salle à eux. L'hôte tire 10 questions qu'aucun des deux n'a encore vues et les envoie.
  let room = null, L = null;
  async function initRoom() {
    try { room = await window.claude?.use?.("room"); } catch (e) { room = null; }
    if (!room) return;
    room.presence({ mode: "idle" }).catch(() => {});
    room.onPeers(() => lobbyTick(), () => { room = null; L = null; if (tab === "defis" && !G) render(); });
    if (tab === "defis" && !G) render();
  }
  const lobbyPeers = () => (room ? room.peers().filter((p) => p.kind === "viewer" && (p.sameTab || !p.isMe)) : []);
  function lobbyText() {
    const ps = lobbyPeers();
    const w = ps.filter((p) => !p.sameTab && p.presence && p.presence.mode === "wait").length;
    const n = Math.max(1, ps.length);
    return `${n} joueur${n > 1 ? "s" : ""} en ligne${w ? ` · ${w} cherche${w > 1 ? "nt" : ""} un adversaire` : ""}`;
  }
  function lobbyTick() {
    const el = $("#live-status"); if (el) el.textContent = lobbyText();
    if (!L || L.state !== "wait") return;
    const waiting = lobbyPeers().filter((p) => p.presence && p.presence.mode === "wait").sort((a, b) => (a.peer < b.peer ? -1 : 1));
    const k = waiting.findIndex((p) => p.sameTab);
    if (k < 0) return;
    const partner = k % 2 === 0 ? waiting[k + 1] : waiting[k - 1];
    if (partner) joinMatch(partner, waiting[k].peer);
  }
  function findMatch() { if (!room) return; L = { state: "wait" }; room.presence({ mode: "wait" }).catch(() => {}); render(); lobbyTick(); }
  function cancelMatch() { leaveLive(); render(); }
  function setLiveMsg(t) { const el = $("#live-wait"); if (el) el.textContent = t; }
  async function joinMatch(partner, mine) {
    L.state = "join"; L.partner = partner; L.host = mine < partner.peer; L.oppAns = {};
    const name = ("d-" + [mine, partner.peer].sort().join("-").toLowerCase().replace(/[^a-z0-9-]/g, "")).slice(0, 48);
    room.presence({ mode: "play" }).catch(() => {});
    setLiveMsg("Adversaire trouvé, connexion…");
    let nr;
    try { nr = await room.join(name); } catch (e) { if (L) { L.state = "wait"; room.presence({ mode: "wait" }).catch(() => {}); } return; }
    if (!L) { nr.leave().catch(() => {}); return; }
    L.nr = nr;
    nr.presence({ uid: me || "", seen: S.seen.slice(-80) }).catch(() => {});
    L.offs = [
      nr.on("start", (m) => { if (!m.sameTab && L && !L.host && !L.started) beginLive(m.data); }),
      nr.on("ans", (m) => { if (!m.sameTab) onOppAnswer(m.data); }),
      nr.onPeers(() => liveTick()),
    ];
    L.giveUp = setTimeout(() => { if (L && !L.started) { leaveLive(); findMatch(); } }, 10000);
    liveTick();
  }
  function liveTick() {
    if (!L || !L.nr) return;
    const opp = L.nr.peers().find((p) => p.peer === L.partner.peer);
    if (L.started) {
      if (!opp && !L.goneT) L.goneT = setTimeout(() => { if (L && L.started && !L.nr.peers().some((p) => p.peer === L.partner.peer)) forfeit(); }, 4000);
      if (opp && L.goneT) { clearTimeout(L.goneT); L.goneT = null; }
      return;
    }
    if (L.host && opp && !L.startT) L.startT = setTimeout(hostStart, 800);
  }
  function hostStart() {
    if (!L || L.started || !L.nr) return;
    const opp = L.nr.peers().find((p) => p.peer === L.partner.peer);
    const theirs = opp && opp.presence && Array.isArray(opp.presence.seen) ? opp.presence.seen.filter((x) => typeof x === "string") : [];
    const ex = new Set(theirs);
    const ids = shuffle([...drawIds("qcm", 4, Math.random, { exclude: ex }), ...drawIds("intrus", 2, Math.random, { exclude: ex }), ...drawIds("order", 2, Math.random, { exclude: ex }), ...drawIds("date", 2, Math.random, { exclude: ex })]);
    const sd = drawIds("date", 3, Math.random, { exclude: new Set([...ex, ...ids]) });
    const data = { ids, sd, seed: Math.random().toString(36).slice(2, 8) };
    L.nr.emit("start", data).catch(() => {});
    beginLive(data);
  }
  const validIds = (a) => Array.isArray(a) && a.length <= 12 && a.every((x) => typeof x === "string" && /^[ckKmMdioqy][0-9_]{1,9}$/.test(x));
  function beginLive(data) {
    if (!L || !data || !validIds(data.ids) || !validIds(data.sd) || typeof data.seed !== "string") return;
    L.started = true; L.state = "play"; clearTimeout(L.giveUp);
    const seed = data.seed.slice(0, 12);
    const qs = buildAll(data.ids, seed, { timer: 15 });
    const sd = buildAll(data.sd, seed, { sd: true, timer: 20 });
    const by = L.partner.by;
    startGame({
      mode: "live", qs, timer: 15, duel: true, oppAns: L.oppAns,
      opponent: { name: (by && names[by]) || "Adversaire", short: "A" },
      emit: (d) => { if (L && L.nr) L.nr.emit("ans", d).catch(() => {}); },
      onRegularEnd: () => (G.me === G.opp ? [sdSplash("live"), ...sd] : null),
      onEnd: (g) => {
        const draw = !g.forfeit && !g.sdResult && g.me === g.opp;
        const win = !draw && (g.forfeit || (g.sdResult ? g.sdResult === "win" : g.me > g.opp));
        const pts = g.correct * 10 + (draw ? 25 : win ? 50 : 10);
        S.played++; if (win) S.wins++;
        addPoints(pts);
        return {
          kicker: g.forfeit ? "Ton adversaire a quitté la partie" : g.sdResult ? "Décidé à la mort subite" : "Duel en direct",
          title: draw ? "Match nul" : win ? "Victoire !" : "Défaite", icon: win ? ICON.star : ICON.live,
          bg: win ? "var(--gold)" : "var(--blue)", fg: win ? "#2b1d00" : "#021327",
          stats: [[`${fmt(g.me)} – ${fmt(g.opp)}`, "score"], [`+${pts}`, "points"], [`${S.wins}/${S.played}`, "duels gagnés"]],
          cta: "Rejouer en direct", after: () => { setTab("defis"); findMatch(); },
        };
      },
    });
    if (by) resolveNames([by]).then(() => {
      if (G && G.mode === "live" && names[by]) { G.opponent.name = names[by]; G.opponent.short = names[by].charAt(0).toUpperCase(); const n = $("#sb-name"); if (n) n.textContent = names[by]; }
    });
  }
  function onOppAnswer(d) {
    if (!L || !d || !Number.isInteger(d.i) || d.i < 0 || d.i > 40) return;
    L.oppAns[d.i] = { ok: !!d.ok, pts: Number(d.pts) || 0, guess: Number.isFinite(d.guess) ? Math.round(d.guess) : null };
    if (G && G.mode === "live" && G.waiting && G.waiting.i === d.i) resolveOpp(d.i);
  }
  function forfeit() { if (G && G.mode === "live") { G.forfeit = true; finish(); } }
  function leaveLive() {
    if (!L) return;
    clearTimeout(L.giveUp); clearTimeout(L.startT); clearTimeout(L.goneT);
    (L.offs || []).forEach((f) => { try { f(); } catch (e) {} });
    if (L.nr) L.nr.leave().catch(() => {});
    L = null;
    if (room) room.presence({ mode: "idle" }).catch(() => {});
  }

  // ================= Écrans =================
  let tab = "parcours";
  function setTab(t) { tab = t; render(); window.scrollTo(0, 0); }
  document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

  // Grades : le 1er est « Maître du savoir », le top 5 « Élite du savoir » (logo et bordure dorés), puis selon les points.
  const GRADES = [[3000, "Savant"], [1000, "Érudit"], [300, "Initié"], [0, "Curieux"]];
  const rankOf = (id) => players.findIndex((p) => p.id === id);
  function gradeOf(rank, pts) {
    if (rank === 0) return "Maître du savoir";
    if (rank > 0 && rank < 5) return "Élite du savoir";
    return (GRADES.find(([m]) => pts >= m) || GRADES[GRADES.length - 1])[1];
  }
  let preview = "";
  function applyStatus() {
    const r = preview === "master" ? 0 : preview === "elite" ? 2 : preview === "normal" ? -1 : rankOf(me);
    document.body.classList.toggle("elite", r >= 0 && r < 5);
    document.body.classList.toggle("master", r === 0);
    const chip = $("#grade-chip");
    if (chip) { chip.textContent = r === 0 ? "Maître" : r > 0 && r < 5 ? `Top ${r + 1}` : ""; chip.hidden = !(r >= 0 && r < 5); }
  }
  function championHTML() {
    if (!db) return `<div id="champion"></div>`;
    const top = players[0];
    return `<section class="champion" id="champion">
      <span class="crown">${ICON.crown}</span>
      <div class="ch-main"><span class="label">Maître du savoir</span><b>${top ? esc(nameOf(top.id)) : "La place est libre"}</b>${top ? "" : `<small>Gagne des points et prends la tête.</small>`}</div>
      ${top ? `<span class="ch-pts num">${fmt(top.points)}<small>pts</small></span>` : ""}
    </section>`;
  }
  function msToMidnight() { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); const s = Math.floor((m - n) / 1000); return `${Math.floor(s / 3600)} h ${pad(Math.floor((s % 3600) / 60))}`; }
  function dailyCard() {
    const done = S.daily && S.daily.date === today();
    return `<section class="card daily">
      <p class="label" style="color:var(--mint)">Défi du jour · ${new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}</p>
      <h2>${done ? `Fait : ${fmt(S.daily.score)} points` : "10 questions, les mêmes pour tout le monde"}</h2>
      <div class="meta"><span class="reward">${done ? "Points gagnés" : "Jusqu'à +130 pts"}</span><span>20 s par question</span><span>Prochain défi dans ${msToMidnight()}</span></div>
      ${done ? `<button class="btn ghost" data-go="classement">Voir le classement</button>` : `<button class="btn" id="daily-go">Jouer le défi</button>`}
    </section>`;
  }
  function eclairCard() {
    return `<section class="card mode">
      <div class="mode-ico" style="background:#3a2a10;color:var(--gold)">${ICON.bolt}</div>
      <div><h3>Quiz éclair</h3><p>10 questions que tu n'as jamais vues, 15 secondes chacune. Enchaîne les bonnes réponses : ×2 dès 3 de suite, ×3 dès 5.</p>
      <div class="btns"><button class="btn gold" id="eclair-go">Gagner des points</button></div></div>
    </section>`;
  }

  function viewParcours() {
    let firstOpen = null;
    const units = UNITS.map(([th, name, sub], u) => {
      const nodes = Array.from({ length: LESSONS }, (_, n) => {
        const done = !!S.lessons[`${th}-${n}`];
        const prevDone = n === 0 || !!S.lessons[`${th}-${n - 1}`];
        const state = done ? "done" : prevDone ? "current" : "locked";
        if (state === "current" && !firstOpen) firstOpen = `${th}-${n}`;
        const x = Math.round(Math.sin((n + u) * 1.3) * 70);
        return `<div style="transform:translateX(${x}px);display:grid;justify-items:center">
          ${state === "current" && firstOpen === `${th}-${n}` ? `<span class="bubble">Commencer</span>` : ""}
          <button class="node ${state}" data-lesson="${th}-${n}" aria-label="${name}, leçon ${n + 1}${state === "locked" ? " (verrouillée)" : ""}">${state === "done" ? ICON.check : state === "locked" ? ICON.lock : n + 1}</button></div>`;
      }).join("");
      const count = Array.from({ length: LESSONS }, (_, n) => S.lessons[`${th}-${n}`]).filter(Boolean).length;
      return `<section class="unit u-${th}"><div class="unit-head"><div><h3>Unité ${u + 1} · ${name}</h3><p>${sub}</p></div><span class="num" style="font-weight:800">${count}/${LESSONS}</span></div><div class="path">${nodes}</div></section>`;
    }).join("");
    return `<div class="stack">${dailyCard()}${eclairCard()}</div>${units}`;
  }

  function liveCard() {
    if (!room) return `<section class="card mode live-card">
      <div class="mode-ico" style="background:#10291c;color:var(--mint)">${ICON.live}</div>
      <div><h3>Duel en direct</h3><p>Affronte un autre joueur connecté en même temps que toi, sur 10 questions qu'aucun de vous deux n'a vues.</p>
      <p class="note">Le duel en direct a besoin du mode partagé : ouvre cette page sur claude.ai, connecté.</p></div></section>`;
    const waiting = L && (L.state === "wait" || L.state === "join");
    return `<section class="card mode live-card">
      <div class="mode-ico" style="background:#10291c;color:var(--mint)">${ICON.live}</div>
      <div><h3>Duel en direct <span class="live-badge"><span class="live-dot"></span>Live</span></h3>
      <p>Affronte un autre joueur connecté en même temps que toi, sur 10 questions qu'aucun de vous deux n'a vues. 15 s par question : le plus rapide marque le plus. Égalité ? Mort subite.</p>
      <p class="note" id="live-status">${lobbyText()}</p>
      ${waiting ? `<div class="searching"><span class="spinner" aria-hidden="true"></span><span id="live-wait">${L.state === "join" ? "Adversaire trouvé, connexion…" : "Recherche d'un adversaire…"}</span></div><button class="btn ghost" id="live-cancel">Annuler</button>`
        : `<div class="btns"><button class="btn" id="live-go">Trouver un adversaire</button></div>`}
      <p class="note" style="margin-top:10px">Personne en ligne ? Partage la page à un ami, ou joue contre le Maître en attendant.</p></div>
    </section>`;
  }

  function msCard() {
    const shared = !!(db && me);
    const wait = (S.msBotNext || 0) - Date.now();
    return `<section class="card mode ms-card">
      <div class="mode-ico" style="background:#3a141b;color:var(--red)">${ICON.skull}</div>
      <div>
        <h3>Mort subite</h3>
        <p>Cinq questions à écrire, une date ou un mot, de « ça va » à « dur ». Jamais les mêmes. Dès que l'un tombe et pas l'autre, c'est fini. Un match toutes les 4 heures : prépare ton match retour.</p>
        <div class="levels big" aria-hidden="true">${LEVEL_NAMES.map((n) => `<span>${n}</span>`).join("")}</div>
        <div class="btns">
          ${wait > 0 ? `<span class="cooldown">Match contre le Maître dans ${cooldownText(wait)}</span>` : `<button class="btn" id="msbot-go" style="background:var(--red);color:#2a0006;box-shadow:0 4px 0 var(--red-deep)">Contre le Maître</button>`}
          ${shared ? `<button class="btn ghost" id="msf-go">Défier un ami</button>` : ""}
        </div>
        ${shared ? `<div class="join"><input id="code-in" maxlength="5" placeholder="CODE" autocomplete="off" aria-label="Code de match reçu"><button class="btn ghost" id="join-go">Rejoindre</button></div>
        <p class="note" id="join-msg"></p>
        ${S.ms.length ? `<p class="label" style="margin-top:16px">Mes matchs</p><div class="duel-list">${S.ms.map((c) => `<button class="duel-item" data-ms="${c}"><b>${c}</b><span class="muted">Résultat et match retour ›</span></button>`).join("")}</div><div id="ms-view" style="margin-top:12px"></div>` : ""}`
        : `<p class="note">Le match contre un ami a besoin du mode partagé : ouvre cette page sur claude.ai, connecté.</p>`}
      </div>
    </section>`;
  }

  function viewDefis() {
    return `<div class="stack">
      ${dailyCard()}
      ${msCard()}
      ${liveCard()}
      ${eclairCard()}
      <section class="card mode">
        <div class="mode-ico" style="background:#16243d;color:var(--blue)">${ICON.swords}</div>
        <div>
          <h3>Duel en trois manches</h3>
          <p>Duo ou carré, l'intrus, avant ou après. En cas d'égalité, une date à écrire, sans indice : le plus proche gagne.</p>
          <div class="btns"><button class="btn blue" id="bot-go">Contre le Maître</button></div>
        </div>
      </section>
    </div>`;
  }

  function viewClassement() {
    let general;
    if (!db) general = `<p class="muted">Le classement partagé s'affiche quand la page est ouverte sur claude.ai, connecté.</p>`;
    else if (!players.length) general = `<p class="muted">Personne n'a encore de points. Joue une leçon, un quiz éclair ou un duel : tu apparaîtras ici pour tous les joueurs.</p>`;
    else {
      const podium = players.slice(0, 3);
      const order = [1, 0, 2].filter((k) => podium[k]);
      general = `<div class="podium">${order.map((k) => `<div class="pod p${k + 1}"><span class="avatar ${podium[k].id === me ? "you" : "opp"}">${esc(nameOf(podium[k].id).charAt(0).toUpperCase())}</span><b>${esc(nameOf(podium[k].id))}</b><em class="gchip">${k === 0 ? "Maître du savoir" : "Élite"}</em><span class="num">${fmt(podium[k].points)} pts</span><div class="step">${k + 1}</div></div>`).join("")}</div>
        ${players.length > 3 ? `<ol class="rank" start="4">${players.slice(3, 30).map((p, k) => `<li class="${p.id === me ? "me" : ""}"><span class="pos num">${k + 4}</span><span>${esc(nameOf(p.id))} ${k + 3 < 5 ? '<em class="gchip">Élite</em>' : `<em class="gchip plain">${gradeOf(k + 3, p.points)}</em>`}</span><span class="num" style="font-weight:800">${fmt(p.points)}</span></li>`).join("")}</ol>` : ""}`;
    }
    let daily;
    if (!db) daily = "";
    else if (!dailyRows.length) daily = `<p class="muted">Personne n'a encore joué le défi d'aujourd'hui.</p>`;
    else daily = `<ol class="rank">${dailyRows.slice(0, 20).map((r, k) => `<li class="${r.id === me ? "me" : ""}"><span class="pos num">${k + 1}</span><span>${esc(nameOf(r.id))}</span><span class="num" style="font-weight:800">${fmt(r.score)}</span></li>`).join("")}</ol>`;
    return `<div class="stack">
      <section class="card"><p class="label">Tous les joueurs</p><h2 style="font-size:26px;margin-top:4px">Classement général</h2>${general}</section>
      ${db ? `<section class="card"><p class="label">Défi du ${new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}</p><h2 style="font-size:26px;margin-top:4px">Classement du jour</h2>${daily}</section>` : ""}
      <section class="card"><p class="label">Récompenses</p><h2 style="font-size:26px;margin-top:4px">Les grades</h2>
        <ul class="grades">
          <li><span class="g-ico master-ico">${ICON.crown}</span><div><b>1ᵉʳ · Maître du savoir</b><span>Couronne sur le logo, bordure dorée animée, ton nom en tête pour tous.</span></div></li>
          <li><span class="g-ico elite-ico">${ICON.star}</span><div><b>Top 5 · Élite du savoir</b><span>Le logo de l'appli passe en or, avec une bordure dorée autour de l'appli.</span></div></li>
          <li><span class="g-ico">${ICON.bolt}</span><div><b>Selon tes points</b><span>Curieux, Initié (300), Érudit (1 000), Savant (3 000).</span></div></li>
        </ul>
        <p class="label" style="margin-top:14px">Aperçu</p>
        <div class="seg">${[["normal", "Normal"], ["elite", "Top 5"], ["master", "1ᵉʳ"]].map(([k, l]) => `<button data-preview="${k}" aria-pressed="${(preview || "normal") === k}">${l}</button>`).join("")}</div>
      </section>
      <section class="card"><p class="label">Tes chiffres · ${esc(gradeOf(rankOf(me), S.points))}</p>
        <div class="stats" style="margin-top:12px">
          <div class="stat"><b class="num">${fmt(S.points)}</b><span>points</span></div>
          <div class="stat"><b class="num">${streakNow()}</b><span>jours de suite</span></div>
          <div class="stat"><b class="num">${S.wins}/${S.played}</b><span>duels gagnés</span></div>
          <div class="stat"><b class="num">${fmt(seen.size)}</b><span>questions vues</span></div>
          <div class="stat"><b class="num">${S.ms.length}</b><span>matchs à distance</span></div>
          <div class="stat"><b class="num">${fmt(BANK + ORDER_PAIRS)}</b><span>questions possibles</span></div>
        </div>
        <p class="note" style="margin-top:12px">Comment gagner des points : 10 par bonne réponse en leçon (+20 si réussie), quiz éclair avec combo, défi du jour (+30), duel gagné (+40 contre le Maître, +50 en direct), mort subite (10 × le niveau de chaque question trouvée, +60 si tu gagnes).</p></section>
    </div>`;
  }

  function render() {
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    const v = $("#view");
    v.innerHTML = championHTML() + (tab === "parcours" ? viewParcours() : tab === "defis" ? viewDefis() : viewClassement());
    renderCounters();
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    on("#daily-go", startDaily);
    on("#eclair-go", startEclair);
    on("#bot-go", startBotDuel);
    on("#msbot-go", startMsBot);
    on("#msf-go", () => createMsFriend(null));
    on("#live-go", findMatch);
    on("#live-cancel", cancelMatch);
    v.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => setTab(b.dataset.go)));
    v.querySelectorAll("[data-preview]").forEach((b) => (b.onclick = () => { preview = b.dataset.preview === "normal" ? "normal" : b.dataset.preview; render(); }));
    v.querySelectorAll("[data-lesson]").forEach((b) => (b.onclick = () => {
      if (b.classList.contains("locked")) return;
      const [th, n] = b.dataset.lesson.split("-");
      startLesson(th, +n, `${THEME[th]} · leçon ${+n + 1}`);
    }));
    on("#join-go", () => {
      const code = $("#code-in").value.trim().toUpperCase();
      const msg = $("#join-msg");
      if (!/^[A-Z0-9]{5}$/.test(code)) { msg.textContent = "Le code fait 5 caractères, par exemple K7RMX."; return; }
      joinMsFriend(code, msg);
    });
    v.querySelectorAll("[data-ms]").forEach((b) => (b.onclick = () => showMs(b.dataset.ms)));
    applyStatus();
  }
  function showMs(code) { const box = $("#ms-view") || $("#join-msg"); if (!box) return; box.innerHTML = `<div class="card" style="background:var(--panel-2)"><p class="muted">Chargement…</p></div>`; watchMs(code, box.firstElementChild); }

  document.addEventListener("keydown", (e) => {
    if (!G || play.hidden) return;
    const c = $("#cont");
    if (c && !c.disabled && e.key === "Enter") { e.preventDefault(); c.click(); }
  });

  render();
  initShared();
})();
</script>
