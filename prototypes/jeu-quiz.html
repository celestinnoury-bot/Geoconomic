<meta charset="utf-8">
<title>Géoconomic Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Plateau de jeu télévisé, version poche : une colonne, des gros boutons « en relief », un bandeau de score en haut.
   Un seul monde visuel, sombre, assumé (comme l'appli Géoconomic). */
:root {
  --bg: #0a0d14;
  --panel: #131826;
  --panel-2: #1b2133;
  --line: rgba(196, 210, 255, .12);
  --text: #eef1f8;
  --muted: #8d96ab;
  --mint: #3ddc97;
  --mint-deep: #1f9e68;
  --gold: #f5c86b;
  --red: #ff5f6d;
  --red-deep: #b8323f;
  --blue: #5aa9ff;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--body); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* En-tête : marque + compteurs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.brand b { color: var(--mint); }
.counters { display: flex; gap: 14px; font-weight: 700; }
.counter { display: flex; align-items: center; gap: 5px; }
.counter svg { width: 20px; height: 20px; }

main { padding-block: 20px 110px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { background: none; border: 0; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--mint); }

/* Boutons « en relief » */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 800; font-size: 16px; letter-spacing: .02em; cursor: pointer; background: var(--mint); color: #062317; box-shadow: 0 4px 0 var(--mint-deep); transition: transform .08s, box-shadow .08s; text-transform: uppercase; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mint-deep); }
.btn.ghost { background: var(--panel-2); color: var(--text); box-shadow: 0 4px 0 #0b0f19; }
.btn.gold { background: var(--gold); color: #2b1d00; box-shadow: 0 4px 0 #b88d33; }
.btn.blue { background: var(--blue); color: #021327; box-shadow: 0 4px 0 #2d6fbf; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
.stack { display: grid; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.muted { color: var(--muted); }

/* Bandeau du défi du jour */
.daily { position: relative; overflow: hidden; background: linear-gradient(135deg, #1a2a22 0%, #131826 60%); border-color: rgba(61, 220, 151, .35); }
.daily h2 { font-size: 26px; margin: 6px 0 6px; }
.daily .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.daily::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 18px solid rgba(61, 220, 151, .08); }

/* Parcours */
.unit { margin-top: 28px; }
.unit-head { border-radius: 18px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.unit-head h3 { font-size: 20px; }
.unit-head p { margin: 2px 0 0; font-size: 14px; opacity: .85; }
.u-eco .unit-head { background: #3a2412; color: #ffd7b0; }
.u-geo .unit-head { background: #1d1f45; color: #cfd2ff; }
.u-hist .unit-head { background: #3a1a2b; color: #ffcde3; }
.u-carte .unit-head { background: #11303a; color: #b8f0ff; }
.path { display: grid; justify-items: center; gap: 18px; padding: 24px 0 8px; }
.node { width: 72px; height: 66px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; background: var(--panel-2); color: var(--muted); box-shadow: 0 6px 0 #0b0f19; position: relative; }
.node svg { width: 30px; height: 30px; }
.node.done { background: var(--gold); color: #2b1d00; box-shadow: 0 6px 0 #b88d33; }
.node.current { background: var(--mint); color: #062317; box-shadow: 0 6px 0 var(--mint-deep); }
.node.current::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid rgba(61, 220, 151, .45); animation: pulse 1.6s ease-in-out infinite; }
.node.locked { cursor: not-allowed; }
.node:active:not(.locked) { transform: translateY(4px); box-shadow: 0 2px 0 #0b0f19; }
.bubble { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mint); background: var(--panel); border: 2px solid var(--mint); padding: 5px 10px; border-radius: 10px; margin-bottom: -8px; }
@keyframes pulse { 50% { transform: scale(1.08); opacity: .4; } }

/* Défis */
.mode { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; }
.mode-ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; }
.mode-ico svg { width: 30px; height: 30px; }
.mode h3 { font-size: 20px; }
.mode p { margin: 4px 0 12px; color: var(--muted); font-size: 15px; }
.mode .btns { display: flex; flex-wrap: wrap; gap: 10px; }
.join { display: flex; gap: 8px; margin-top: 12px; }
.join input { flex: 1; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--text); font: 700 18px var(--display); letter-spacing: .2em; text-transform: uppercase; }
.duel-list { display: grid; gap: 8px; margin-top: 14px; }
.duel-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel-2); border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: left; }
.duel-item b { font-family: var(--display); letter-spacing: .12em; }

/* Classement */
.rank { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.rank li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); }
.rank li.me { outline: 2px solid var(--mint); }
.rank .pos { font-family: var(--display); font-weight: 800; color: var(--muted); }
.rank li:nth-child(1) .pos { color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-family: var(--display); font-size: 26px; }
.stat span { font-size: 13px; color: var(--muted); }

/* ---------- Écran de jeu ---------- */
#play { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.play-top { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
.x { background: none; border: 0; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.x svg { width: 22px; height: 22px; }
.bar { flex: 1; height: 14px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mint); border-radius: 99px; transition: width .4s; }
.hearts { display: flex; align-items: center; gap: 4px; font-weight: 800; color: var(--red); }
.hearts svg { width: 22px; height: 22px; }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; margin-bottom: 8px; }
.side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.side.right { justify-content: flex-end; text-align: right; }
.avatar { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
.avatar.you { background: var(--mint); color: #062317; }
.avatar.opp { background: var(--blue); color: #021327; }
.side .who { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .pts { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
.vs { font-family: var(--display); font-weight: 800; color: var(--muted); }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0 10px; }
.chip { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.chip.eco { color: #ffb37a; } .chip.geo { color: #a9adff; } .chip.hist { color: #ff9cc8; } .chip.carte { color: #7fe3ff; }
.timer { width: 46px; height: 46px; position: relative; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 5; }
.timer .bg { stroke: var(--panel-2); }
.timer .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.timer.low .fg { stroke: var(--red); }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
.question { font-size: clamp(24px, 6vw, 30px); line-height: 1.2; margin: 6px 0 22px; }
.answers { display: grid; gap: 12px; }
.ans { text-align: left; width: 100%; border: 2px solid var(--line); background: var(--panel); border-radius: 16px; padding: 16px 18px; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 0 #0b0f19; transition: transform .08s, box-shadow .08s, border-color .15s; }
.ans:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 #0b0f19; }
.ans.sel { border-color: var(--blue); background: #15233a; }
.ans.good { border-color: var(--mint); background: #12321f; color: #c6ffe3; }
.ans.bad { border-color: var(--red); background: #3a141b; color: #ffd1d6; }
.ans[disabled] { cursor: default; }
.grid2 { grid-template-columns: 1fr 1fr; }
.grid2 .ans { text-align: center; }
.order-card { text-align: center; min-height: 120px; display: grid; place-items: center; }

/* Duo ou carré */
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.choice button { border: 0; border-radius: 20px; padding: 22px 12px; cursor: pointer; display: grid; gap: 6px; justify-items: center; }
.choice .duo { background: #1d2c4a; box-shadow: 0 5px 0 #0f1a2e; }
.choice .carre { background: #3a2a10; box-shadow: 0 5px 0 #20170a; }
.choice b { font-family: var(--display); font-size: 26px; }
.choice span { font-size: 14px; color: var(--muted); }
.dots { display: grid; grid-template-columns: repeat(2, 12px); gap: 5px; }
.dots i { width: 12px; height: 12px; border-radius: 3px; background: currentColor; }

/* Année */
.year { text-align: center; }
.year-big { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 20vw, 96px); line-height: 1; letter-spacing: -.02em; color: var(--gold); }
.year input[type=range] { width: 100%; margin: 18px 0 10px; accent-color: var(--gold); height: 32px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.steps button { border: 0; background: var(--panel-2); border-radius: 12px; padding: 12px 0; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #0b0f19; }
.range-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* Intrus */
.intrus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.intrus .ans { font-size: 16px; text-align: center; padding: 14px 10px; }

/* Feuille de correction */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-top: 18px; animation: up .25s ease-out; }
.sheet.ok { background: #10291c; border-top: 2px solid var(--mint); }
.sheet.ko { background: #2c1117; border-top: 2px solid var(--red); }
.sheet.neutral { background: var(--panel); border-top: 2px solid var(--gold); }
.sheet h3 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
.sheet.ok h3 { color: var(--mint); } .sheet.ko h3 { color: var(--red); } .sheet.neutral h3 { color: var(--gold); }
.sheet p { margin: 6px 0 0; font-size: 15px; }
.sheet .opp-line { margin-top: 8px; font-size: 14px; color: var(--muted); }
.sheet .btn { margin-top: 14px; }
.spacer { height: 230px; }
@keyframes up { from { transform: translateY(100%); } }

/* Écrans d'annonce et de fin */
.splash { min-height: 70vh; display: grid; align-content: center; justify-items: center; text-align: center; gap: 14px; padding-block: 30px; }
.splash .big { font-size: clamp(36px, 10vw, 52px); line-height: 1.05; }
.splash .rules { color: var(--muted); max-width: 40ch; }
.splash .btn { min-width: 220px; }
.splash .ico { width: 84px; height: 84px; border-radius: 26px; display: grid; place-items: center; }
.splash .ico svg { width: 46px; height: 46px; }
.sd { color: var(--red); }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 420px; }
.code { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: .2em; color: var(--gold); }
.note { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .node.current::before, .sheet { animation: none; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Géoconomic <b>Duel</b></div>
    <div class="counters">
      <span class="counter" title="Série de jours" style="color:var(--gold)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1.2 3 2.3 3C11 8 11 5 12 2z"/></svg><span class="num" id="c-streak">0</span></span>
      <span class="counter" title="Points d'expérience" style="color:var(--mint)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg><span class="num" id="c-xp">0</span></span>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="parcours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="7" cy="19" r="2.5"/><path d="M8.3 7.2 15.8 11M15.9 13.3 9.2 17.8"/></svg>Parcours</button>
    <button class="tab" role="tab" data-tab="defis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 20 7-7M20 20l-7-7M14.5 4.5 20 4l-.5 5.5L13 16l-5-5 6.5-6.5zM9.5 4.5 4 4l.5 5.5"/></svg>Défis</button>

  </div>
</nav>

<div id="play" hidden></div>

<script>
(() => {
  // ================= Banque de questions =================
  // Thèmes : eco (économie), geo (géopolitique), hist (histoire), carte (géographie).
  // QCM : [thème, question, bonne réponse, faux 1, faux 2, faux 3, explication]
  const QCM = [
    ["eco", "Quelle institution fixe les taux directeurs de la zone euro ?", "La Banque centrale européenne", "Le FMI", "La Commission européenne", "La Banque de France", "La BCE, installée à Francfort, décide des taux pour tous les pays de l'euro. La Banque de France applique sa politique en France."],
    ["eco", "Que mesure le PIB ?", "La richesse produite en un an", "Le patrimoine total d'un pays", "Le total des exportations", "Le budget de l'État", "Le produit intérieur brut additionne la valeur de tout ce qui est produit dans un pays sur une période, en général un an."],
    ["eco", "L'inflation, c'est…", "La hausse générale et durable des prix", "La hausse des salaires", "La hausse de la Bourse", "La hausse des impôts", "Quand les prix montent partout et longtemps, chaque euro achète moins de choses : c'est l'inflation."],
    ["eco", "La stagflation, c'est…", "Une croissance faible avec une forte inflation", "Une baisse générale des prix", "Une Bourse qui stagne", "Une économie sans chômage", "Le mot mélange « stagnation » et « inflation ». Les années 1970, après les chocs pétroliers, en sont l'exemple type."],
    ["eco", "Quand une banque centrale monte ses taux, en général…", "Le crédit devient plus cher", "Les prix montent plus vite", "La monnaie perd de la valeur", "Les salaires augmentent", "Des taux plus hauts rendent l'emprunt plus coûteux : on achète et on investit moins, ce qui freine l'inflation."],
    ["eco", "Un déficit commercial, c'est quand un pays…", "Importe plus qu'il n'exporte", "Dépense plus qu'il ne perçoit d'impôts", "N'a plus de réserves d'or", "Exporte plus qu'il n'importe", "On parle de balance commerciale : achats à l'étranger (importations) contre ventes à l'étranger (exportations)."],
    ["eco", "Quelle est la monnaie du Japon ?", "Le yen", "Le yuan", "Le won", "Le baht", "Le yuan est chinois, le won coréen et le baht thaïlandais."],
    ["eco", "Quelle est la monnaie de l'Inde ?", "La roupie", "Le taka", "Le rand", "Le ringgit", "Le taka est la monnaie du Bangladesh, le rand celle de l'Afrique du Sud, le ringgit celle de la Malaisie."],
    ["eco", "Quelle est la monnaie du Brésil ?", "Le real", "Le peso", "Le sol", "Le bolivar", "Le real circule depuis 1994. Le sol est péruvien, le bolivar vénézuélien."],
    ["eco", "Quelle est la monnaie de l'Afrique du Sud ?", "Le rand", "Le naira", "Le shilling", "Le dirham", "Le naira est nigérian, le dirham marocain ou émirati, le shilling kényan ou ougandais."],
    ["eco", "Où siège la Banque centrale européenne ?", "Francfort", "Bruxelles", "Paris", "Luxembourg", "Francfort, en Allemagne, accueille la BCE depuis sa création en 1998."],
    ["eco", "Où siège le Fonds monétaire international ?", "Washington", "New York", "Genève", "Londres", "Le FMI et la Banque mondiale, nés à Bretton Woods en 1944, siègent tous deux à Washington."],
    ["eco", "Où siège l'Organisation mondiale du commerce ?", "Genève", "Washington", "Bruxelles", "Vienne", "L'OMC est installée à Genève, en Suisse, depuis sa création en 1995."],
    ["eco", "Où siège l'OPEP ?", "Vienne", "Riyad", "Dubaï", "Genève", "L'Organisation des pays exportateurs de pétrole a son siège à Vienne, en Autriche, depuis 1965."],
    ["eco", "Qui a parlé de la « main invisible » du marché ?", "Adam Smith", "John Maynard Keynes", "Karl Marx", "David Ricardo", "Adam Smith, économiste écossais du XVIIIe siècle, l'utilise dans « La Richesse des nations » (1776)."],
    ["eco", "Qui a théorisé les « avantages comparatifs » dans le commerce ?", "David Ricardo", "Adam Smith", "Milton Friedman", "Joseph Schumpeter", "Ricardo montre en 1817 que deux pays gagnent à échanger, même si l'un est meilleur partout."],
    ["eco", "Qui a popularisé l'idée de « destruction créatrice » ?", "Joseph Schumpeter", "Karl Marx", "Adam Smith", "Friedrich Hayek", "Pour Schumpeter, l'innovation détruit les anciennes activités pour en créer de nouvelles : c'est le moteur du capitalisme."],

    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4l-5.5 2.9 1-6.2L3 9.7l6.2-.9L12 3z"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',
    swords: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m4 20 7-7M20 20l-7-7M14.5 4.5 20 4l-.5 5.5L13 16l-5-5 6.5-6.5zM9.5 4.5 4 4l.5 5.5"/></svg>',
    skull: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a8 8 0 0 0-5 14.2V20h10v-2.8A8 8 0 0 0 12 3z"/><circle cx="9" cy="11" r="1.6" fill="currentColor"/><circle cx="15" cy="11" r="1.6" fill="currentColor"/><path d="M10 20v-2M14 20v-2"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  };

  // ================= Sauvegarde locale (série, XP, progression) =================
  const KEY = "geoduel-v1";
  let S = { xp: 0, streak: 0, lastDay: null, lessons: {}, daily: null, best: 0, duels: [], wins: 0, played: 0 };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  function touchStreak() {
    const t = today();
    if (S.lastDay === t) return;
    S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1;
    S.lastDay = t;
  }
  function addXp(n) { S.xp += n; touchStreak(); save(); renderCounters(); }
  function renderCounters() {
    $("#c-xp").textContent = S.xp;
    $("#c-streak").textContent = S.lastDay === today() || S.lastDay === yesterday() ? S.streak : 0;
  }

  // ================= Fabrique de questions =================
  function mkQcm(it, r) { const [th, q, c, w1, w2, w3, ex] = it; return { kind: "qcm", th, q, correct: c, wrong: [w1, w2, w3], ex, opts: shuffle([c, w1, w2, w3], r), duoWrong: [w1, w2, w3][Math.floor(r() * 3)] }; }
  function rangeFor(y) { return y >= 1900 ? [1900, 2026] : y >= 1750 ? [1750, 1950] : [1400, 1900]; }
  function mkDate(it) { const [th, e, y, ex] = it; const [min, max] = rangeFor(y); return { kind: "date", th, e, y, ex: ex || "", min, max }; }
  function mkOrder(r) {
    for (let k = 0; k < 50; k++) {
      const [a, b] = pick(DATES, 2, r);
      if (Math.abs(a[2] - b[2]) >= 3) return { kind: "order", th: a[0], a: mkDate(a), b: mkDate(b) };
    }
    return { kind: "order", th: "hist", a: mkDate(DATES[0]), b: mkDate(DATES[19]) };
  }
  function mkIntrus(it, r) { const [th, q, items, odd, ex] = it; const list = shuffle(items.map((t, i) => ({ t, odd: i === odd })), r); return { kind: "intrus", th, q, items: list, ex }; }
  const byTheme = (th) => ({ qcm: QCM.filter((x) => x[0] === th), dates: DATES.filter((x) => x[0] === th), intrus: INTRUS.filter((x) => x[0] === th) });

  // ================= Moteur de partie =================
  let G = null, timerId = null;
  const play = $("#play");

  function startGame(cfg) {
    G = Object.assign({ i: 0, me: 0, opp: 0, hearts: null, correct: 0, answered: 0, log: [], sdGuesses: [] }, cfg);
    play.hidden = false;
    document.body.style.overflow = "hidden";
    next();
  }
  function quit() { clearInterval(timerId); G = null; play.hidden = true; play.innerHTML = ""; document.body.style.overflow = ""; render(); }

  function next() {
    clearInterval(timerId);
    if (!G) return;
    if (G.hearts === 0) return finish();
    if (G.endless && G.i >= G.qs.length) G.qs.push(G.endless());
    if (G.i >= G.qs.length) {
      if (G.onRegularEnd && !G.sdStarted) { const more = G.onRegularEnd(); if (more && more.length) { G.sdStarted = true; G.qs.push(...more); return next(); } }
      return finish();
    }
    const q = G.qs[G.i];
    if (q.kind === "splash") return renderSplash(q);
    renderQ(q);
  }

  function header(q) {
    const prog = G.endless ? "" : `<div class="bar" aria-hidden="true"><i style="width:${Math.round((G.i / G.qs.length) * 100)}%"></i></div>`;
    const right = G.hearts != null ? `<span class="hearts" aria-label="${G.hearts} vies">${ICON.heart}<span class="num">${G.hearts}</span></span>` : G.endless ? `<span class="chip" style="color:var(--gold)">Série : ${G.correct}</span>` : "";
    const board = G.opponent ? `
      <div class="scoreboard">
        <div class="side"><span class="avatar you">Toi</span><div><div class="who">Toi</div><div class="pts num">${G.me}</div></div></div>
        <span class="vs">VS</span>
        <div class="side right"><div><div class="who">${esc(G.opponent.name)}</div><div class="pts num">${G.opponent.hidden ? "?" : G.opp}</div></div><span class="avatar opp">${esc(G.opponent.short)}</span></div>
      </div>` : "";
    return `<div class="wrap"><div class="play-top"><button class="x" id="quit" aria-label="Quitter la partie">${ICON.x}</button>${prog}${right}</div>${board}`;
  }
  function timerHTML(sec) { return sec ? `<div class="timer" id="timer"><svg viewBox="0 0 50 50"><circle class="bg" cx="25" cy="25" r="21"/><circle class="fg" cx="25" cy="25" r="21" stroke-dasharray="132" stroke-dashoffset="0"/></svg><span class="num">${sec}</span></div>` : ""; }
  function startTimer(sec, onEnd) {
    if (!sec) return;
    const t0 = performance.now();
    G.t0 = t0; G.sec = sec;
    timerId = setInterval(() => {
      const left = Math.max(0, sec - (performance.now() - t0) / 1000);
      const el = $("#timer"); if (!el) return;
      el.querySelector(".fg").setAttribute("stroke-dashoffset", String(132 * (1 - left / sec)));
      el.querySelector("span").textContent = Math.ceil(left);
      el.classList.toggle("low", left < 4);
      if (left <= 0) { clearInterval(timerId); onEnd(); }
    }, 100);
  }
  const timeLeft = () => (G.sec ? Math.max(0, G.sec - (performance.now() - G.t0) / 1000) : 0);
  function qhead(q, label) { return `<div class="qhead"><span class="chip ${q.th}">${label || THEME[q.th]}</span>${timerHTML(q.timer || G.timer)}</div>`; }

  function renderSplash(q) {
    play.innerHTML = `${header(q)}
      <div class="splash">
        <div class="ico" style="background:${q.bg || "var(--panel-2)"};color:${q.fg || "var(--text)"}">${q.icon || ICON.star}</div>
        <p class="label">${esc(q.kicker || "")}</p>
        <h1 class="big ${q.sd ? "sd" : ""}">${esc(q.title)}</h1>
        <p class="rules">${q.rules}</p>
        <button class="btn" id="go">${esc(q.cta || "C'est parti")}</button>
      </div></div>`;
    $("#quit").onclick = quit;
    $("#go").onclick = () => { G.i++; next(); };
  }

  function renderQ(q) {
    let body = "";
    if (q.kind === "qcm" && G.duoCarre && !q.mode) {
      body = `${qhead(q, "Duo ou carré ?")}
        <h2 class="question">${esc(q.q)}</h2>
        <p class="muted">Avant de voir les réponses, choisis : deux propositions pour 1 point, ou quatre pour 2 points.</p>
        <div class="choice">
          <button class="duo" data-mode="duo"><span class="dots" style="grid-template-columns:repeat(2,12px);color:var(--blue)"><i></i><i></i></span><b>Duo</b><span>2 réponses · 1 pt</span></button>
          <button class="carre" data-mode="carre"><span class="dots" style="color:var(--gold)"><i></i><i></i><i></i><i></i></span><b>Carré</b><span>4 réponses · 2 pts</span></button>
        </div>`;
      play.innerHTML = `${header(q)}${body}<div class="spacer"></div></div>`;
      $("#quit").onclick = quit;
      play.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { q.mode = b.dataset.mode; renderQ(q); });
      return;
    }
    if (q.kind === "qcm") {
      const opts = q.mode === "duo" ? shuffle([q.correct, q.duoWrong]) : q.opts;
      body = `${qhead(q, q.mode === "duo" ? "Duo · 1 pt" : q.mode === "carre" ? "Carré · 2 pts" : "")}<h2 class="question">${esc(q.q)}</h2>
        <div class="answers ${q.mode === "duo" ? "grid2" : ""}">${opts.map((o) => `<button class="ans" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    } else if (q.kind === "intrus") {
      body = `${qhead(q)}<h2 class="question">${esc(q.q)}</h2>
        <div class="intrus">${q.items.map((it, k) => `<button class="ans" data-k="${k}">${esc(it.t)}</button>`).join("")}</div>`;
    } else if (q.kind === "order") {
      body = `${qhead(q, "Avant ou après ?")}<h2 class="question">Lequel est arrivé en premier ?</h2>
        <div class="answers">${[q.a, q.b].map((d, k) => `<button class="ans order-card" data-k="${k}">${esc(d.e)}</button>`).join("")}</div>`;
    } else if (q.kind === "date") {
      const mid = Math.round((q.min + q.max) / 2);
      body = `${qhead(q, q.sd ? "Mort subite" : q.tol != null ? `À ${q.tol} an${q.tol > 1 ? "s" : ""} près` : "En quelle année ?")}
        <h2 class="question">${esc(q.e)}</h2>
        <div class="year">
          <div class="year-big num" id="yv">${mid}</div>
          <label class="label" for="yr">Glisse jusqu'à ton année</label>
          <input type="range" id="yr" min="${q.min}" max="${q.max}" value="${mid}">
          <div class="range-ends num"><span>${q.min}</span><span>${q.max}</span></div>
          <div class="steps"><button data-d="-10">−10</button><button data-d="-1">−1</button><button data-d="1">+1</button><button data-d="10">+10</button></div>
          <button class="btn wide" id="valider">Valider</button>
        </div>`;
    }
    play.innerHTML = `${header(q)}${body}<div class="spacer"></div></div>`;
    $("#quit").onclick = quit;
    G.qStart = performance.now();
    if (q.kind === "date") {
      const r = $("#yr"), v = $("#yv");
      const set = (y) => { r.value = Math.min(q.max, Math.max(q.min, y)); v.textContent = r.value; };
      r.oninput = () => set(+r.value);
      play.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => set(+r.value + +b.dataset.d));
      $("#valider").onclick = () => answer(q, +r.value);
    } else {
      play.querySelectorAll(".ans").forEach((b) => b.onclick = () => answer(q, b.dataset.v ?? +b.dataset.k, b));
    }
    startTimer(q.timer || G.timer, () => answer(q, null));
  }

  function ptsFor(q, mode) {
    if (!G.duel) return 1;
    if (q.kind === "qcm") return mode === "duo" ? 1 : 2;
    if (q.kind === "intrus") return 2;
    return 1;
  }

  function answer(q, val, btn) {
    if (q.done) return;
    q.done = true;
    clearInterval(timerId);
    const left = timeLeft();
    let ok = false, info = "", detail = "";
    play.querySelectorAll(".ans, #valider, .steps button, #yr").forEach((b) => (b.disabled = true));
    if (q.kind === "qcm") {
      ok = val === q.correct;
      play.querySelectorAll(".ans").forEach((b) => { if (b.dataset.v === q.correct) b.classList.add("good"); else if (b === btn) b.classList.add("bad"); });
      info = ok ? "" : `Bonne réponse : ${q.correct}.`;
      detail = q.ex;
    } else if (q.kind === "intrus") {
      ok = val != null && q.items[val].odd;
      play.querySelectorAll(".ans").forEach((b) => { const it = q.items[+b.dataset.k]; if (it.odd) b.classList.add("good"); else if (b === btn) b.classList.add("bad"); });
      info = ok ? "" : `L'intrus : ${q.items.find((x) => x.odd).t}.`;
      detail = q.ex;
    } else if (q.kind === "order") {
      const first = q.a.y < q.b.y ? 0 : 1;
      ok = val === first;
      play.querySelectorAll(".ans").forEach((b) => { const k = +b.dataset.k; b.innerHTML += `<br><span class="num" style="font-family:var(--display);font-size:22px">${[q.a, q.b][k].y}</span>`; if (k === first) b.classList.add("good"); else if (b === btn) b.classList.add("bad"); });
      info = `${q.a.e} : ${q.a.y}. ${q.b.e} : ${q.b.y}.`;
    } else if (q.kind === "date") {
      const gap = val == null ? Infinity : Math.abs(val - q.y);
      q.guess = val; q.gap = gap;
      ok = gap <= (q.tol ?? 2);
      $("#yv").textContent = q.y;
      info = val == null ? `Temps écoulé. C'était en ${q.y}.` : gap === 0 ? `Pile ${q.y} !` : `C'était en ${q.y} : tu étais à ${gap} an${gap > 1 ? "s" : ""}.`;
      detail = q.ex;
    }
    // Score
    let gain = 0;
    if (q.sd) G.sdGuesses.push(val == null ? null : val);
    else {
      G.answered++;
      if (ok) { G.correct++; gain = G.daily ? 100 + Math.round(left * 5) : ptsFor(q, q.mode); G.me += gain; }
      else if (G.hearts != null) G.hearts--;
    }
    // Adversaire
    let oppLine = "";
    if (G.bot && !q.sd) {
      const b = G.bot(q);
      if (b.ok) G.opp += b.pts;
      oppLine = `${G.opponent.name} : ${b.ok ? "bonne réponse" : "raté"}${b.mode ? ` (en ${b.mode})` : ""}${b.ok ? ` · +${b.pts}` : ""}`;
    }
    let verdict = null;
    if (q.sd && G.bot) {
      const bg = Math.round(q.y + gauss() * 9);
      const bgap = Math.abs(bg - q.y);
      oppLine = `${G.opponent.name} a répondu ${bg} (${bgap} an${bgap > 1 ? "s" : ""} d'écart).`;
      if (q.gap < bgap) verdict = "win"; else if (q.gap > bgap) verdict = "lose";
      G.sdResult = verdict;
    }
    G.log.push({ kind: q.kind, ok });
    // Feuille de correction
    const cls = q.sd ? (verdict === "win" ? "ok" : verdict === "lose" ? "ko" : "neutral") : ok ? "ok" : "ko";
    const title = q.sd ? (verdict === "win" ? "Tu remportes la mort subite !" : verdict === "lose" ? "Perdu à la mort subite" : G.bot ? "Égalité parfaite : on continue" : "Réponse enregistrée")
      : ok ? (gain > 1 ? `Bravo ! +${gain}` : "Bravo !") : val == null ? "Temps écoulé" : "Raté";
    const sheet = document.createElement("div");
    sheet.className = `sheet ${cls}`;
    sheet.innerHTML = `<div class="wrap"><h3>${ok || verdict === "win" ? ICON.check.replace("<svg", '<svg width="24" height="24"') : ""}${esc(title)}</h3>
      ${info ? `<p><strong>${esc(info)}</strong></p>` : ""}${detail ? `<p>${esc(detail)}</p>` : ""}
      ${oppLine ? `<p class="opp-line">${esc(oppLine)}</p>` : ""}
      <button class="btn wide ${cls === "ko" ? "ghost" : ""}" id="cont">Continuer</button></div>`;
    play.appendChild(sheet);
    if (G.duel) { const p = play.querySelectorAll(".pts"); if (p[0]) p[0].textContent = G.me; if (p[1] && !G.opponent.hidden) p[1].textContent = G.opp; }
    if (G.hearts != null) { const h = play.querySelector(".hearts .num"); if (h) h.textContent = G.hearts; }
    $("#cont").focus();
    $("#cont").onclick = () => {
      G.i++;
      if (q.sd && G.bot && verdict) return finish();
      if (G.endless && !ok) return finish();
      next();
    };
  }

  function finish() {
    clearInterval(timerId);
    const r = G.onEnd ? G.onEnd(G) : null;
    if (!r) return quit();
    play.innerHTML = `<div class="wrap"><div class="splash">
      <div class="ico" style="background:${r.bg || "var(--gold)"};color:${r.fg || "#2b1d00"}">${r.icon || ICON.star}</div>
      <p class="label">${esc(r.kicker || "Partie terminée")}</p>
      <h1 class="big">${esc(r.title)}</h1>
      ${r.text ? `<p class="rules">${r.text}</p>` : ""}
      ${r.stats ? `<div class="result-grid">${r.stats.map(([v, l]) => `<div class="stat"><b class="num">${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>` : ""}
      ${r.extra || ""}
      <button class="btn" id="done">${esc(r.cta || "Terminer")}</button>
    </div></div>`;
    $("#done").onclick = () => { const after = r.after; quit(); if (after) after(); };
    if (r.mount) r.mount();
  }

  // ================= Modes =================
  // 1. Parcours façon Duolingo : 4 unités de 5 leçons, 3 vies par leçon.
  const UNITS = [["eco", "Économie", "Monnaies, banques, crises"], ["geo", "Géopolitique", "Alliances, détroits, puissances"], ["hist", "Histoire", "Dirigeants et tournants"], ["carte", "Géographie", "Capitales, fleuves, frontières"]];
  const LESSONS = 5;
  function lessonQs(th, n) {
    const r = rng(`lecon-${th}-${n}`);
    const pool = byTheme(th);
    const qs = pick(pool.qcm, 4, r).map((x) => mkQcm(x, r));
    if (pool.intrus.length) qs.push(mkIntrus(pool.intrus[Math.floor(r() * pool.intrus.length)], r));
    const d = pick(pool.dates.length >= 2 ? pool.dates : DATES, 2, r).map(mkDate);
    qs.push(...d);
    return shuffle(qs, r).slice(0, 7);
  }
  function startLesson(th, n, label) {
    startGame({
      qs: lessonQs(th, n), hearts: 3,
      onEnd: (g) => {
        const passed = g.hearts > 0;
        const xp = g.correct * 10 + (passed ? 20 : 0);
        if (passed) S.lessons[`${th}-${n}`] = true;
        addXp(xp);
        return passed
          ? { kicker: label, title: "Leçon réussie !", stats: [[`${g.correct}/${g.answered}`, "bonnes réponses"], [`+${xp}`, "XP"], [String(S.streak), "jours de suite"]] }
          : { kicker: label, title: "Plus de vies…", text: "Les explications restent à lire à chaque erreur. Retente la leçon : les mêmes questions reviennent, c'est le moment de les retenir.", bg: "var(--red)", fg: "#2a0006", icon: ICON.heart, stats: [[`${g.correct}`, "bonnes réponses"], [`+${xp}`, "XP"], [String(S.streak), "jours de suite"]] };
      },
    });
  }

  // 2. Défi du jour : 10 questions, les mêmes pour tout le monde, chrono de 20 s.
  function dailyQs(day = today()) {
    const r = rng(`defi-${day}`);
    const qs = [
      ...pick(QCM, 4, r).map((x) => mkQcm(x, r)),
      ...pick(INTRUS, 2, r).map((x) => mkIntrus(x, r)),
      mkOrder(r), mkOrder(r),
      ...pick(DATES, 2, r).map(mkDate),
    ];
    return shuffle(qs, r);
  }
  function startDaily() {
    startGame({
      qs: dailyQs(), timer: 20, daily: true,
      onEnd: (g) => {
        S.daily = { date: today(), score: g.me, correct: g.correct };
        addXp(g.correct * 10 + 30);
        publishDaily();
        return { kicker: "Défi du jour", title: `${g.me} points`, text: "Une réponse juste vaut 100 points, plus 5 points par seconde restante. Reviens demain pour un nouveau défi.", stats: [[`${g.correct}/10`, "bonnes réponses"], [`+${g.correct * 10 + 30}`, "XP"], [String(S.streak), "jours de suite"]], cta: "Voir le classement", after: () => setTab("classement") };
      },
    });
  }

  // 3. Duel en trois manches, puis mort subite sur les dates.
  function duelQs(seed) {
    const r = rng(`duel-${seed}`);
    const QS = [];
    QS.push({ kind: "splash", kicker: "Manche 1", title: "Duo ou carré", icon: '<b style="font:800 30px var(--display)">1</b>', bg: "var(--blue)", fg: "#021327", rules: "Quatre questions. Pour chacune, choisis avant de voir les réponses : <strong>duo</strong> (2 propositions, 1 point) ou <strong>carré</strong> (4 propositions, 2 points)." });
    QS.push(...pick(QCM, 4, r).map((x) => Object.assign(mkQcm(x, r), { timer: 20 })));
    QS.push({ kind: "splash", kicker: "Manche 2", title: "L'intrus", icon: '<b style="font:800 30px var(--display)">2</b>', bg: "var(--gold)", fg: "#2b1d00", rules: "Six propositions, une seule ne colle pas avec les autres. Trouve-la : 2 points." });
    QS.push(...pick(INTRUS, 2, r).map((x) => Object.assign(mkIntrus(x, r), { timer: 25 })));
    QS.push({ kind: "splash", kicker: "Manche 3", title: "Avant ou après", icon: '<b style="font:800 30px var(--display)">3</b>', bg: "var(--mint)", fg: "#062317", rules: "Deux événements : lequel est arrivé en premier ? Trois questions, 8 secondes chacune, 1 point." });
    for (let k = 0; k < 3; k++) QS.push(Object.assign(mkOrder(r), { timer: 8 }));
    const sd = pick(DATES, 3, r).map((d) => Object.assign(mkDate(d), { sd: true, timer: 25 }));
    return { qs: QS, sd };
  }
  const sdSplash = (friend) => ({ kind: "splash", sd: true, kicker: friend ? "Départage" : "Égalité !", title: "Mort subite", icon: ICON.skull, bg: "var(--red)", fg: "#2a0006", rules: friend ? "Trois dates à trouver. Elles ne comptent qu'en cas d'égalité avec ton adversaire : le plus proche de la bonne année l'emporte." : "Une date, deux réponses. Le plus proche de la bonne année gagne le duel. Si vous êtes à égalité parfaite, on en tire une autre." });

  function startBotDuel() {
    const seed = Math.random().toString(36).slice(2);
    const { qs, sd } = duelQs(seed);
    const extra = shuffle(DATES).slice(0, 6).map((d) => Object.assign(mkDate(d), { sd: true, timer: 25 }));
    startGame({
      qs, duel: true, duoCarre: true,
      opponent: { name: "Le Maître", short: "M" },
      bot: (q) => {
        const behind = G.me - G.opp;
        const mode = q.kind === "qcm" ? (Math.random() < 0.5 ? "duo" : "carré") : null;
        let p = q.kind === "qcm" ? (mode === "duo" ? 0.82 : 0.62) : q.kind === "intrus" ? 0.6 : 0.68;
        p = Math.min(0.95, Math.max(0.2, p + behind * 0.07));
        return { ok: Math.random() < p, pts: q.kind === "qcm" ? (mode === "duo" ? 1 : 2) : q.kind === "intrus" ? 2 : 1, mode };
      },
      onRegularEnd: () => (G.me === G.opp ? [sdSplash(false), ...sd, ...extra] : null),
      onEnd: (g) => {
        const win = g.sdResult ? g.sdResult === "win" : g.me > g.opp;
        S.played++; if (win) S.wins++;
        addXp(g.correct * 10 + (win ? 40 : 10));
        return {
          kicker: g.sdResult ? "Décidé à la mort subite" : "Fin du duel",
          title: win ? "Victoire !" : "Le Maître l'emporte",
          bg: win ? "var(--gold)" : "var(--blue)", fg: win ? "#2b1d00" : "#021327", icon: win ? ICON.star : ICON.swords,
          stats: [[`${g.me} – ${g.opp}`, "score"], [`+${g.correct * 10 + (win ? 40 : 10)}`, "XP"], [`${S.wins}/${S.played}`, "duels gagnés"]],
          cta: "Rejouer", after: startBotDuel,
        };
      },
    });
  }

  // Duel contre un ami : même code = mêmes questions. Chacun joue de son côté, le résultat s'affiche quand les deux ont joué.
  const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
  function startFriendDuel(code, isHost) {
    if (!db || !me) return;
    const { qs, sd } = duelQs(code);
    startGame({
      qs: [...qs, sdSplash(true), ...sd], duel: true, duoCarre: true,
      opponent: { name: isHost ? "Ton ami" : "Ton adversaire", short: "?", hidden: true },
      onEnd: (g) => {
        const doc = { code, score: g.me, sd: g.sdGuesses.map((v, k) => (v == null ? 999 : Math.abs(v - sd[k].y))), at: Date.now() };
        db.collection("duels").doc(`${code}-${me}`).set(doc).catch(() => {});
        if (!S.duels.includes(code)) S.duels.unshift(code);
        S.duels = S.duels.slice(0, 8);
        addXp(g.correct * 10 + 20);
        return {
          kicker: `Duel ${code}`, title: `${g.me} points`, icon: ICON.swords, bg: "var(--blue)", fg: "#021327",
          extra: `<div class="card" style="width:100%;max-width:420px" id="duel-res"><p class="muted">Recherche du résultat…</p></div>`,
          mount: () => watchDuel(code, $("#duel-res")),
          cta: "Retour aux défis", after: () => setTab("defis"),
        };
      },
    });
  }

  // ================= Partage (db) =================
  let db = null, user = null, me = null, names = {}, dailyRows = [], dailyUnsub = null, duelUnsub = null;
  async function initShared() {
    try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
    try { user = await window.claude?.use?.("user"); } catch (e) { user = null; }
    try { me = user ? await user.id() : null; } catch (e) { me = null; }
    if (db) {
      dailyUnsub = db.collection("defi").where("date", "==", today()).onSnapshot((snap) => {
        dailyRows = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => b.score - a.score);
        resolveNames(dailyRows.map((r) => r.id)).then(() => { if (tab === "classement") render(); });
      }, () => {});
    }
    render();
  }
  async function resolveNames(ids) {
    if (!user || !ids.length) return;
    try { const ps = await user.profiles(ids); Object.entries(ps || {}).forEach(([id, p]) => { names[id] = (p && p.name) || ""; }); } catch (e) {}
  }
  function publishDaily() {
    if (!db || !me || !S.daily) return;
    db.collection("defi").doc(me).set({ date: S.daily.date, score: S.daily.score, correct: S.daily.correct, at: Date.now() }).catch(() => {});
  }
  function watchDuel(code, el) {
    if (duelUnsub) { duelUnsub(); duelUnsub = null; }
    if (!db || !el) return;
    duelUnsub = db.collection("duels").where("code", "==", code).onSnapshot(async (snap) => {
      const rows = snap.docs.map((d) => Object.assign({ uid: d.id.slice(code.length + 1) }, d.data()));
      await resolveNames(rows.map((r) => r.uid));
      const mine = rows.find((r) => r.uid === me), other = rows.find((r) => r.uid !== me);
      if (!document.body.contains(el)) { duelUnsub && duelUnsub(); duelUnsub = null; return; }
      if (!mine) { el.innerHTML = `<p class="muted">Tu n'as pas encore joué ce duel.</p>`; return; }
      if (!other) {
        el.innerHTML = `<p class="label">En attente de ton adversaire</p><p>Envoie-lui ce code. Il l'entre dans « Défis » pour jouer les mêmes questions :</p><p class="code">${code}</p><button class="btn ghost" id="copy">Copier le code</button>`;
        const c = el.querySelector("#copy");
        c.onclick = () => navigator.clipboard?.writeText(code).then(() => (c.textContent = "Code copié"), () => (c.textContent = code));
        return;
      }
      let out = mine.score > other.score ? "win" : mine.score < other.score ? "lose" : null, how = "";
      if (!out) {
        for (let k = 0; k < 3 && !out; k++) { if (mine.sd[k] < other.sd[k]) out = "win"; else if (mine.sd[k] > other.sd[k]) out = "lose"; }
        how = out ? "Égalité : décidé à la mort subite sur les dates." : "Égalité parfaite, même à la mort subite !";
      }
      const oname = names[other.uid] || "Ton adversaire";
      el.innerHTML = `<p class="label">${out === "win" ? "Victoire" : out === "lose" ? "Défaite" : "Match nul"}</p>
        <h3 style="font-size:30px;margin:6px 0" class="num">${mine.score} – ${other.score}</h3>
        <p class="muted">Toi contre ${esc(oname)}. ${how}</p>
        ${mine.sd && other.sd ? `<p class="note">Mort subite (écart en années) : toi ${mine.sd.map((x) => (x === 999 ? "–" : x)).join(" · ")}, ${esc(oname)} ${other.sd.map((x) => (x === 999 ? "–" : x)).join(" · ")}</p>` : ""}`;
    }, () => { el.innerHTML = `<p class="muted">Résultat indisponible pour le moment.</p>`; });
  }

  // ================= Écrans =================
  let tab = "parcours";
  function setTab(t) { tab = t; render(); window.scrollTo(0, 0); }
  document.querySelectorAll(".tab").forEach((b) => b.onclick = () => setTab(b.dataset.tab));

  function msToMidnight() { const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); const s = Math.floor((m - n) / 1000); return `${Math.floor(s / 3600)} h ${pad(Math.floor((s % 3600) / 60))}`; }
  function dailyCard() {
    const done = S.daily && S.daily.date === today();
    return `<section class="card daily">
      <p class="label" style="color:var(--mint)">Défi du jour · ${new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}</p>
      <h2>${done ? `Fait : ${S.daily.score} points` : "10 questions, les mêmes pour tout le monde"}</h2>
      <div class="meta"><span>⏱ 20 s par question</span><span>Prochain défi dans ${msToMidnight()}</span></div>
      ${done ? `<button class="btn ghost" data-go="classement">Voir le classement</button>` : `<button class="btn" id="daily-go">Jouer le défi</button>`}
    </section>`;
  }

  function viewParcours() {
    let firstOpen = null;
    const units = UNITS.map(([th, name, sub], u) => {
      const nodes = Array.from({ length: LESSONS }, (_, n) => {
        const done = !!S.lessons[`${th}-${n}`];
        const prevDone = n === 0 || !!S.lessons[`${th}-${n - 1}`];
        const state = done ? "done" : prevDone ? "current" : "locked";
        if (state === "current" && !firstOpen) firstOpen = `${th}-${n}`;
        const x = Math.round(Math.sin((n + u) * 1.3) * 70);
        return `<div style="transform:translateX(${x}px);display:grid;justify-items:center">
          ${state === "current" && firstOpen === `${th}-${n}` ? `<span class="bubble">Commencer</span>` : ""}
          <button class="node ${state}" data-lesson="${th}-${n}" aria-label="${name}, leçon ${n + 1}${state === "locked" ? " (verrouillée)" : ""}">${state === "done" ? ICON.check : state === "locked" ? ICON.lock : n + 1}</button></div>`;
      }).join("");
      const count = Array.from({ length: LESSONS }, (_, n) => S.lessons[`${th}-${n}`]).filter(Boolean).length;
      return `<section class="unit u-${th}"><div class="unit-head"><div><h3>Unité ${u + 1} · ${name}</h3><p>${sub}</p></div><span class="num" style="font-weight:800">${count}/${LESSONS}</span></div><div class="path">${nodes}</div></section>`;
    }).join("");
    return `<div class="stack">${dailyCard()}</div>${units}`;
  }

  function viewDefis() {
    const shared = !!(db && me);
    return `<div class="stack">
      ${dailyCard()}
      <section class="card mode">
        <div class="mode-ico" style="background:#16243d;color:var(--blue)">${ICON.swords}</div>
        <div>
          <h3>Duel 1 contre 1</h3>
          <p>Trois manches : duo ou carré, l'intrus, avant ou après. En cas d'égalité, mort subite sur une date : le plus proche gagne.</p>
          <div class="btns"><button class="btn blue" id="bot-go">Contre le Maître</button>${shared ? `<button class="btn ghost" id="friend-go">Défier un ami</button>` : ""}</div>
          ${shared ? `<div class="join"><input id="code-in" maxlength="5" placeholder="CODE" autocomplete="off" aria-label="Code de duel reçu"><button class="btn ghost" id="join-go">Rejoindre</button></div>
          <p class="note" id="join-msg"></p>
          ${S.duels.length ? `<p class="label" style="margin-top:16px">Mes duels</p><div class="duel-list">${S.duels.map((c) => `<button class="duel-item" data-duel="${c}"><b>${c}</b><span class="muted">Voir le résultat ›</span></button>`).join("")}</div><div id="duel-view" style="margin-top:12px"></div>` : ""}`
          : `<p class="note">Le duel entre amis et le classement ont besoin du mode partagé : ouvre cette page sur claude.ai, connecté.</p>`}
        </div>
      </section>
      <section class="card mode">
        <div class="mode-ico" style="background:#3a141b;color:var(--red)">${ICON.skull}</div>
        <div>
          <h3>Mort subite des dates</h3>
          <p>Trouve l'année, à quelques ans près. La marge se resserre à chaque date. Une erreur, et c'est fini.</p>
          <div class="btns"><button class="btn ghost" id="sd-go">Jouer</button><span class="muted" style="align-self:center">Record : <strong class="num" style="color:var(--gold)">${S.best}</strong></span></div>
        </div>
      </section>
    </div>`;
  }

  function viewClassement() {
    const t = today();
    let list;
    if (!db) list = `<p class="muted">Le classement partagé s'affiche quand la page est ouverte sur claude.ai, connecté.</p>`;
    else if (!dailyRows.length) list = `<p class="muted">Personne n'a encore joué le défi d'aujourd'hui. Sois le premier : ton score apparaîtra ici pour tous les joueurs.</p>`;
    else list = `<ol class="rank">${dailyRows.slice(0, 30).map((r, k) => `<li class="${r.id === me ? "me" : ""}"><span class="pos num">${k + 1}</span><span>${esc((r.id === me ? "Toi" : names[r.id]) || "Joueur")}</span><span class="num" style="font-weight:800">${r.score}</span></li>`).join("")}</ol>`;
    return `<div class="stack">
      <section class="card"><p class="label">Défi du ${new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long" })}</p><h2 style="font-size:26px;margin-top:4px">Classement du jour</h2>${list}</section>
      <section class="card"><p class="label">Tes chiffres</p>
        <div class="stats" style="margin-top:12px">
          <div class="stat"><b class="num">${S.xp}</b><span>XP</span></div>
          <div class="stat"><b class="num">${renderStreak()}</b><span>jours de suite</span></div>
          <div class="stat"><b class="num">${S.wins}/${S.played}</b><span>duels gagnés</span></div>
          <div class="stat"><b class="num">${Object.keys(S.lessons).length}</b><span>leçons</span></div>
          <div class="stat"><b class="num">${S.best}</b><span>record mort subite</span></div>
          <div class="stat"><b class="num">${QCM.length + DATES.length + INTRUS.length}</b><span>questions en banque</span></div>
        </div></section>
    </div>`;
  }
  const renderStreak = () => (S.lastDay === today() || S.lastDay === yesterday() ? S.streak : 0);

  function startSuddenDeath() {
    const tols = [10, 8, 6, 5, 4, 3, 3, 2, 2, 1];
    const bag = shuffle(DATES);
    let k = 0;
    startGame({
      qs: [], endless: () => { const d = mkDate(bag[k % bag.length]); d.tol = tols[Math.min(k, tols.length - 1)]; d.timer = 30; k++; return d; },
      onEnd: (g) => {
        const isRecord = g.correct > S.best;
        if (isRecord) S.best = g.correct;
        addXp(g.correct * 10);
        return { kicker: "Mort subite", title: `${g.correct} date${g.correct > 1 ? "s" : ""} d'affilée`, text: isRecord && g.correct ? "Nouveau record !" : `Ton record : ${S.best}.`, icon: ICON.skull, bg: "var(--red)", fg: "#2a0006", cta: "Rejouer", after: startSuddenDeath };
      },
    });
  }

  function render() {
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    const v = $("#view");
    v.innerHTML = tab === "parcours" ? viewParcours() : tab === "defis" ? viewDefis() : viewClassement();
    renderCounters();
    const dg = $("#daily-go"); if (dg) dg.onclick = startDaily;
    v.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => setTab(b.dataset.go));
    v.querySelectorAll("[data-lesson]").forEach((b) => b.onclick = () => {
      if (b.classList.contains("locked")) return;
      const [th, n] = b.dataset.lesson.split("-");
      startLesson(th, +n, `${THEME[th]} · leçon ${+n + 1}`);
    });
    const bg = $("#bot-go"); if (bg) bg.onclick = startBotDuel;
    const sg = $("#sd-go"); if (sg) sg.onclick = startSuddenDeath;
    const fg = $("#friend-go"); if (fg) fg.onclick = () => startFriendDuel(newCode(), true);
    const jg = $("#join-go");
    if (jg) jg.onclick = async () => {
      const code = $("#code-in").value.trim().toUpperCase();
      const msg = $("#join-msg");
      if (!/^[A-Z0-9]{5}$/.test(code)) { msg.textContent = "Le code fait 5 caractères, par exemple K7RMX."; return; }
      try {
        const snap = await db.collection("duels").doc(`${code}-${me}`).get();
        if (snap.exists) { msg.textContent = "Tu as déjà joué ce duel : voici le résultat."; showDuel(code); return; }
      } catch (e) {}
      startFriendDuel(code, false);
    };
    v.querySelectorAll("[data-duel]").forEach((b) => b.onclick = () => showDuel(b.dataset.duel));
  }
  function showDuel(code) { const box = $("#duel-view") || $("#join-msg"); if (!box) return; box.innerHTML = `<div class="card" style="background:var(--panel-2)"><p class="muted">Chargement…</p></div>`; watchDuel(code, box.firstElementChild); }

  document.addEventListener("keydown", (e) => {
    if (!G || play.hidden) return;
    const c = $("#cont");
    if (c && e.key === "Enter") { e.preventDefault(); c.click(); }
  });

  render();
  initShared();
})();
</script>
